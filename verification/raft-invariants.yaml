invariants:
  - id: "ST-01"
    kind: "well_formedness"
    family: "state"
    tier: "meta"
    priority: "p1"
    title: "State well-formedness"
    statement: "Protocol state is internally well formed: log indexes are contiguous above the snapshot boundary; commit/applied indexes are in range; memberships and read records are valid; derived configuration indexes equal the log."
    current_coverage:
      tla: "TypeOK"
      simulator: "P: validate_derived_state only"
      tests: "D: bootstrap/property/derived-state tests"
      maelstrom: "none"
    required_action: "Expand the simulator oracle from configuration offsets to a full TypeOK-style state validator."
  - id: "EL-01"
    kind: "safety"
    family: "election"
    tier: "feature"
    priority: "p1"
    title: "Term monotonicity"
    statement: "A node's current term never decreases, including across restart."
    current_coverage:
      tla: "P: transition semantics"
      simulator: "none"
      tests: "D: election + runtime hard-state tests"
      maelstrom: "none"
    required_action: "Track a per-node term floor in ExplorationState and fail on regression."
  - id: "EL-02"
    kind: "safety"
    family: "election"
    tier: "feature"
    priority: "p1"
    title: "One durable vote per term"
    statement: "A server grants at most one binding vote in a term, and the recorded vote survives restart."
    current_coverage:
      tla: "P: votedFor semantics"
      simulator: "none"
      tests: "D: election and runtime restart tests"
      maelstrom: "none"
    required_action: "Add vote history to the simulator, including lossy-restart schedules."
  - id: "EL-03"
    kind: "safety"
    family: "election"
    tier: "feature"
    priority: "p1"
    title: "Safe vote eligibility"
    statement: "A binding vote is granted only to an eligible candidate whose log is at least as up to date as the voter's log."
    current_coverage:
      tla: "P: RequestVote action"
      simulator: "none"
      tests: "D: election/membership tests"
      maelstrom: "none"
    required_action: "Add an explicit vote-grant oracle recording voter log and effective membership at grant time."
  - id: "EL-04"
    kind: "safety"
    family: "election"
    tier: "feature"
    priority: "p1"
    title: "Durable authority before output"
    statement: "Term and vote changes are durable before RequestVote or a granted vote response, or any other authority-bearing output, escapes."
    current_coverage:
      tla: "none"
      simulator: "none"
      tests: "D: rafter-runtime hard_state tests"
      maelstrom: "P: durable runtime exercised"
    required_action: "Keep this as a runtime invariant; add failure-injection coverage for every authority-bearing output class."
  - id: "EL-05"
    kind: "safety"
    family: "election"
    tier: "canonical"
    priority: "p0"
    title: "Election safety over history"
    statement: "Across the entire execution, at most one node is elected leader in a term."
    current_coverage:
      tla: "D: ElectionSafety"
      simulator: "P: checks leaders in current state only"
      tests: "P: bounded election tests"
      maelstrom: "none"
    required_action: "Record role transitions/election certificates by term; current-state-only checking is weaker than the temporal property."
  - id: "EL-06"
    kind: "safety"
    family: "election"
    tier: "feature"
    priority: "p0"
    title: "Leader has a valid election quorum"
    statement: "Only an effective voter may campaign/become leader, and election requires the effective quorum; joint membership requires both majorities."
    current_coverage:
      tla: "P: election transition"
      simulator: "P: explored behavior"
      tests: "D: membership/election properties"
      maelstrom: "none"
    required_action: "Record election certificates and validate them against membership at election time."
  - id: "EL-07"
    kind: "safety"
    family: "election"
    tier: "feature"
    priority: "p1"
    title: "Term and authority fencing"
    statement: "Higher-term authority makes a node update term and step down; stale-term traffic cannot establish leadership, lower durable state, or confirm reads/transfers."
    current_coverage:
      tla: "D: StaleLeaderFencing (abstract)"
      simulator: "P: explored behavior"
      tests: "D: election/read/transfer tests"
      maelstrom: "P: partitions and leader restart"
    required_action: "Add a single cross-message simulator oracle keyed by message term and pre/post authority state."
  - id: "EL-08"
    kind: "safety"
    family: "election"
    tier: "feature"
    priority: "p1"
    title: "Pre-vote is non-binding and non-disruptive"
    statement: "Pre-vote does not mutate durable term/vote, and an isolated stale node cannot inflate terms or disrupt a healthy leader."
    current_coverage:
      tla: "none"
      simulator: "P: pre-vote profiles/soak"
      tests: "D: pre_vote + runtime hard-state tests"
      maelstrom: "P: naturally exercised, not observed"
    required_action: "Add pre-vote state/history predicates to the simulator and a dedicated partition-heal scenario."
  - id: "LG-01"
    kind: "safety"
    family: "log"
    tier: "canonical"
    priority: "p0"
    title: "Leader append-only"
    statement: "While leader in a term, a node never overwrites or deletes entries in its own log."
    current_coverage:
      tla: "P: transition semantics"
      simulator: "none"
      tests: "P: replication scenarios"
      maelstrom: "none"
    required_action: "Track each leader-term log prefix and assert it is prefix-monotone."
  - id: "LG-02"
    kind: "safety"
    family: "log"
    tier: "feature"
    priority: "p0"
    title: "Truthful AppendEntries acceptance"
    statement: "A follower accepts AppendEntries only when the previous index/term matches its log or snapshot boundary; a success response's match index names the stored leader-identical suffix."
    current_coverage:
      tla: "P: Append transition"
      simulator: "none"
      tests: "D: replication/conflict tests"
      maelstrom: "none"
    required_action: "Add a message-delivery oracle comparing the accepted frame with post-state and emitted response."
  - id: "LG-03"
    kind: "safety"
    family: "log"
    tier: "canonical"
    priority: "p0"
    title: "Log matching"
    statement: "If two logs contain an entry with the same index and term, their prefixes through that index are identical."
    current_coverage:
      tla: "D: LogMatching"
      simulator: "P: only committed-index agreement"
      tests: "P: replication scenarios"
      maelstrom: "none"
    required_action: "Add a full-log pairwise oracle, including uncommitted suffixes and snapshot boundaries."
  - id: "LG-04"
    kind: "safety"
    family: "log"
    tier: "feature"
    priority: "p1"
    title: "Committed-prefix stability"
    statement: "A committed entry is never truncated or overwritten, and every replica that reports the index committed has the same entry."
    current_coverage:
      tla: "D: CommittedPrefixStability"
      simulator: "D: committed prefixes + forbidden payload seeds"
      tests: "D: conflict-repair/seeded tests"
      maelstrom: "E2E: client history catches visible violations"
    required_action: "Retain the direct checker; give it its own invariant ID and negative fixture."
  - id: "LG-05"
    kind: "safety"
    family: "log"
    tier: "canonical"
    priority: "p0"
    title: "Leader completeness"
    statement: "Every leader elected in a later term contains every entry committed in an earlier term."
    current_coverage:
      tla: "D: LeaderCompleteness"
      simulator: "none"
      tests: "P: leadership no-op/failover scenarios"
      maelstrom: "E2E: indirect"
    required_action: "Add leader-election history plus committed-entry floors and check at every election transition."
  - id: "CM-01"
    kind: "safety"
    family: "commit"
    tier: "feature"
    priority: "p1"
    title: "Commit-index monotonicity and bounds"
    statement: "A node's commit index never decreases and never exceeds its locally retained or snapshot-covered last index."
    current_coverage:
      tla: "P: TypeOK/transition semantics"
      simulator: "D"
