clauses:
  - id: "ST-01.a"
    invariant_id: "ST-01"
    statement: "Log indexes are contiguous above the snapshot boundary."
    scope: "One Raft node's protocol and derived state at bootstrap and after every instrumented transition."
    assumptions: "Node IDs, log indexes, terms, and configuration identities are created through supported APIs; verifier history is immutable."
    required: "true"
  - id: "ST-01.b"
    invariant_id: "ST-01"
    statement: "Commit and applied indexes remain within the locally represented logical log."
    scope: "One Raft node's protocol and derived state at bootstrap and after every instrumented transition."
    assumptions: "Node IDs, log indexes, terms, and configuration identities are created through supported APIs; verifier history is immutable."
    required: "true"
  - id: "ST-01.c"
    invariant_id: "ST-01"
    statement: "Membership and pending-read records are internally valid."
    scope: "One Raft node's protocol and derived state at bootstrap and after every instrumented transition."
    assumptions: "Node IDs, log indexes, terms, and configuration identities are created through supported APIs; verifier history is immutable."
    required: "true"
  - id: "ST-01.d"
    invariant_id: "ST-01"
    statement: "Derived configuration indexes and identities agree with the retained log and snapshot."
    scope: "One Raft node's protocol and derived state at bootstrap and after every instrumented transition."
    assumptions: "Node IDs, log indexes, terms, and configuration identities are created through supported APIs; verifier history is immutable."
    required: "true"
  - id: "EL-01.a"
    invariant_id: "EL-01"
    statement: "A node's current term never decreases during live protocol transitions."
    scope: "One Raft group across election, message-delivery, partition, and restart transitions."
    assumptions: "Messages may be delayed, duplicated, reordered, or dropped; durable writes report success only after persistence."
    required: "true"
  - id: "EL-01.b"
    invariant_id: "EL-01"
    statement: "A node's current term never decreases across restart."
    scope: "One Raft group across election, message-delivery, partition, and restart transitions."
    assumptions: "Messages may be delayed, duplicated, reordered, or dropped; durable writes report success only after persistence."
    required: "true"
  - id: "EL-02.a"
    invariant_id: "EL-02"
    statement: "A server grants at most one binding vote in each term."
    scope: "One Raft group across election, message-delivery, partition, and restart transitions."
    assumptions: "Messages may be delayed, duplicated, reordered, or dropped; durable writes report success only after persistence."
    required: "true"
  - id: "EL-02.b"
    invariant_id: "EL-02"
    statement: "A recorded binding vote survives restart."
    scope: "One Raft group across election, message-delivery, partition, and restart transitions."
    assumptions: "Messages may be delayed, duplicated, reordered, or dropped; durable writes report success only after persistence."
    required: "true"
  - id: "EL-03.a"
    invariant_id: "EL-03"
    statement: "A binding vote is granted only to a candidate eligible in the effective membership."
    scope: "One Raft group across election, message-delivery, partition, and restart transitions."
    assumptions: "Messages may be delayed, duplicated, reordered, or dropped; durable writes report success only after persistence."
    required: "true"
  - id: "EL-03.b"
