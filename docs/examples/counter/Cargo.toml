[package]
name = "rafter-counter"
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.88"

[workspace]

[dependencies]
rafter = { git = "https://github.com/zsumz/rafter", rev = "7151197c051502173b387934000a2d1829047e17" }
rafter-app = { git = "https://github.com/zsumz/rafter", rev = "7151197c051502173b387934000a2d1829047e17" }
rafter-storage = { git = "https://github.com/zsumz/rafter", rev = "7151197c051502173b387934000a2d1829047e17" }
rafter-runtime = { git = "https://github.com/zsumz/rafter", rev = "7151197c051502173b387934000a2d1829047e17" }
rafter-service = { git = "https://github.com/zsumz/rafter", rev = "7151197c051502173b387934000a2d1829047e17", features = ["durable"] }
rafter-transport-tls = { git = "https://github.com/zsumz/rafter", rev = "7151197c051502173b387934000a2d1829047e17" }
rafter-crc32 = { git = "https://github.com/zsumz/rafter", rev = "7151197c051502173b387934000a2d1829047e17" }
