[package]
name = "rafter-transport-tls"
version = "0.0.1"
description = "Bounded mutually authenticated TLS peer transport for Rafter."
readme = "README.md"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
fs4 = { version = "1.1.0", default-features = false, features = ["sync"] }
rafter = { path = "../rafter", version = "0.0.1" }
rafter-codec = { path = "../rafter-codec", version = "0.0.1" }
rafter-crc32 = { path = "../rafter-crc32", version = "0.0.1" }
rafter-service = { path = "../rafter-service", version = "0.0.1" }
rustls = { version = "0.23.42", default-features = false, features = ["ring", "std"] }
sha2 = "0.10.9"

[dev-dependencies]
rafter-app = { path = "../rafter-app", version = "0.0.1" }
rafter-runtime = { path = "../rafter-runtime", version = "0.0.1" }
rafter-storage = { path = "../rafter-storage", version = "0.0.1" }

[lints]
workspace = true
