[package]
name = "rafter-invariants"
version = "0.0.1"
description = "Deterministic aggregation and reporting for Rafter invariant evidence."
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
edn-format = "3.3.0"
jsonschema = { version = "0.33.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
rafter = { path = "../rafter" }
rafter-sim = { path = "../rafter-sim" }
syn = { version = "2", features = ["full", "visit"] }

[lints]
workspace = true
