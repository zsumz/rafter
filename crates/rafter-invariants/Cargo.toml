[package]
name = "rafter-invariants"
version = "0.0.1"
description = "Deterministic aggregation and reporting for Rafter invariant evidence."
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
cap-fs-ext = "4.0.2"
cap-std = "4.0.2"
clap = { version = "4", features = ["derive"] }
edn-format = "3.3.0"
jsonschema = { version = "0.33.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
syn = { version = "2", features = ["full", "visit"] }
tempfile = "3"
toml = "0.8"

[target.'cfg(unix)'.dependencies]
command-fds = "0.3.3"
rustix = { version = "1.1.4", features = ["fs", "process"] }

[dev-dependencies]
quick-xml = "0.39.4"
rafter = { path = "../rafter" }
rafter-sim = { path = "../rafter-sim" }

[lints]
workspace = true
