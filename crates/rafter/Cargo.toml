[package]
name = "rafter"
version = "0.0.1"
description = "Deterministic, sans-IO Raft protocol core."
readme = "README.md"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]

[features]
internal-test-hooks = []

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
proc-macro2 = "1"
proptest = "1"
rafter-invariant-test = { path = "../rafter-invariant-test" }
syn = { version = "2", features = ["full", "visit"] }

[[bench]]
name = "kernel"
harness = false

[lints]
workspace = true
