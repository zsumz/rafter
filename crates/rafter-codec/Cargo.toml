[package]
name = "rafter-codec"
version = "0.0.2-alpha.1"
description = "Current peer-message wire codec for Rafter."
readme = "README.md"
keywords = ["raft", "codec", "wire-format", "consensus", "encoding"]
categories = ["encoding", "network-programming"]
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
rafter = { path = "../rafter", version = "=0.0.2-alpha.1" }
rafter-crc32 = { path = "../rafter-crc32", version = "=0.0.2-alpha.1" }

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
proptest = "1"

[[bench]]
name = "codec"
harness = false

[lints]
workspace = true
