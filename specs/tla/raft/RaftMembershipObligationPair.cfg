\* Membership-change proof obligation at two voters. MEASURED: EXHAUSTS AT
\* THESE BOUNDS -- wired into the nightly and weekly profiles.
\*
\* The theorem: all nine invariants hold across `EnterJoint` and `LeaveJoint`.
\* `MembershipSpec` is `Init /\ [][MembershipNext]_vars`, and `MembershipNext`
\* is `AgreementNext` plus those two actions, so it is a disjunct-subset of
\* `Next` by construction rather than by inspection -- `Next` is defined in
\* terms of the same operators. Every behavior it admits is a behavior of
\* `Spec`.
\*
\* Why this file exists next to RaftMembershipObligation.cfg. That config is the
\* three-voter statement of the same theorem, and it diverges; its header
\* records every bound that has been measured and why none of them drain. This
\* one is the largest membership bound that does drain, and it is wired because
\* a green scheduled tier that never once executes `EnterJoint` or `LeaveJoint`
\* is claiming coverage it does not have. The nightly and weekly primaries are
\* reporting-only, so the obligations are the green condition; before this
\* config was wired, that condition consisted of `CoreSpec`, `ReadSpec` and
\* `SnapshotSpec`, none of which contain a membership action at all.
\*
\* WHAT TWO VOTERS DO AND DO NOT PROVE. This exercises the membership actions
\* and their interaction with commit and apply: a configuration entry is
\* proposed, replicated, committed, applied, and left, under elections and
\* re-elections, with the nine invariants checked at every state. It is NOT
\* evidence about nondegenerate joint-quorum intersection. With |Nodes| <= 3 and
\* `OneVoterChange`, every joint configuration keeps a non-empty quorum core, so
\* the two-half conjunction never constrains more than a fixed set of nodes
\* does; the reasoning is spelled out in RaftJointQuorum.cfg. Four voters is the
\* smallest node set that reaches a joint configuration with an empty quorum
\* core, and it does not exhaust. That gap remains open and is documented in
\* docs/model-checking.md. Wiring this config narrows the "never executed"
\* gap; it does not touch the "degenerate quorum core" one.
\*
\* What it deliberately excludes: `ClientAppend`, reads, and the snapshot
\* lifecycle. Commit and apply stay, because `EnterJoint` and `LeaveJoint` both
\* guard on `Len(log[n]) = AppliedThrough(n)`, so a configuration entry must be
\* committed and applied before the next change can be proposed; a relation
\* without them would deadlock before reaching a joint configuration.
\*
\* Constant narrowing, and why each is sound for this theorem:
\*
\*   Nodes = {n1, n2}  The measured frontier, and the reason this file is a
\*         sibling rather than a re-bounding of the three-voter config. Three
\*         voters diverges at every bound level that has been tried, because
\*         asynchronous message interleaving is the binding dimension there just
\*         as it is for `CoreSpec`. Two voters is where the queue drains.
\*
\*   Values = {v1}  Inert, not merely narrow. `ClientAppend(n, value)` is the
\*         only action that reads this constant, and `MembershipNext` does not
\*         contain it, so no behavior of this spec can distinguish two values.
\*         Dropping to a singleton removes a symmetry factor and changes nothing
\*         else. This is also why `ClientAppend` is excluded rather than kept:
\*         `MaxLogLen` is the binding constraint on any joint-quorum obligation
\*         and a command entry spends a slot that completing a configuration
\*         change needs.
\*
\*   ReadRequests = {r1}  Inert for the same reason: `RegisterRead` and
\*         `GrantRead` are the only consumers and neither is in the relation.
\*
\*   MaxTerm = 3, MaxLogLen = 3  The nightly bounds, and affordable here. Three
\*         slots hold a complete change -- `EnterJoint` and `LeaveJoint` cost one
\*         entry each -- with a slot left over, so a second change can begin;
\*         three terms give elections and re-elections across a change rather
\*         than only under a single stable leader. Both were raised from the
\*         two/two starting point after measuring: MaxTerm 2 / MaxLogLen 2
\*         exhausts at 64,107 generated / 11,999 distinct in 3s, and the bounds
\*         below cost 27s for roughly sixteen times the distinct states.
\*
\* Calibration (TLC 2026.08.11.125311, -workers 4 -Xmx8g -seed 2026081101 -fp 0
\* -fpmem 0.45, SYMMETRY ModelPermutations, 14-core host): exhausts in 27
\* seconds -- 1,054,317 states generated, 162,938 distinct, 0 left on queue,
\* depth 37. The distinct count is the wired ratchet floor; state counts are
\* machine-independent, wall time is not. Wired at a 4m budget, the minimum this
\* repository gives any obligation, which is roughly 3x the ~1.4m a 2x-of-CI
\* projection with host variance predicts.
\*
\* Run it directly:
\*   java -XX:+UseParallelGC -Xmx8g -cp tools/cache/tla2tools.jar tlc2.TLC \
\*     -workers 4 -config RaftMembershipObligationPair.cfg Raft.tla

SPECIFICATION MembershipSpec

CONSTANTS
  Nodes = {n1, n2}
  Values = {v1}
  MaxTerm = 3
  MaxLogLen = 3
  ReadRequests = {r1}

INVARIANTS
  TypeOK
  ElectionSafety
  LogMatching
  LeaderCompleteness
  CommittedPrefixStability
  StateMachineSafety
  StaleLeaderFencing
  CommittedEntriesHaveQuorum
  ReadBarrierLinearizability

CHECK_DEADLOCK FALSE

SYMMETRY ModelPermutations
