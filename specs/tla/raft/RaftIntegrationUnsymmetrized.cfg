\* All-feature integration model, unsymmetrized. Weekly symmetry audit.
\*
\* Full `Spec` -- every action family enabled: elections, replication, commit,
\* apply, reads, the snapshot lifecycle, restart, application-state loss, and
\* joint membership -- at the smallest bounds where the whole product drains
\* without a symmetry quotient. The focused obligations audit their own
\* sub-relations; this config is the one place the weekly tier enumerates the
\* complete cross-feature product with no quotient at all, so symmetry
\* soundness is audited where the features interact, not only where they are
\* isolated.
\*
\* Bounds are deliberately minimal. One term and one log slot keep the
\* unquotiented product tractable (the symmetric count at these bounds is
\* 24,995 after the snapshot fold; docs/model-checking.md records it), and a
\* singleton Values makes the permutation group exactly the node swap, order
\* two. The measured distinct count is 49,985 against a full-orbit prediction
\* of 2 x 24,995 = 49,990 -- five states short, the node-swap-fixed states'
\* missing orbit mass (see RaftCoreObligationUnsymmetrized.cfg).
\*
\* Calibration (TLC 2026.08.11.125311, -workers 4 -seed 2026081101 -fp 0,
\* -fpmem 0.45, no symmetry): exhausts in 15 seconds -- 254,211 states
\* generated, 49,985 distinct, 0 left on queue. Floors are those exact counts.
\*
\* Run it directly:
\*   java -XX:+UseParallelGC -Xmx8g -cp tools/cache/tla2tools.jar tlc2.TLC \
\*     -workers 4 -config RaftIntegrationUnsymmetrized.cfg Raft.tla

SPECIFICATION Spec

CONSTANTS
  Nodes = {n1, n2}
  Values = {v1}
  MaxTerm = 1
  MaxLogLen = 1
  ReadRequests = {r1}

INVARIANTS
  TypeOK
  ElectionSafety
  LogMatching
  LeaderCompleteness
  CommittedPrefixStability
  StateMachineSafety
  StaleLeaderFencing
  CommittedEntriesHaveQuorum
  ReadBarrierLinearizability

CHECK_DEADLOCK FALSE
