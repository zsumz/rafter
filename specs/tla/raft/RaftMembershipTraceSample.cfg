SPECIFICATION TraceSpec

CONSTANTS
  n1 = n1
  n2 = n2
  n3 = n3
  v1 = v1
  r1 = r1
  Nodes = {n1, n2, n3}
  Values = {v1}
  MaxTerm = 2
  MaxLogLen = 6
  ReadRequests = {r1}

INVARIANTS
  TypeOK
  ElectionSafety
  LogMatching
  LeaderCompleteness
  CommittedPrefixStability
  StateMachineSafety
  StaleLeaderFencing
  CommittedEntriesHaveQuorum
  ReadBarrierLinearizability

PROPERTY TraceCompletes
