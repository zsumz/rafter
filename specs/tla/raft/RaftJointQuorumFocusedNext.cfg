\* Four-voter joint-quorum obligation, focused transition relation. Like
\* RaftJointQuorum.cfg this is a manual-run artifact and not a wired tier; the
\* profile contract in crates/rafter-invariants pins each profile to one of
\* RaftCi.cfg, RaftNightly.cfg, or Raft.cfg.
\*
\* Same node set and bounds as RaftJointQuorum.cfg, same nine invariants, same
\* standard Init. The one difference is the transition relation: MembershipSpec
\* uses MembershipNext, a strict disjunct-subset of ProtocolNext holding
\* election, replication, commit, apply, EnterJoint, and LeaveJoint.
\*
\* The obligation it states. Every one of the nine invariants holds over every
\* state reachable from Init by those actions at four voters, including the
\* joint configurations with an empty quorum core that no wired tier reaches:
\* Joint({n1,n2,n3,n4} -> {n1,n2,n3}) and its three siblings. Because the
\* relation is a subset of ProtocolNext under unmodified guards, every behavior
\* it admits is a behavior of Spec.
\*
\* Discharging that obligation requires TLC to drain the queue, which this
\* config has not been observed to do. Measured trajectories, and what they say
\* about where the four-voter cost actually sits, are in docs/model-checking.md.
\*
\* What it does not prove. Anything requiring an action it drops, and anything
\* about the interaction between those actions and the ones it keeps. It drops
\* ClientAppend, so no command entry is ever proposed and the invariants are
\* never tested against a command committed under joint authority --
\* RaftJointQuorum.cfg covers that, at a cost it has never finished paying. It
\* also drops reads, snapshots, restart, and application-state loss entirely.
\*
\* Symmetry is sound here: MembershipSpec starts from Init, which distinguishes
\* no node, and the spec uses no CHOOSE over Nodes on any reachable path.
\* RaftJointQuorumFocusedInit.cfg, which does distinguish a leader, omits it.
\*
\* Run it with: scripts/tla-model-check --joint-quorum-focused-next
\* Cost and current status are recorded in docs/model-checking.md.

SPECIFICATION MembershipSpec

CONSTANTS
  Nodes = {n1, n2, n3, n4}
  Values = {v1}
  MaxTerm = 1
  MaxLogLen = 2
  ReadRequests = {r1}

INVARIANTS
  TypeOK
  ElectionSafety
  LogMatching
  LeaderCompleteness
  CommittedPrefixStability
  StateMachineSafety
  StaleLeaderFencing
  CommittedEntriesHaveQuorum
  ReadBarrierLinearizability

CHECK_DEADLOCK FALSE

SYMMETRY ModelPermutations
