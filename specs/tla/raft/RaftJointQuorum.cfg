\* Four-voter joint-quorum model. This is a manual-run artifact, not a wired
\* tier: the profile contract in crates/rafter-invariants pins each profile to
\* one of RaftCi.cfg, RaftNightly.cfg, or Raft.cfg, so no fourth tier can be
\* registered without changing that contract.
\*
\* It exists because no wired tier exercises joint-consensus quorum
\* intersection. With |Nodes| <= 3 and OneVoterChange every joint configuration
\* keeps a non-empty quorum core, so the two-half conjunction never constrains
\* more than a fixed set of nodes does. Four voters is the smallest node set
\* where that stops being true: EnterJoint from Stable(Nodes) reaches
\* Joint({n1,n2,n3,n4} -> {n1,n2,n3}), whose four minimal quorums intersect
\* emptily. No two-voter change is needed, so the spec is used unmodified.
\*
\* MaxTerm = 1 and MaxLogLen = 2 are the smallest bounds that both commit that
\* joint configuration and complete the change with a following stable entry.
\* The narrow bounds are deliberate: this model is evidence about quorum
\* algebra under joint membership, not about elections or terms, which the
\* wired tiers already cover at their own bounds.
\*
\* Run it with: scripts/tla-model-check --joint-quorum
\* Cost and current status are recorded in docs/model-checking.md.

SPECIFICATION Spec

CONSTANTS
  Nodes = {n1, n2, n3, n4}
  Values = {v1}
  MaxTerm = 1
  MaxLogLen = 2
  ReadRequests = {r1}

INVARIANTS
  TypeOK
  ElectionSafety
  LogMatching
  LeaderCompleteness
  CommittedPrefixStability
  StateMachineSafety
  StaleLeaderFencing
  CommittedEntriesHaveQuorum
  ReadBarrierLinearizability

CHECK_DEADLOCK FALSE

SYMMETRY ModelPermutations
