\* Core-replication proof obligation, unsymmetrized. Weekly symmetry audit.
\*
\* Identical to RaftCoreObligation.cfg -- same theorem, same `CoreSpec`, same
\* constants -- with `SYMMETRY ModelPermutations` deliberately absent. The
\* weekly tier's distinguishing claim is unsymmetrized exploration; wiring the
\* gating obligations only under symmetry would leave that claim resting
\* entirely on the reporting monolith. This config makes the audit exhaustive:
\* every state the symmetric run quotients away is enumerated.
\*
\* The audit has a number. The permutation group here has order four (2 nodes
\* x 2 values x 1 read request), and the measured distinct count is 80,977
\* against a full-orbit prediction of 4 x 20,282 = 81,128 -- a deficit of 151
\* states, ratio 3.9926. The deficit is structural, not noise: a state fixed
\* by some permutation has an orbit smaller than the full group, so the
\* unsymmetrized count falls short of the group order times the quotient count
\* by exactly the symmetric states' missing orbit mass. A future change in
\* either number of this pair is evidence about symmetry soundness, which is
\* precisely what the weekly tier exists to provide.
\*
\* Calibration (TLC 2026.08.11.125311, -workers 4 -seed 2026081101 -fp 0,
\* -fpmem 0.45, no symmetry): exhausts in 15 seconds -- 452,327 states
\* generated, 80,977 distinct, 0 left on queue. Floors are those exact counts.
\*
\* Run it directly:
\*   java -XX:+UseParallelGC -Xmx8g -cp tools/cache/tla2tools.jar tlc2.TLC \
\*     -workers 4 -config RaftCoreObligationUnsymmetrized.cfg Raft.tla

SPECIFICATION CoreSpec

CONSTANTS
  Nodes = {n1, n2}
  Values = {v1, v2}
  MaxTerm = 2
  MaxLogLen = 2
  ReadRequests = {r1}

INVARIANTS
  TypeOK
  ElectionSafety
  LogMatching
  LeaderCompleteness
  CommittedPrefixStability
  StateMachineSafety
  StaleLeaderFencing
  CommittedEntriesHaveQuorum
  ReadBarrierLinearizability

CHECK_DEADLOCK FALSE
