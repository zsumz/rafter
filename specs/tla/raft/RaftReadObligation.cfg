\* Read-barrier proof obligation. Calibrated: this model exhausts.
\*
\* The theorem: `ReadBarrierLinearizability` holds, with the frontier fully
\* drained, over core agreement plus read registration and grant. `ReadSpec` is
\* `Init /\ [][ReadNext]_vars`, and `ReadNext` is a disjunct-subset of
\* `ProtocolNext` built from the same action operators under unmodified guards,
\* so every behavior it admits is a behavior of `Spec`.
\*
\* Commit and apply are in the relation and not optional: the barrier is stated
\* against `commitIndex`, so a relation that could not advance it would satisfy
\* the invariant vacuously. The read actions themselves touch only
\* `readRequests` and `readBarrierViolationSeen`.
\*
\* What it deliberately excludes: the snapshot lifecycle and membership change.
\* In particular this obligation says nothing about a read granted across a
\* snapshot install, which is exactly where `applied` can move backwards; that
\* interaction belongs to no current config and is not covered by splitting the
\* proof this way.
\*
\* Constant narrowing, and why each is sound for this theorem:
\*
\*   Nodes = {n1, n2}  Two voters is the measured frontier. `ReadNext` contains
\*         every disjunct of `CoreNext`, so it admits at least every state
\*         `CoreSpec` admits; `CoreSpec` diverges at three voters (4,210,497
\*         distinct and still expanding at the nightly bounds, see
\*         RaftCoreObligation.cfg), so this relation cannot exhaust there
\*         either. Two voters is where the queue drains.
\*
\*   ReadRequests = {r1}  This is the narrowing that costs something, and it is
\*         the one to revisit first. A single request exercises registration and
\*         grant and the barrier check against `commitIndex`, but it cannot
\*         exercise two reads interleaving with each other. `{r1, r2}` is the
\*         bound this obligation wants; it is unmeasured, because the host ran
\*         out of disk before it could be run. Do not raise it in CI without
\*         measuring it first.
\*
\*   MaxTerm = 2, MaxLogLen = 2, Values = {v1, v2}  RaftCi.cfg's bounds, kept so
\*         a read can be registered under one leader and granted under another.
\*
\* Measured with tla2tools 2026.08.11.125311 at -workers 4, 14-core host:
\* 592,279 states generated, 98,948 distinct, 0 left on queue, depth 31, 26s.
\* 98,948 is the ratchet floor for a CI gate on this config.
\*
\* No script flag exists for this config yet. Run it directly:
\*   java -XX:+UseParallelGC -cp tools/cache/tla2tools.jar tlc2.TLC \
\*     -workers 4 -config RaftReadObligation.cfg Raft.tla

SPECIFICATION ReadSpec

CONSTANTS
  Nodes = {n1, n2}
  Values = {v1, v2}
  MaxTerm = 2
  MaxLogLen = 2
  ReadRequests = {r1}

INVARIANTS
  TypeOK
  ElectionSafety
  LogMatching
  LeaderCompleteness
  CommittedPrefixStability
  StateMachineSafety
  StaleLeaderFencing
  CommittedEntriesHaveQuorum
  ReadBarrierLinearizability

CHECK_DEADLOCK FALSE

SYMMETRY ModelPermutations
