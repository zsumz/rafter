\* Membership-change proof obligation. NOT YET CALIBRATED -- see below.
\*
\* The theorem: all nine invariants hold across `EnterJoint` and `LeaveJoint`,
\* so the joint-consensus two-half quorum conjunction never admits two disjoint
\* quorums. `MembershipSpec` is `Init /\ [][MembershipNext]_vars`, and
\* `MembershipNext` is a disjunct-subset of `ProtocolNext` built from the same
\* action operators under unmodified guards, so every behavior it admits is a
\* behavior of `Spec`.
\*
\* What it deliberately excludes: `ClientAppend`, reads, and the snapshot
\* lifecycle. Commit and apply stay, because `EnterJoint` and `LeaveJoint` both
\* guard on `Len(log[n]) = AppliedThrough(n)`, so a configuration entry must be
\* committed and applied before the next change can be proposed; a relation
\* without them would deadlock before reaching a joint configuration.
\*
\* Constant narrowing, and why each is sound for this theorem:
\*
\*   Values = {v1}  Inert, not merely narrow. `ClientAppend(n, value)` is the
\*         only action that reads this constant, and `MembershipNext` does not
\*         contain it, so no behavior of this spec can distinguish two values.
\*         Dropping to a singleton removes a symmetry factor and changes
\*         nothing else. This is also why `ClientAppend` is excluded rather than
\*         kept: `MaxLogLen` is the binding constraint on any joint-quorum
\*         obligation and a command entry spends a slot that completing a
\*         configuration change needs.
\*
\*   ReadRequests = {r1}  Inert for the same reason: `RegisterRead` and
\*         `GrantRead` are the only consumers and neither is in the relation.
\*
\*   Nodes = {n1, n2, n3}  This is the uncalibrated choice, and it is a
\*         compromise between two known-bad options rather than a measured
\*         result. Two voters would be tractable but very nearly vacuous for
\*         this theorem: with |Nodes| <= 3 and OneVoterChange every joint
\*         configuration keeps a non-empty quorum core, so the two-half
\*         conjunction never constrains more than a fixed set of nodes does --
\*         the reasoning is spelled out in RaftJointQuorum.cfg. Four voters is
\*         the smallest node set that reaches a joint configuration with an
\*         empty quorum core, and it is known not to exhaust: 6,201,924 distinct
\*         states with 3,185,806 still queued after 34 minutes, queue growing
\*         monotonically (docs/model-checking.md).
\*
\* CALIBRATION STATUS: measured at these bounds, and it diverges. At a
\* 30-minute kill: 52,410,403 states generated, 9,935,434 distinct, 3,959,098
\* still queued and growing monotonically (the queue added roughly 1.25 million
\* states over the final ten minutes), depth pinned at 24. Being materially
\* smaller than `CoreNext` -- no `ClientAppend`, inert `Values` -- was not
\* enough: three-voter asynchronous message interleaving is the binding
\* dimension, exactly as it is for the core relation, which diverges at the
\* same node count even at MaxTerm 2 / MaxLogLen 2 (RaftCoreObligationDeep.cfg
\* records that measurement).
\*
\* DO NOT WIRE THIS AS A CI GATE until a run reports states_left = 0. The last
\* candidate reduction, MaxTerm 2 / MaxLogLen 2 -- still enough for one
\* complete joint change, a configuration entry per slot -- was measured on the
\* folded spec and also diverges: 46,023,230 generated, 7,526,805 distinct,
\* 2,416,633 queued and growing at a 30-minute kill, depth pinned at 26. Every
\* candidate bound has now been measured (four voters focused two ways, three
\* voters at both bound levels) and every one diverges, so this obligation has
\* no exhaustible bound that is also non-vacuous under the current message
\* model. The honest fix is the message-dimension redesign -- a bounded
\* in-flight message constant stated as part of the theorem, or a coalescing
\* refinement proven separately -- not a smaller config.
\*
\* Run it directly:
\*   java -XX:+UseParallelGC -cp tools/cache/tla2tools.jar tlc2.TLC \
\*     -workers 4 -config RaftMembershipObligation.cfg Raft.tla

SPECIFICATION MembershipSpec

CONSTANTS
  Nodes = {n1, n2, n3}
  Values = {v1}
  MaxTerm = 3
  MaxLogLen = 3
  ReadRequests = {r1}

INVARIANTS
  TypeOK
  ElectionSafety
  LogMatching
  LeaderCompleteness
  CommittedPrefixStability
  StateMachineSafety
  StaleLeaderFencing
