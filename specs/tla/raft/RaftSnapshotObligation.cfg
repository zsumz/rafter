\* Snapshot-lifecycle proof obligation. MEASURED: EXHAUSTS AT THESE BOUNDS on
\* the folded spec -- wired into the nightly and weekly profiles.
\*
\* The theorem: all nine invariants hold across the snapshot lifecycle --
\* atomic create-and-compact, transfer, install -- together with the two ways a
\* node can lose state, `Restart` and `ApplicationStateLoss`. `SnapshotSpec` is
\* `Init /\ [][SnapshotNext]_vars`.
\*
\* `Restart` and `ApplicationStateLoss` belong to this obligation and not to the
\* core one because the property they threaten is the one snapshot installation
\* restores: an epoch bump plus a rebuilt application state is the only path by
\* which `applied` moves backwards. An obligation that covered the snapshot
\* actions without them would be checking the repair without the damage.
\*
\* `SnapshotNext` is a disjunct-subset of `ProtocolNext` like its three
\* siblings. It was briefly the odd one out: before snapshot creation and
\* compaction were folded into one atomic action, `CompactSnapshot` was
\* reachable only through `Next`'s compaction-first branch and this relation
\* had to reproduce that IF. The fold removed the intermediate state and the
\* wrapper with it, so the containment argument is now uniform: every behavior
\* this spec admits is a behavior of `Spec`.
\*
\* What it deliberately excludes: reads and membership change. The read
\* exclusion is the one that loses something real -- a read granted across a
\* snapshot install is precisely where `applied` moving backwards could be
\* observed, and no config covers that interaction.
\*
\* Constant narrowing, and why each is sound for this theorem:
\*
\*   ReadRequests = {r1}  Inert. `RegisterRead` and `GrantRead` are the only
\*         actions that read this constant and `SnapshotNext` contains neither,
\*         so `readRequests` holds its `Init` value along every behavior.
\*
\*   MaxLogLen = 2 with MaxTerm = 2  Two slots are the minimum at which a
\*         snapshot is interesting -- a committed prefix to compact away and a
\*         suffix to keep -- and they are also the most this obligation can
\*         afford: at MaxLogLen = 3 the pre-fold model diverged badly
\*         (13,356,326 distinct states, 4,992,419 still queued and growing at a
\*         30-minute kill), and a thirty-percent fold does not close a frontier
\*         fanning out at that rate. One log level bought exhaustion.
\*
\*   Nodes = {n1, n2}  Two voters, because `TransferSnapshot(from, to)` and
\*         `InstallSnapshot` need only a lagging follower and a leader whose log
\*         has been compacted past the follower's next index, which two nodes
\*         provide. Three voters is very unlikely to be reachable here:
\*         `SnapshotNext` is a strict superset of `CoreNext`, and `CoreSpec`
\*         diverges at three voters even at MaxTerm 2 / MaxLogLen 2
\*         (RaftCoreObligation.cfg), so this relation cannot exhaust there.
\*
\* CALIBRATION STATUS: measured at these bounds on the folded spec, and it
\* exhausts. TLC 2026.08.11.125311, -workers 4 -seed 2026081101 -fp 0
\* -fpmem 0.45, symmetric: 14,119,884 states generated, 2,002,205 distinct,
\* 0 left on queue, 6.7 minutes on a 14-core host. The distinct count is the
\* wired ratchet floor. This is the fold's payoff stated as a verdict rather
\* than a percentage: the same relation one log slot higher diverged on the
\* pre-fold spec, and the folded spec at these bounds drains.
\*
\* Run it directly:
\*   java -XX:+UseParallelGC -cp tools/cache/tla2tools.jar tlc2.TLC \
\*     -workers 4 -config RaftSnapshotObligation.cfg Raft.tla

SPECIFICATION SnapshotSpec

CONSTANTS
  Nodes = {n1, n2}
  Values = {v1, v2}
  MaxTerm = 2
  MaxLogLen = 2
  ReadRequests = {r1}

INVARIANTS
  TypeOK
  ElectionSafety
  LogMatching
  LeaderCompleteness
  CommittedPrefixStability
  StateMachineSafety
  StaleLeaderFencing
  CommittedEntriesHaveQuorum
  ReadBarrierLinearizability

CHECK_DEADLOCK FALSE

SYMMETRY ModelPermutations
