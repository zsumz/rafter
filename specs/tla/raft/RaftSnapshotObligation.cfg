\* Snapshot-lifecycle proof obligation. NOT YET CALIBRATED -- see below.
\*
\* The theorem: all nine invariants hold across the snapshot lifecycle --
\* create, transfer, install, compact -- together with the two ways a node can
\* lose state, `Restart` and `ApplicationStateLoss`. `SnapshotSpec` is
\* `Init /\ [][SnapshotNext]_vars`.
\*
\* `Restart` and `ApplicationStateLoss` belong to this obligation and not to the
\* core one because the property they threaten is the one snapshot installation
\* restores: an epoch bump plus a rebuilt application state is the only path by
\* which `applied` moves backwards. An obligation that covered the snapshot
\* actions without them would be checking the repair without the damage.
\*
\* `SnapshotNext` is a subset of `Next` rather than of `ProtocolNext`, and it is
\* the only one of the four focused relations that is. `CompactSnapshot` is
\* reachable only through `Next`'s compaction-first branch, so `SnapshotNext`
\* reproduces that same IF: compaction completes before any independent protocol
\* transition is explored. The other three relations contain no
\* `CreateSnapshot`, the only action that sets `compactionPending`, so along
\* their behaviors `Next` and `ProtocolNext` coincide and no wrapper is needed.
\* Either way the containment holds, so every behavior this spec admits is a
\* behavior of `Spec`.
\*
\* What it deliberately excludes: reads and membership change. The read
\* exclusion is the one that loses something real -- a read granted across a
\* snapshot install is precisely where `applied` moving backwards could be
\* observed, and no config covers that interaction.
\*
\* Constant narrowing, and why each is sound for this theorem:
\*
\*   ReadRequests = {r1}  Inert. `RegisterRead` and `GrantRead` are the only
\*         actions that read this constant and `SnapshotNext` contains neither,
\*         so `readRequests` holds its `Init` value along every behavior.
\*
\*   MaxLogLen = 3 with MaxTerm = 2  A snapshot is only interesting once there
\*         is a committed prefix to compact away and a suffix to keep, so the
\*         log bound is the one held at 3 while the term bound gives up a level.
\*
\*   Nodes = {n1, n2}  Two voters, because `TransferSnapshot(from, to)` and
\*         `InstallSnapshot` need only a lagging follower and a leader whose log
\*         has been compacted past the follower's next index, which two nodes
\*         provide. Three voters is very unlikely to be reachable here:
\*         `SnapshotNext` is a strict superset of `CoreNext`, and `CoreSpec`
\*         diverges at three voters even at MaxTerm 2 / MaxLogLen 2
\*         (RaftCoreObligation.cfg), so this relation cannot exhaust there.
\*
\* CALIBRATION STATUS: unmeasured. This config was never run, so it is not known
\* whether the queue drains at these bounds, nor whether the five extra action
\* families keep two voters tractable at all. The calibration pass that produced
\* RaftCoreObligation.cfg and RaftReadObligation.cfg was stopped by the host
\* filesystem falling below its safety floor before this model was reached.
\*
\* DO NOT WIRE THIS AS A CI GATE until a run reports states_left = 0. Measure
\* these bounds first; if the queue still grows, MaxLogLen = 2 is the dimension
\* to give up next, since compaction needs a committed prefix more than it needs
\* a long suffix.
\*
\* Run it directly:
\*   java -XX:+UseParallelGC -cp tools/cache/tla2tools.jar tlc2.TLC \
\*     -workers 4 -config RaftSnapshotObligation.cfg Raft.tla

SPECIFICATION SnapshotSpec

CONSTANTS
  Nodes = {n1, n2}
  Values = {v1, v2}
  MaxTerm = 2
  MaxLogLen = 3
  ReadRequests = {r1}

INVARIANTS
  TypeOK
  ElectionSafety
  LogMatching
  LeaderCompleteness
  CommittedPrefixStability
  StateMachineSafety
  StaleLeaderFencing
  CommittedEntriesHaveQuorum
  ReadBarrierLinearizability

CHECK_DEADLOCK FALSE

SYMMETRY ModelPermutations
