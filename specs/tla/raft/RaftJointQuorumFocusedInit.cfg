\* Four-voter joint-quorum obligation, focused transition relation and focused
\* initial state. Like RaftJointQuorum.cfg this is a manual-run artifact and not
\* a wired tier; the profile contract in crates/rafter-invariants pins each
\* profile to one of RaftCi.cfg, RaftNightly.cfg, or Raft.cfg.
\*
\* Same node set, bounds, and nine invariants as RaftJointQuorum.cfg. Both
\* halves of the model are focused: JointQuorumFocusedSpec is JointQuorumInit
\* under MembershipNext. JointQuorumInit is the exact post-state of a completed
\* term-1 election of one distinguished node, derived in Raft.tla from the
\* actions that would have produced it rather than assembled by hand, so it is a
\* reachable state of Spec and the run starts at the boundary the theorem starts
\* at instead of paying for the election that leads there once per candidate.
\*
\* The obligation it states. Every one of the nine invariants holds over every
\* state reachable by election-free replication, commit, apply, EnterJoint, and
\* LeaveJoint from a legally elected four-voter term-1 leader, including the
\* joint configurations with an empty quorum core.
\*
\* Discharging that obligation requires TLC to drain the queue, which this
\* config has not been observed to do. Measured trajectories are in
\* docs/model-checking.md. JointQuorumPermutations in Raft.tla is the sound
\* reduced set this config could adopt to recover part of the forfeited
\* quotient; it has not been measured at these bounds.
\*
\* What it does not prove. Everything RaftJointQuorumFocusedNext.cfg does not
\* prove, and additionally nothing about any state reachable only by electing
\* someone else or by electing nobody. At MaxTerm = 1 that costs less than it
\* sounds: from JointQuorumInit every node already sits at term 1, so Timeout is
\* disabled and the election family is inert in every reachable state anyway.
\* The real loss is the other candidates, which full symmetry would have
\* quotiented away.
\*
\* No SYMMETRY. JointQuorumInit names a leader through CHOOSE over Nodes, so
\* ModelPermutations -- which permutes every node -- is unsound against it and
\* would quotient together states this model deliberately distinguishes.
\*
\* Run it with: scripts/tla-model-check --joint-quorum-focused-init
\* Cost and current status are recorded in docs/model-checking.md.

SPECIFICATION JointQuorumFocusedSpec

CONSTANTS
  Nodes = {n1, n2, n3, n4}
  Values = {v1}
  MaxTerm = 1
  MaxLogLen = 2
  ReadRequests = {r1}

INVARIANTS
  TypeOK
  ElectionSafety
  LogMatching
  LeaderCompleteness
  CommittedPrefixStability
  StateMachineSafety
  StaleLeaderFencing
  CommittedEntriesHaveQuorum
  ReadBarrierLinearizability

CHECK_DEADLOCK FALSE
