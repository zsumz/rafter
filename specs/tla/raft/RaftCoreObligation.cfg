\* Core-agreement proof obligation. Calibrated: this model exhausts.
\*
\* The theorem: the five agreement invariants -- ElectionSafety, LogMatching,
\* LeaderCompleteness, CommittedPrefixStability, StateMachineSafety -- hold over
\* election, replication, commit, and apply alone, with the frontier fully
\* drained. `CoreSpec` is `Init /\ [][CoreNext]_vars`, and `CoreNext` is a
\* disjunct-subset of `ProtocolNext` built from the same action operators under
\* unmodified guards, so every behavior it admits is a behavior of `Spec`.
\*
\* What it deliberately excludes: reads, the snapshot lifecycle, membership
\* change, `Restart`, and `ApplicationStateLoss`. Splitting the proof splits the
\* coverage with it -- this config says nothing about those families or about
\* their interaction with the ones it keeps. Each is the subject of one of the
\* three sibling obligation configs.
\*
\* Why this obligation is worth wiring: it is a gate that can pass on
\* `states_left = 0`. No wired tier has that property at three voters, and
\* neither does this relation there -- see the constant narrowing below.
\*
\* Constant narrowing, and why each is sound for this theorem:
\*
\*   Nodes = {n1, n2}  Two voters is the measured frontier, not a preference.
\*         At three voters this relation diverges: at the nightly bounds
\*         (MaxTerm 3, MaxLogLen 3) it reached 4,210,497 distinct states with
\*         2,699,386 still queued and depth stalled at 19, and even at MaxTerm 2
\*         / MaxLogLen 2 it reached 5,443,386 distinct with 2,557,643 queued and
\*         depth stalled at 21. Both queues grew monotonically throughout. So
\*         three voters is not a bound this obligation can gate on, and dropping
\*         a term or a log slot does not recover it -- the node count is what
\*         binds.
\*
\*   ReadRequests = {r1}  Inert, not merely narrow. `RegisterRead` and
\*         `GrantRead` are the only actions that read this constant, and
\*         `CoreNext` contains neither, so `readRequests` is UNCHANGED along
\*         every behavior of this spec and stays at its `Init` value. The
\*         constant has to be declared because the module declares it; its
\*         value cannot affect the state space.
\*
\*   MaxTerm = 2, MaxLogLen = 2, Values = {v1, v2}  RaftCi.cfg's bounds, kept
\*         so that the two commanded values remain distinguishable in the log
\*         and one election can be superseded by another.
\*
\* Measured with tla2tools 2026.08.11.125311 at -workers 4, 14-core host:
\* 113,201 states generated, 20,282 distinct, 0 left on queue, depth 27, 6s.
\* 20,282 is the ratchet floor for a CI gate on this config.
\*
\* No script flag exists for this config yet. Run it directly:
\*   java -XX:+UseParallelGC -cp tools/cache/tla2tools.jar tlc2.TLC \
\*     -workers 4 -config RaftCoreObligation.cfg Raft.tla

SPECIFICATION CoreSpec

CONSTANTS
  Nodes = {n1, n2}
  Values = {v1, v2}
  MaxTerm = 2
  MaxLogLen = 2
  ReadRequests = {r1}

INVARIANTS
  TypeOK
  ElectionSafety
  LogMatching
  LeaderCompleteness
  CommittedPrefixStability
  StateMachineSafety
  StaleLeaderFencing
  CommittedEntriesHaveQuorum
  ReadBarrierLinearizability

CHECK_DEADLOCK FALSE

SYMMETRY ModelPermutations
