\* Snapshot-lifecycle proof obligation, unsymmetrized. Weekly symmetry audit.
\*
\* Identical to RaftSnapshotObligation.cfg -- the folded-spec bounds at which
\* the snapshot lifecycle drains -- with `SYMMETRY ModelPermutations`
\* deliberately absent; see RaftCoreObligationUnsymmetrized.cfg for why the
\* weekly tier carries unsymmetrized twins of its gating obligations.
\*
\* The permutation group here has order four (2 nodes x 2 values x 1 read
\* request), and the measured distinct count is 8,008,105 against a full-orbit
\* prediction of 4 x 2,002,205 = 8,008,820 -- a deficit of 715 states, ratio
\* 3.9996. The deficit is structural, not noise: a state fixed by some
\* permutation has an orbit smaller than the full group, so the unsymmetrized
\* count falls short of the group order times the quotient count by exactly
\* the symmetric states' missing orbit mass. The audit is the pair of numbers,
\* not a round ratio.
\*
\* Calibration (TLC 2026.08.11.125311, -workers 4 -seed 2026081101 -fp 0,
