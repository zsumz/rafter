SPECIFICATION SnapshotSpec

CONSTANTS
  Nodes = {n1, n2}
  Values = {v1, v2}
  MaxTerm = 2
  MaxLogLen = 2
  ReadRequests = {r1}

INVARIANTS
  TypeOK
  ElectionSafety
  LogMatching
  LeaderCompleteness
  CommittedPrefixStability
  StateMachineSafety
  StaleLeaderFencing
  CommittedEntriesHaveQuorum
  ReadBarrierLinearizability

CHECK_DEADLOCK FALSE
