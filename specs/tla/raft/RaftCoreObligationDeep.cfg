\* Core-replication proof obligation at the deep (nightly/weekly) bounds.
\*
\* Same theorem and relation as RaftCoreObligation.cfg -- all nine invariants
\* over `CoreSpec`, whose `CoreNext` is a disjunct-subset of `ProtocolNext`
\* built from unmodified action operators -- but at the full term, log, and
\* value bounds the nightly monolith uses. Where RaftCoreObligation.cfg is the
\* fast pull-request regression, this config is the strongest core bound known
\* to exhaust: three terms of elections and re-elections, three log slots of
\* divergence and repair, both command values.
\*
\* Two voters, and deliberately so. CoreSpec diverges at three voters even at
\* MaxTerm 2 / MaxLogLen 2 -- 5,443,386 distinct states with 2,557,643 still
\* queued at kill, queue growing monotonically, depth pinned at 21 -- so the
\* node count, not the per-node bounds, is the binding constraint under the
\* current message model. Two voters is the largest core obligation that can
\* pass a wired tier's states_left = 0 gate. What two voters cannot exercise
\* is nondegenerate quorum overlap; that gap is documented, not hidden, in
\* docs/model-checking.md alongside the membership obligation's status.
\*
\* Constant narrowing, and why it is sound for this theorem:
\*
\*   ReadRequests = {r1, r2}  Inert. `RegisterRead` and `GrantRead` are the
\*         only consumers of this constant and neither is in `CoreNext`. Kept
\*         at the nightly cardinality so these bounds line up with
\*         RaftNightly.cfg slot for slot.
\*
\* Calibration (TLC 2026.08.11.125311, -workers 4 -seed 2026081101 -fp 0,
\* -fpmem 0.45, SYMMETRY ModelPermutations, 14-core host): exhausts in 8.5
\* minutes -- 14,734,799 states generated, 2,004,053 distinct, 0 left on
\* queue. The distinct count is the wired ratchet floor; state counts are
\* machine-independent, wall time is not.
\*
\* Run it directly:
\*   java -XX:+UseParallelGC -Xmx8g -cp tools/cache/tla2tools.jar tlc2.TLC \
\*     -workers 4 -config RaftCoreObligationDeep.cfg Raft.tla

SPECIFICATION CoreSpec

CONSTANTS
  Nodes = {n1, n2}
  Values = {v1, v2}
  MaxTerm = 3
  MaxLogLen = 3
  ReadRequests = {r1, r2}

INVARIANTS
  TypeOK
  ElectionSafety
  LogMatching
  LeaderCompleteness
  CommittedPrefixStability
  StateMachineSafety
  StaleLeaderFencing
  CommittedEntriesHaveQuorum
  ReadBarrierLinearizability

CHECK_DEADLOCK FALSE

SYMMETRY ModelPermutations
