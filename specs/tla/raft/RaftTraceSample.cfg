SPECIFICATION TraceSpec

CONSTANTS
  n1 = n1
  n2 = n2
  n3 = n3
  v1 = v1
  v2 = v2
  r1 = r1
  r2 = r2
  Nodes = {n1, n2, n3}
  Values = {v1, v2}
  MaxTerm = 3
  MaxLogLen = 3
  ReadRequests = {r1, r2}

INVARIANTS
  TypeOK
  ElectionSafety
  LogMatching
  LeaderCompleteness
  CommittedPrefixStability
  StateMachineSafety
  StaleLeaderFencing
  CommittedEntriesHaveQuorum
  ReadBarrierLinearizability
