[package]
name = "rafter-reference-ledger"
version = "0.0.0"
description = "Independent ledger acceptance system for Rafter's public application surface."
readme = "CONTRACT.md"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
rafter = "=0.0.2-alpha.1"
rafter-app = "=0.0.2-alpha.1"
rafter-runtime = "=0.0.2-alpha.1"
rafter-reference-harness.workspace = true
rafter-storage = "=0.0.2-alpha.1"

[lints]
workspace = true

# The `ledger-node` binary is one OS process per replica. It is discovered from
# `src/bin/ledger-node/main.rs` rather than declared here, because the
# dependency-boundary test scans this manifest for the substring a checkout
# dependency would introduce and a declared target location is spelled the same
# way. It is a binary rather than an example so that the process suite can find
# a built copy through `CARGO_BIN_EXE_ledger-node` in both dependency modes.
