[package]
name = "rafter-reference-fenced-lock"
version = "0.0.0"
description = "Independent fenced lock acceptance system for Rafter's public authority surface."
readme = "CONTRACT.md"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
rafter = "=0.0.2-alpha.1"
rafter-app = "=0.0.2-alpha.1"
rafter-codec = "=0.0.2-alpha.1"
rafter-crc32 = "=0.0.2-alpha.1"
rafter-reference-harness.workspace = true
rafter-runtime = "=0.0.2-alpha.1"
rafter-runtime-api = "=0.0.2-alpha.1"
rafter-service = "=0.0.2-alpha.1"
rafter-storage = "=0.0.2-alpha.1"
rafter-transport-tcp-insecure = "=0.0.2-alpha.1"
rafter-transport-tls = "=0.0.2-alpha.1"

[dev-dependencies]
rustls = { version = "0.23.42", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2.2.0"

[lints]
workspace = true

# The `lock-node` binary is one OS process per replica. It is discovered from
# `src/bin/lock-node/main.rs` rather than declared here, because the
# dependency-boundary test scans this manifest for the substring a checkout
# dependency would introduce and a declared target location is spelled the same
# way. It is a binary rather than an example so that the process suite can find
# a built copy through `CARGO_BIN_EXE_lock-node` in both dependency modes.
#
# `rafter-runtime` and `rafter-storage` are ordinary dependencies because the
# process replica owns the durable runtime and file-backed Raft stores.
#
# `rafter-transport-tcp-insecure` remains the deliberately insecure demo link.
# `rafter-transport-tls` supplies the production-composition process's complete
# bounded authenticated link. Source mode patches it from the checkout and the
# package lane builds its exact public archive from the coordinated prerelease set.
