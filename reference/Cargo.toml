[workspace]
members = ["fenced-lock", "harness", "ledger", "sharded-counter"]
resolver = "2"

[workspace.dependencies]
rafter-reference-harness = { path = "harness" }

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/zsumz/rafter"
rust-version = "1.88"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
