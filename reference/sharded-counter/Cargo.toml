[package]
name = "rafter-reference-sharded-counter"
version = "0.0.0"
description = "Independent sharded counter acceptance system for Rafter's managed many-group scheduler."
readme = "CONTRACT.md"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

# This consumer has no dependencies at all, including no Rafter ones. The
# managed scheduler it specifies does not exist yet, so this crate is the design
# input for it rather than an integration against it. A dependency added here
# before that scheduler is public would be a dependency on something the
# contract has not yet argued for.

[lints]
