# Weekly lane: the Rust extra-deep model-check profile plus full-bounds TLC
# (Raft.cfg — 3 nodes, 3 terms, log length 3) with a disk-backed state
# directory and checkpoint recovery.
#
# scripts/tla-model-check fetches and verifies the pinned immutable release
# asset. This workflow invokes TLC directly only to add checkpoint/recovery
# flags after using the shared fetch path.
#
# Checkpoint recovery strategy (BEST EFFORT, explicitly):
#   * TLC writes a checkpoint of the disk-backed run every 30 minutes into
#     specs/tla/raft/states/<run-timestamp>/. Locally measured: the full
#     config generates ~30M states/min with the checkpoint directory already
#     at 2.4 GB after 2.5 minutes, so a full run is hours-to-weeks of compute
#     and tens of GB of state.
#   * The states directory is carried between weekly runs with
#     actions/cache. GitHub caches are capped at 10 GB per repository with
#     LRU eviction, so once the checkpoint outgrows what the cache will
#     hold, save/restore quietly degrades and the next run starts fresh.
#     That is accepted: recovery is an optimization, not a correctness claim.
#   * The cache key includes a hash of Raft.tla/Raft.cfg — a spec or bounds
#     change invalidates old checkpoints (TLC cannot recover across a
#     changed model) and forces a fresh exploration.
#   * If -recover fails (truncated/mid-write checkpoint from a killed run),
#     the job falls back to a fresh full-bounds run — unless TLC exited with
#     a real counterexample verdict, which is surfaced immediately.
#   * GitHub-hosted jobs hard-cap at 360 minutes, so a single weekly run is
#     bounded by an internal TLC soft timeout and resumes the following week
#     from its last checkpoint. Budget exhaustion is reported as progress
#     rather than a counterexample; real TLC verdicts still fail the job.

name: Weekly

on:
  schedule:
    - cron: "0 7 * * 6" # 07:00 UTC Saturday
  workflow_dispatch:

concurrency:
  group: weekly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  invariants-tests:
    name: invariants-tests-weekly
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Produce source-bound weekly test evidence
        run: cargo run --locked -p rafter-invariants -- run --profile weekly --layer tests
      - name: Upload weekly test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invariants-weekly-tests
          path: artifacts/invariants/
          if-no-files-found: warn
          retention-days: 30

  invariants-simulator:
    name: invariants-simulator-weekly
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Produce source-bound weekly simulator evidence
        run: cargo run --locked -p rafter-invariants -- run --profile weekly --layer simulator
      - name: Upload weekly simulator evidence and replay logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invariants-weekly-simulator
          path: artifacts/invariants/
          if-no-files-found: warn
          retention-days: 30

  invariants-tla:
    name: invariants-tla-weekly
    runs-on: ubuntu-latest
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache tla2tools.jar
        uses: actions/cache@v4
        with:
          path: tools/cache
          key: tla2tools-${{ hashFiles('tools/tla/VERSION', 'tools/tla/ASSET_ID', 'tools/tla/SHA256SUMS') }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Produce source-bound weekly TLA+ evidence
        run: cargo run --locked -p rafter-invariants -- run --profile weekly --layer tla
      - name: Upload weekly TLA+ evidence and counterexamples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invariants-weekly-tla
          path: artifacts/invariants/
          if-no-files-found: warn
          retention-days: 30

  invariants-maelstrom:
    name: invariants-maelstrom-weekly
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Maelstrom analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends graphviz gnuplot-nox
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install pinned Maelstrom
        run: |
          version=v0.2.4
          archive=/tmp/maelstrom.tar.bz2
          expected=301ec71d6b12af0d765edb413f5cf5aa1046b5609bd4e31376a0b549548e5799
          curl -fsSL -o "$archive" \
            "https://github.com/jepsen-io/maelstrom/releases/download/${version}/maelstrom.tar.bz2"
          actual="$(sha256sum "$archive" | awk '{ print $1 }')"
          test "$actual" = "$expected"
          tar -xjf "$archive" -C /tmp
          echo "/tmp/maelstrom" >> "$GITHUB_PATH"
      - name: Produce three trials of all five Maelstrom scenarios
        run: cargo run --locked -p rafter-invariants -- run --profile weekly --layer maelstrom
      - name: Independently verify weekly Maelstrom evidence
        run: >-
          cargo run --locked -p rafter-invariants -- verify-layer
          --profile weekly --layer maelstrom
          --result artifacts/invariants/weekly-maelstrom.json
      - name: Upload source-bound Maelstrom receipts and replay artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invariants-weekly-maelstrom
          path: artifacts/invariants/
          if-no-files-found: error
          retention-days: 30

  invariants-weekly:
    name: invariants-weekly
    needs:
      - invariants-tests
      - invariants-simulator
      - invariants-tla
      - invariants-maelstrom
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Download available weekly evidence
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: invariants-weekly-*
          path: artifacts/invariants
          merge-multiple: true
      - name: Aggregate exactly 44 weekly invariant verdicts
        if: always()
        id: aggregate
        run: |
          set +e
          cargo run --locked -p rafter-invariants -- check --profile weekly --source-ref "$GITHUB_SHA"
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Render the 44-row weekly report
        if: always()
        run: |
          if [[ -f target/rafter-invariants/weekly.md ]]; then
            cat target/rafter-invariants/weekly.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Raft invariant gate" >> "$GITHUB_STEP_SUMMARY"
            echo "No 44-row weekly report was produced; the aggregate is red." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload weekly aggregate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invariants-weekly-report
          path: |
            target/rafter-invariants/weekly.json
            target/rafter-invariants/weekly.xml
            target/rafter-invariants/weekly.md
            artifacts/invariants/
          if-no-files-found: warn
          retention-days: 30
      - name: Require 44 of 44 weekly invariants green
        if: always()
        env:
          AGGREGATE_STATUS: ${{ steps.aggregate.outputs.status }}
          TESTS_RESULT: ${{ needs.invariants-tests.result }}
          SIMULATOR_RESULT: ${{ needs.invariants-simulator.result }}
          TLA_RESULT: ${{ needs.invariants-tla.result }}
          MAELSTROM_RESULT: ${{ needs.invariants-maelstrom.result }}
        run: |
          test "$TESTS_RESULT" = "success"
          test "$SIMULATOR_RESULT" = "success"
          test "$TLA_RESULT" = "success"
          test "$MAELSTROM_RESULT" = "success"
          test "$AGGREGATE_STATUS" = "0"
          jq -e '.summary.total == 44 and .summary.green == 44 and .summary.red == 0 and (.invariants | length) == 44' \
            target/rafter-invariants/weekly.json >/dev/null

  tlc-full:
    name: tlc-full
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache tla2tools.jar
        uses: actions/cache@v4
        with:
          path: tools/cache
          key: tla2tools-${{ hashFiles('tools/tla/VERSION', 'tools/tla/ASSET_ID', 'tools/tla/SHA256SUMS') }}

      # Restore the newest previous states directory. The exact key never
      # matches (it embeds run_id), so the prefix restore-key always picks
      # the most recent saved checkpoint for this spec+config hash.
      - name: Restore TLC states from previous run
        uses: actions/cache/restore@v4
        with:
          path: specs/tla/raft/states
          key: tlc-full-states-${{ hashFiles('specs/tla/raft/Raft.tla', 'specs/tla/raft/Raft.cfg', 'tools/tla/ASSET_ID', 'tools/tla/SHA256SUMS') }}-${{ github.run_id }}
          restore-keys: |
            tlc-full-states-${{ hashFiles('specs/tla/raft/Raft.tla', 'specs/tla/raft/Raft.cfg', 'tools/tla/ASSET_ID', 'tools/tla/SHA256SUMS') }}-

      - name: Fetch and verify tla2tools.jar
        run: scripts/tla-model-check --fetch-tool

      - name: TLC full bounds (Raft.cfg) with checkpointing
        timeout-minutes: 300 # leaves headroom inside the job timeout to prune and save the cache
        run: |
          cd specs/tla/raft
          jar="$GITHUB_WORKSPACE/tools/cache/tla2tools.jar"

          tlc_args=(
            -Xmx4g
            -XX:+UseParallelGC
            -cp "$jar"
            tlc2.TLC
            -config Raft.cfg
            -metadir states
            -checkpoint 30
            -gzip
            -workers auto
          )

          run_tlc_with_budget() {
            timeout --signal=TERM --kill-after=30s 295m \
              java "${tlc_args[@]}" "$@" Raft.tla
          }

          # Newest checkpoint directory from a previous run, if any. TLC
          # names run directories with a timestamp (e.g. 26-07-05-07-23-17.581),
          # so mtime-sorted ls is safe here despite SC2012.
          # shellcheck disable=SC2012
          latest="$(ls -1dt states/*/ 2>/dev/null | head -n 1 || true)"
          latest="${latest%/}"

          if [[ -n "$latest" ]]; then
            echo "attempting best-effort recovery from checkpoint: $latest"
            set +e
            run_tlc_with_budget -recover "$latest" 2>&1 | tee "$GITHUB_WORKSPACE/tlc-full.log"
            code=${PIPESTATUS[0]}
            set -e
            case "$code" in
              0)
                exit 0
                ;;
              124)
                echo "TLC full bounds exhausted the 295-minute soft budget during recovery; checkpoint state will be saved, and this run remains incomplete."
                exit "$code"
                ;;
              10 | 11 | 12 | 13 | 14)
                # Real TLC verdicts (assumption/deadlock/safety/liveness/
                # assertion violation) — surface them, do not mask with a
                # fresh run.
                exit "$code"
                ;;
              *)
                echo "recovery unusable (exit $code); starting a fresh full-bounds run"
                ;;
            esac
          fi

          set +e
          run_tlc_with_budget 2>&1 | tee "$GITHUB_WORKSPACE/tlc-full.log"
          code=${PIPESTATUS[0]}
          set -e
          case "$code" in
            0)
              ;;
            124)
              echo "TLC full bounds exhausted the 295-minute soft budget; checkpoint state will be saved, and this run remains incomplete."
              exit "$code"
              ;;
            *)
              exit "$code"
              ;;
          esac

      - name: Prune states to the newest checkpoint
        # Keep only the most recent run directory so the cache entry stays as
        # small as possible (still potentially multi-GB — see header note on
        # the 10 GB repository cache cap).
        if: always()
        run: |
          if [[ -d specs/tla/raft/states ]]; then
            cd specs/tla/raft/states
            # TLC run directories are timestamps (no spaces, no leading
            # dashes), so mtime-sorted ls is safe here despite SC2012.
            # shellcheck disable=SC2012
            ls -1dt -- */ 2>/dev/null | tail -n +2 | xargs -r rm -rf --
            du -sh . || true
          fi

      - name: Save TLC states for next run
        # Runs on success, failure, and budget exhaustion so next week's run
        # can recover from the latest checkpoint.
        if: always()
        uses: actions/cache/save@v4
        with:
          path: specs/tla/raft/states
          key: tlc-full-states-${{ hashFiles('specs/tla/raft/Raft.tla', 'specs/tla/raft/Raft.cfg', 'tools/tla/ASSET_ID', 'tools/tla/SHA256SUMS') }}-${{ github.run_id }}

      - name: Upload TLC log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tlc-full-log
          path: tlc-full.log
          if-no-files-found: ignore
