# Weekly runs full unsymmetrized Raft.cfg inside the source-bound TLA producer.
# The producer validates exact contract metadata and a complete checkpoint
# inventory before recovery. Missing, stale, malformed, timed-out, or otherwise
# incomplete full-state evidence remains red in the normal 44-row aggregate.

name: Weekly

on:
  schedule:
    - cron: "0 7 * * 6" # 07:00 UTC Saturday
  workflow_dispatch:

concurrency:
  group: weekly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  invariants-tests:
    name: invariants-tests-weekly
    runs-on: [self-hosted, linux, X64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/configure-invariant-cargo
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          cache-on-failure: true
          cache-targets: false
          cache-bin: false
      - name: Prefetch locked registry for offline source identity
        run: cargo fetch --locked
      - name: Produce source-bound weekly test evidence
        run: cargo run --locked -p rafter-invariants -- run --profile weekly --layer tests
      - name: Upload weekly test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: invariants-weekly-evidence-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/invariants/weekly-tests.json
            artifacts/invariants/weekly-tests/
          if-no-files-found: error
          retention-days: 30
      - name: Upload weekly test process diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: invariants-weekly-tests-process-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/rafter-invariants/telemetry/
            crates/rafter-invariants/target/rafter-invariants/telemetry/
          if-no-files-found: ignore
          retention-days: 30

  invariants-simulator:
    name: invariants-simulator-weekly
    runs-on: [self-hosted, linux, X64]
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/configure-invariant-cargo
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          cache-on-failure: true
          cache-targets: false
          cache-bin: false
      - name: Prefetch locked registry for offline source identity
        run: cargo fetch --locked
      - name: Produce source-bound weekly simulator evidence
        run: cargo run --locked -p rafter-invariants -- run --profile weekly --layer simulator
      - name: Upload weekly simulator evidence and replay logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: invariants-weekly-evidence-simulator-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/invariants/weekly-simulator.json
            artifacts/invariants/weekly-simulator/
          if-no-files-found: error
          retention-days: 30
      - name: Upload weekly simulator process diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: invariants-weekly-simulator-process-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/rafter-invariants/telemetry/
            crates/rafter-invariants/target/rafter-invariants/telemetry/
          if-no-files-found: ignore
          retention-days: 30

  invariants-tla:
    name: invariants-tla-weekly
    # The self-hosted job may exceed six hours; each individual step remains capped at six.
    runs-on: [self-hosted, linux, X64]
    timeout-minutes: 400
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/configure-invariant-cargo
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-invariant-verifier
      - name: Cache tla2tools.jar
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: tools/cache
          key: tla2tools-${{ hashFiles('tools/tla/VERSION', 'tools/tla/ASSET_ID', 'tools/tla/SHA256SUMS') }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          cache-on-failure: true
          cache-targets: false
          cache-bin: false
      - name: Prefetch locked registry for offline source identity
        run: cargo fetch --locked
      - name: Restore exact-compatible weekly TLC checkpoint
        id: checkpoint-restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: target/rafter-invariants/tla-checkpoint/weekly
          key: tla-weekly-checkpoint-v1-${{ hashFiles('verification/raft-invariant-profiles.json', 'specs/tla/raft/Raft.tla', 'specs/tla/raft/Raft.cfg', 'specs/tla/raft/RaftMembershipTraceSample.tla', 'specs/tla/raft/RaftMembershipTraceSample.cfg', 'specs/tla/raft/RafterInvariantDetectorNegative.tla', 'specs/tla/raft/RafterInvariantDetectorNegative.cfg', 'scripts/tla-model-check', 'tools/tla/ASSET_ID', 'tools/tla/SHA256SUMS', 'Cargo.toml', 'Cargo.lock', 'crates/rafter-invariants/Cargo.toml', 'crates/rafter-invariants/src/**/*.rs') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            tla-weekly-checkpoint-v1-${{ hashFiles('verification/raft-invariant-profiles.json', 'specs/tla/raft/Raft.tla', 'specs/tla/raft/Raft.cfg', 'specs/tla/raft/RaftMembershipTraceSample.tla', 'specs/tla/raft/RaftMembershipTraceSample.cfg', 'specs/tla/raft/RafterInvariantDetectorNegative.tla', 'specs/tla/raft/RafterInvariantDetectorNegative.cfg', 'scripts/tla-model-check', 'tools/tla/ASSET_ID', 'tools/tla/SHA256SUMS', 'Cargo.toml', 'Cargo.lock', 'crates/rafter-invariants/Cargo.toml', 'crates/rafter-invariants/src/**/*.rs') }}-
      - name: Produce source-bound weekly TLA+ evidence
        timeout-minutes: 360
        run: cargo run --locked -p rafter-invariants -- run --profile weekly --layer tla
      - name: Save exact-compatible weekly TLC checkpoint
        if: ${{ always() && hashFiles('target/rafter-invariants/tla-checkpoint/weekly/CACHE_VALID') != '' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: target/rafter-invariants/tla-checkpoint/weekly
          key: tla-weekly-checkpoint-v1-${{ hashFiles('verification/raft-invariant-profiles.json', 'specs/tla/raft/Raft.tla', 'specs/tla/raft/Raft.cfg', 'specs/tla/raft/RaftMembershipTraceSample.tla', 'specs/tla/raft/RaftMembershipTraceSample.cfg', 'specs/tla/raft/RafterInvariantDetectorNegative.tla', 'specs/tla/raft/RafterInvariantDetectorNegative.cfg', 'scripts/tla-model-check', 'tools/tla/ASSET_ID', 'tools/tla/SHA256SUMS', 'Cargo.toml', 'Cargo.lock', 'crates/rafter-invariants/Cargo.toml', 'crates/rafter-invariants/src/**/*.rs') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload weekly TLA+ evidence and counterexamples
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: invariants-weekly-evidence-tla-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/invariants/weekly-tla.json
            artifacts/invariants/weekly-tla/
          if-no-files-found: error
          retention-days: 30
      - name: Upload weekly TLA+ process diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: invariants-weekly-tla-process-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/rafter-invariants/telemetry/
            crates/rafter-invariants/target/rafter-invariants/telemetry/
          if-no-files-found: ignore
          retention-days: 30

  invariants-maelstrom:
    name: invariants-maelstrom-weekly
    runs-on: [self-hosted, linux, X64]
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/configure-invariant-cargo
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-invariant-verifier
        with:
          maelstrom: "true"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          cache-on-failure: true
          cache-targets: false
          cache-bin: false
      - name: Prefetch locked registry for offline source identity
        run: cargo fetch --locked
      - name: Produce three trials of all six Maelstrom scenarios
        run: cargo run --locked -p rafter-invariants -- run --profile weekly --layer maelstrom
      - name: Independently verify weekly Maelstrom evidence
        run: >-
          cargo run --locked -p rafter-invariants -- verify-layer
          --profile weekly --layer maelstrom
          --result artifacts/invariants/weekly-maelstrom.json
      - name: Upload source-bound Maelstrom receipts and replay artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: invariants-weekly-evidence-maelstrom-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/invariants/weekly-maelstrom.json
            artifacts/invariants/weekly-maelstrom/
          if-no-files-found: error
          retention-days: 30
      - name: Upload weekly Maelstrom process diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: invariants-weekly-maelstrom-process-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/rafter-invariants/telemetry/
            crates/rafter-invariants/target/rafter-invariants/telemetry/
          if-no-files-found: ignore
          retention-days: 30

  invariants-weekly:
    name: invariants-weekly
    needs:
      - invariants-tests
      - invariants-simulator
      - invariants-tla
      - invariants-maelstrom
    if: always()
    runs-on: [self-hosted, linux, X64]
    timeout-minutes: 95
    env:
      INVARIANT_EVIDENCE_DIR: rafter-invariants-weekly-evidence-${{ github.run_id }}-${{ github.run_attempt }}
      INVARIANT_REPORT_DIR: rafter-invariants-weekly-${{ github.run_id }}-${{ github.run_attempt }}
      INVARIANT_VERIFIER_DIR: target/rafter-invariants/verifier-evidence/weekly-${{ github.run_id }}-${{ github.run_attempt }}
      RAFTER_INVARIANT_VERIFIER_EVIDENCE_DIR: target/rafter-invariants/verifier-evidence/weekly-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        timeout-minutes: 3
        with:
          persist-credentials: false
      - uses: ./.github/actions/configure-invariant-cargo
        timeout-minutes: 1
      - uses: ./.github/actions/setup-rust
        timeout-minutes: 8
      - uses: ./.github/actions/setup-invariant-verifier
        timeout-minutes: 8
        with:
          maelstrom: "true"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        timeout-minutes: 8
        with:
          cache-on-failure: true
          cache-targets: false
          cache-bin: false
      - name: Download available weekly test evidence
        timeout-minutes: 2
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: invariants-weekly-evidence-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ env.INVARIANT_EVIDENCE_DIR }}/tests
      - name: Download available weekly simulator evidence
        timeout-minutes: 2
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: invariants-weekly-evidence-simulator-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ env.INVARIANT_EVIDENCE_DIR }}/simulator
      - name: Download available weekly TLA+ evidence
        timeout-minutes: 2
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: invariants-weekly-evidence-tla-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ env.INVARIANT_EVIDENCE_DIR }}/tla
      - name: Download available weekly Maelstrom evidence
        timeout-minutes: 2
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: invariants-weekly-evidence-maelstrom-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ env.INVARIANT_EVIDENCE_DIR }}/maelstrom
      - name: Stage current-run weekly evidence artifacts
        timeout-minutes: 2
        if: always()
        run: |
          transport_root="$RUNNER_TEMP/$INVARIANT_EVIDENCE_DIR"
          evidence_root="artifacts/invariants"
          mkdir -p "$evidence_root"
          for layer in tests simulator tla maelstrom; do
            source="$transport_root/$layer/weekly-$layer"
            destination="$evidence_root/weekly-$layer"
            test -s "$source.json"
            test -d "$source"
            if [[ -e "$destination" || -e "$destination.json" ]]; then
              echo "refusing stale or colliding weekly evidence target: $destination" >&2
              exit 1
            fi
          done
          for layer in tests simulator tla maelstrom; do
            source="$transport_root/$layer/weekly-$layer"
            destination="$evidence_root/weekly-$layer"
            cp "$source.json" "$destination.json"
            cp -R "$source" "$destination"
          done
      - name: Build source-bound Maelstrom verification binaries
        timeout-minutes: 2
        run: cargo build --locked -p rafter-maelstrom --bins
      - name: Prime authenticated Cargo archive cache
        if: always()
        timeout-minutes: 3
        run: cargo fetch --locked
      - name: Aggregate exactly 44 weekly invariant verdicts
        if: always()
        id: aggregate
        timeout-minutes: 20
        run: |
          report_dir="$RUNNER_TEMP/$INVARIANT_REPORT_DIR"
          evidence_root="$GITHUB_WORKSPACE/artifacts/invariants"
          mkdir -p "$report_dir"
          set +e
          cargo run --offline --locked -p rafter-invariants -- check --profile weekly --source-ref "$GITHUB_SHA" \
            --result "$evidence_root/weekly-tests.json" \
            --result "$evidence_root/weekly-simulator.json" \
            --result "$evidence_root/weekly-tla.json" \
            --result "$evidence_root/weekly-maelstrom.json" \
            --output-dir "$report_dir"
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          manifest_count="$(find "$INVARIANT_VERIFIER_DIR" -mindepth 2 -maxdepth 2 \
            -type f -name 'verifier-artifact-manifest-*' 2>/dev/null | wc -l | tr -d ' ')"
          if [[ "$manifest_count" = "1" ]]; then
            manifest_path="$(find "$INVARIANT_VERIFIER_DIR" -mindepth 2 -maxdepth 2 \
              -type f -name 'verifier-artifact-manifest-*')"
            echo "verifier_manifest=$manifest_path" >> "$GITHUB_OUTPUT"
            echo "verifier_manifest_sha256=$(sha256sum "$manifest_path" | awk '{ print $1 }')" \
              >> "$GITHUB_OUTPUT"
          fi
      - name: Validate current-run weekly reports
        if: always()
        id: report
        timeout-minutes: 2
        run: |
          report_dir="$RUNNER_TEMP/$INVARIANT_REPORT_DIR"
          if cargo run --offline --locked -p rafter-invariants -- verify-report-set \
            --profile weekly --report-dir "$report_dir"; then
            complete=true
          else
            complete=false
          fi
          echo "complete=$complete" >> "$GITHUB_OUTPUT"
      - name: Render the 44-row weekly report
        if: always()
        timeout-minutes: 1
        env:
          REPORT_READY: ${{ steps.report.outputs.complete }}
        run: |
          if [[ "$REPORT_READY" = "true" ]]; then
            cat "$RUNNER_TEMP/$INVARIANT_REPORT_DIR/weekly.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Raft invariant gate" >> "$GITHUB_STEP_SUMMARY"
            echo "No complete current-run 44-row weekly report was produced; the aggregate is red." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload available weekly aggregate reports
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: invariants-weekly-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/${{ env.INVARIANT_REPORT_DIR }}/weekly.json
            ${{ runner.temp }}/${{ env.INVARIANT_REPORT_DIR }}/weekly.xml
            ${{ runner.temp }}/${{ env.INVARIANT_REPORT_DIR }}/weekly.md
          if-no-files-found: error
          retention-days: 30
      - name: Upload available weekly aggregate evidence
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: invariants-weekly-aggregate-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ env.INVARIANT_EVIDENCE_DIR }}/
          if-no-files-found: ignore
          retention-days: 30
      - name: Seal weekly aggregate verifier evidence
        if: always()
        id: verifier_archive
        timeout-minutes: 5
        env:
          EXPECTED_MANIFEST: ${{ steps.aggregate.outputs.verifier_manifest }}
          EXPECTED_MANIFEST_SHA256: ${{ steps.aggregate.outputs.verifier_manifest_sha256 }}
        run: |
          test -n "$EXPECTED_MANIFEST"
          test -n "$EXPECTED_MANIFEST_SHA256"
          run_root="$(dirname "$EXPECTED_MANIFEST")"
          archive="$RUNNER_TEMP/invariants-weekly-aggregate-verifier-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar"
          output="$(cargo run --offline --locked -p rafter-invariants -- seal-verifier-artifacts \
            --profile weekly \
            --root "$run_root" \
            --manifest "$EXPECTED_MANIFEST" \
            --manifest-sha256 "$EXPECTED_MANIFEST_SHA256" \
            --archive "$archive")"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "$output" >> "$GITHUB_OUTPUT"
      - name: Upload weekly aggregate verifier evidence
        if: always()
        id: upload_verifier_archive
        timeout-minutes: 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: invariants-weekly-aggregate-verifier-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.verifier_archive.outputs.archive }}
          if-no-files-found: error
          retention-days: 30
      - name: Download weekly aggregate verifier evidence for readback
        if: always() && steps.upload_verifier_archive.outcome == 'success'
        id: download_verifier_archive
        timeout-minutes: 2
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: invariants-weekly-aggregate-verifier-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/invariants-weekly-aggregate-verifier-download-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify downloaded weekly aggregate verifier evidence
        if: always() && steps.download_verifier_archive.outcome == 'success'
        id: verify_verifier_archive
        timeout-minutes: 5
        env:
          ARCHIVE_SOURCE: ${{ steps.verifier_archive.outputs.archive }}
          ARCHIVE_SHA256: ${{ steps.verifier_archive.outputs.archive_sha256 }}
          MANIFEST_SHA256: ${{ steps.aggregate.outputs.verifier_manifest_sha256 }}
          DOWNLOAD_DIR: ${{ runner.temp }}/invariants-weekly-aggregate-verifier-download-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          archive="$DOWNLOAD_DIR/$(basename "$ARCHIVE_SOURCE")"
          cargo run --offline --locked -p rafter-invariants -- verify-verifier-archive \
            --profile weekly \
            --archive "$archive" \
            --archive-sha256 "$ARCHIVE_SHA256" \
            --manifest-sha256 "$MANIFEST_SHA256"
      - name: Upload weekly aggregate process diagnostics
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: invariants-weekly-aggregate-process-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/rafter-invariants/telemetry/
            crates/rafter-invariants/target/rafter-invariants/telemetry/
          if-no-files-found: ignore
          retention-days: 30
      - name: Require 44 of 44 weekly invariants green
        if: always()
        timeout-minutes: 1
        env:
          AGGREGATE_STATUS: ${{ steps.aggregate.outputs.status }}
          REPORT_READY: ${{ steps.report.outputs.complete }}
          VERIFIER_SEAL_RESULT: ${{ steps.verifier_archive.outcome }}
          VERIFIER_UPLOAD_RESULT: ${{ steps.upload_verifier_archive.outcome }}
          VERIFIER_READBACK_RESULT: ${{ steps.verify_verifier_archive.outcome }}
          TESTS_RESULT: ${{ needs.invariants-tests.result }}
          SIMULATOR_RESULT: ${{ needs.invariants-simulator.result }}
          TLA_RESULT: ${{ needs.invariants-tla.result }}
          MAELSTROM_RESULT: ${{ needs.invariants-maelstrom.result }}
        run: |
          test "$TESTS_RESULT" = "success"
          test "$SIMULATOR_RESULT" = "success"
          test "$TLA_RESULT" = "success"
          test "$MAELSTROM_RESULT" = "success"
          test "$AGGREGATE_STATUS" = "0"
          test "$REPORT_READY" = "true"
          test "$VERIFIER_SEAL_RESULT" = "success"
          test "$VERIFIER_UPLOAD_RESULT" = "success"
          test "$VERIFIER_READBACK_RESULT" = "success"
          jq -e '.summary.total == 44 and .summary.green == 44 and .summary.red == 0 and (.invariants | length) == 44' \
            "$RUNNER_TEMP/$INVARIANT_REPORT_DIR/weekly.json" >/dev/null
