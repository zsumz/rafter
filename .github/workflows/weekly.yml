# Weekly runs full unsymmetrized Raft.cfg inside the source-bound TLA producer.
# The producer validates exact contract metadata and a complete checkpoint
# inventory before recovery. Missing, stale, malformed, timed-out, or otherwise
# incomplete full-state evidence remains red in the normal 44-row aggregate.

name: Weekly

on:
  schedule:
    - cron: "0 7 * * 6" # 07:00 UTC Saturday
  workflow_dispatch:

concurrency:
  group: weekly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  invariants-tests:
    name: invariants-tests-weekly
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Produce source-bound weekly test evidence
        run: cargo run --locked -p rafter-invariants -- run --profile weekly --layer tests
      - name: Upload weekly test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invariants-weekly-tests
          path: artifacts/invariants/
          if-no-files-found: warn
          retention-days: 30

  invariants-simulator:
    name: invariants-simulator-weekly
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Produce source-bound weekly simulator evidence
        run: cargo run --locked -p rafter-invariants -- run --profile weekly --layer simulator
      - name: Upload weekly simulator evidence and replay logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invariants-weekly-simulator
          path: artifacts/invariants/
          if-no-files-found: warn
          retention-days: 30

  invariants-tla:
    name: invariants-tla-weekly
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache tla2tools.jar
        uses: actions/cache@v4
        with:
          path: tools/cache
          key: tla2tools-${{ hashFiles('tools/tla/VERSION', 'tools/tla/ASSET_ID', 'tools/tla/SHA256SUMS') }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Restore exact-compatible weekly TLC checkpoint
        id: checkpoint-restore
        uses: actions/cache/restore@v4
        with:
          path: target/rafter-invariants/tla-checkpoint/weekly
          key: tla-weekly-checkpoint-v1-${{ hashFiles('verification/raft-invariant-profiles.json', 'specs/tla/raft/Raft.tla', 'specs/tla/raft/Raft.cfg', 'specs/tla/raft/RaftTraceSample.tla', 'specs/tla/raft/RaftTraceSample.cfg', 'specs/tla/raft/RafterInvariantDetectorNegative.tla', 'specs/tla/raft/RafterInvariantDetectorNegative.cfg', 'scripts/tla-model-check', 'tools/tla/ASSET_ID', 'tools/tla/SHA256SUMS', 'Cargo.lock', 'crates/rafter-invariants/src/producer/tla.rs', 'crates/rafter-invariants/src/producer/tla_contract.rs', 'crates/rafter-invariants/src/producer/tla_exec.rs', 'crates/rafter-invariants/src/producer/tla_output.rs', 'crates/rafter-invariants/src/producer/tla_checkpoint.rs', 'crates/rafter-invariants/src/producer/process.rs', 'crates/rafter-invariants/src/receipt_tla.rs', 'crates/rafter-invariants/src/artifact_verify_tla.rs') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            tla-weekly-checkpoint-v1-${{ hashFiles('verification/raft-invariant-profiles.json', 'specs/tla/raft/Raft.tla', 'specs/tla/raft/Raft.cfg', 'specs/tla/raft/RaftTraceSample.tla', 'specs/tla/raft/RaftTraceSample.cfg', 'specs/tla/raft/RafterInvariantDetectorNegative.tla', 'specs/tla/raft/RafterInvariantDetectorNegative.cfg', 'scripts/tla-model-check', 'tools/tla/ASSET_ID', 'tools/tla/SHA256SUMS', 'Cargo.lock', 'crates/rafter-invariants/src/producer/tla.rs', 'crates/rafter-invariants/src/producer/tla_contract.rs', 'crates/rafter-invariants/src/producer/tla_exec.rs', 'crates/rafter-invariants/src/producer/tla_output.rs', 'crates/rafter-invariants/src/producer/tla_checkpoint.rs', 'crates/rafter-invariants/src/producer/process.rs', 'crates/rafter-invariants/src/receipt_tla.rs', 'crates/rafter-invariants/src/artifact_verify_tla.rs') }}-
      - name: Produce source-bound weekly TLA+ evidence
        timeout-minutes: 325
        run: cargo run --locked -p rafter-invariants -- run --profile weekly --layer tla
      - name: Save exact-compatible weekly TLC checkpoint
        if: always()
        uses: actions/cache/save@v4
        with:
          path: target/rafter-invariants/tla-checkpoint/weekly
          key: tla-weekly-checkpoint-v1-${{ hashFiles('verification/raft-invariant-profiles.json', 'specs/tla/raft/Raft.tla', 'specs/tla/raft/Raft.cfg', 'specs/tla/raft/RaftTraceSample.tla', 'specs/tla/raft/RaftTraceSample.cfg', 'specs/tla/raft/RafterInvariantDetectorNegative.tla', 'specs/tla/raft/RafterInvariantDetectorNegative.cfg', 'scripts/tla-model-check', 'tools/tla/ASSET_ID', 'tools/tla/SHA256SUMS', 'Cargo.lock', 'crates/rafter-invariants/src/producer/tla.rs', 'crates/rafter-invariants/src/producer/tla_contract.rs', 'crates/rafter-invariants/src/producer/tla_exec.rs', 'crates/rafter-invariants/src/producer/tla_output.rs', 'crates/rafter-invariants/src/producer/tla_checkpoint.rs', 'crates/rafter-invariants/src/producer/process.rs', 'crates/rafter-invariants/src/receipt_tla.rs', 'crates/rafter-invariants/src/artifact_verify_tla.rs') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload weekly TLA+ evidence and counterexamples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invariants-weekly-tla
          path: artifacts/invariants/
          if-no-files-found: warn
          retention-days: 30

  invariants-maelstrom:
    name: invariants-maelstrom-weekly
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Maelstrom analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends graphviz gnuplot-nox
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install pinned Maelstrom
        run: |
          version=v0.2.4
          archive=/tmp/maelstrom.tar.bz2
          expected=301ec71d6b12af0d765edb413f5cf5aa1046b5609bd4e31376a0b549548e5799
          curl -fsSL -o "$archive" \
            "https://github.com/jepsen-io/maelstrom/releases/download/${version}/maelstrom.tar.bz2"
          actual="$(sha256sum "$archive" | awk '{ print $1 }')"
          test "$actual" = "$expected"
          tar -xjf "$archive" -C /tmp
          echo "/tmp/maelstrom" >> "$GITHUB_PATH"
      - name: Produce three trials of all six Maelstrom scenarios
        run: cargo run --locked -p rafter-invariants -- run --profile weekly --layer maelstrom
      - name: Independently verify weekly Maelstrom evidence
        run: >-
          cargo run --locked -p rafter-invariants -- verify-layer
          --profile weekly --layer maelstrom
          --result artifacts/invariants/weekly-maelstrom.json
      - name: Upload source-bound Maelstrom receipts and replay artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invariants-weekly-maelstrom
          path: artifacts/invariants/
          if-no-files-found: error
          retention-days: 30

  invariants-weekly:
    name: invariants-weekly
    needs:
      - invariants-tests
      - invariants-simulator
      - invariants-tla
      - invariants-maelstrom
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Download available weekly evidence
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: invariants-weekly-*
          path: artifacts/invariants
          merge-multiple: true
      - name: Aggregate exactly 44 weekly invariant verdicts
        if: always()
        id: aggregate
        run: |
          set +e
          cargo run --locked -p rafter-invariants -- check --profile weekly --source-ref "$GITHUB_SHA"
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Render the 44-row weekly report
        if: always()
        run: |
          if [[ -f target/rafter-invariants/weekly.md ]]; then
            cat target/rafter-invariants/weekly.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Raft invariant gate" >> "$GITHUB_STEP_SUMMARY"
            echo "No 44-row weekly report was produced; the aggregate is red." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload weekly aggregate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invariants-weekly-report
          path: |
            target/rafter-invariants/weekly.json
            target/rafter-invariants/weekly.xml
            target/rafter-invariants/weekly.md
            artifacts/invariants/
          if-no-files-found: warn
          retention-days: 30
      - name: Require 44 of 44 weekly invariants green
        if: always()
        env:
          AGGREGATE_STATUS: ${{ steps.aggregate.outputs.status }}
          TESTS_RESULT: ${{ needs.invariants-tests.result }}
          SIMULATOR_RESULT: ${{ needs.invariants-simulator.result }}
          TLA_RESULT: ${{ needs.invariants-tla.result }}
          MAELSTROM_RESULT: ${{ needs.invariants-maelstrom.result }}
        run: |
          test "$TESTS_RESULT" = "success"
          test "$SIMULATOR_RESULT" = "success"
          test "$TLA_RESULT" = "success"
          test "$MAELSTROM_RESULT" = "success"
          test "$AGGREGATE_STATUS" = "0"
          jq -e '.summary.total == 44 and .summary.green == 44 and .summary.red == 0 and (.invariants | length) == 44' \
            target/rafter-invariants/weekly.json >/dev/null
