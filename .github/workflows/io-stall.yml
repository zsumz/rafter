name: Linux I/O stall qualification

on:
  push:
    paths:
      - '.github/workflows/io-stall.yml'
      - 'scripts/check-io-stall'
      - 'scripts/io_stall_*.py'
      - 'scripts/tests/*io_stall*.py'
      - 'scripts/record-storage-environment'
      - 'scripts/tests/test_storage_environment.py'
      - 'scripts/check-counter-guide'
      - 'scripts/counter_guide_deps.py'
      - 'docs/examples/counter/**'
      - 'docs/getting-started.md'
      - 'crates/**'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/actions/setup-rust/**'
  pull_request:
    paths:
      - '.github/workflows/io-stall.yml'
      - 'scripts/check-io-stall'
      - 'scripts/io_stall_*.py'
      - 'scripts/tests/*io_stall*.py'
      - 'scripts/record-storage-environment'
      - 'scripts/tests/test_storage_environment.py'
      - 'scripts/check-counter-guide'
      - 'scripts/counter_guide_deps.py'
      - 'docs/examples/counter/**'
      - 'docs/getting-started.md'
      - 'crates/**'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/actions/setup-rust/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: io-stall-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  snapshot-publication:
    # Process loss preserves the kernel/page cache; no block-device manipulation.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.88.0"
      - name: Record source and compiler identity
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/snapshot-process-evidence"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD > "$RUNNER_TEMP/snapshot-process-evidence/source.txt"
          git ls-files -z | xargs -0 sha256sum > "$RUNNER_TEMP/snapshot-process-evidence/source-before.sha256"
          rustc --version --verbose > "$RUNNER_TEMP/snapshot-process-evidence/rustc.txt"
          cargo --version > "$RUNNER_TEMP/snapshot-process-evidence/cargo.txt"
          python3 scripts/record-storage-environment --output "$RUNNER_TEMP/snapshot-process-evidence/storage-environment.json"
      - name: Kill snapshot writers at every selected publication boundary
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/snapshot-process-target"
          export RAFTER_SNAPSHOT_PROCESS_ARTIFACTS="$RUNNER_TEMP/snapshot-process-evidence/cases"
          scripts/cargo-test-exact 1 - --locked -p rafter-storage --lib -- --ignored --exact storage_failpoint_test::snapshot_process_test::snapshot_publication_survives_process_loss --nocapture 2>&1 | tee "$RUNNER_TEMP/snapshot-process-evidence/process.log"
      - name: Verify source preservation
        if: always()
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          git ls-files -z | xargs -0 sha256sum > "$RUNNER_TEMP/snapshot-process-evidence/source-after.sha256"
          cmp "$RUNNER_TEMP/snapshot-process-evidence/source-before.sha256" "$RUNNER_TEMP/snapshot-process-evidence/source-after.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: snapshot-process-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/snapshot-process-evidence
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  fsync-probe:
    # This job owns a new image and mapping in a fresh hosted VM, never a host disk.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check portable failure and ownership controls
        run: python3 -m unittest scripts/tests/test_io_stall_volume.py scripts/tests/test_io_stall_controller.py scripts/tests/test_io_stall_runner.py scripts/tests/test_io_stall_counter.py scripts/tests/test_io_stall_crash.py scripts/tests/test_io_stall_majority.py scripts/tests/test_io_stall_resources.py scripts/tests/test_storage_environment.py
      - name: Qualify the owned filesystem stall and cleanup
        run: |
          python3 scripts/check-io-stall --disposable-linux-vm \
            --artifacts "$RUNNER_TEMP/io-stall-evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: io-stall-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/io-stall-evidence
          if-no-files-found: error
          retention-days: 30

  tls-counter:
    needs: fsync-probe
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.88.0"
          components: rustfmt, clippy
      - name: Qualify handshake deadlines and smoke-test the exact checkout counter
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/io-stall-counter-build"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD > "$RUNNER_TEMP/io-stall-counter-build/source.txt"
          git ls-files -z | xargs -0 sha256sum > "$RUNNER_TEMP/io-stall-counter-build/source-before.sha256"
          rustc --version --verbose > "$RUNNER_TEMP/io-stall-counter-build/rustc.txt"
          cargo --version > "$RUNNER_TEMP/io-stall-counter-build/cargo.txt"
          python3 scripts/record-storage-environment --output "$RUNNER_TEMP/io-stall-counter-build/storage-environment.json"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/io-stall-transport-target"
          scripts/cargo-test-exact 2 - --locked -p rafter-transport-tls --test handshake_deadline -- --nocapture 2>&1 | tee "$RUNNER_TEMP/io-stall-counter-build/handshake-deadline.log"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/io-stall-counter-target"
          python3 scripts/check-counter-guide --mode checkout \
            --soak-artifacts "$RUNNER_TEMP/io-stall-counter-soak" \
            2>&1 | tee "$RUNNER_TEMP/io-stall-counter-build/build.log"
          test -z "$(git status --porcelain)"
          git ls-files -z | xargs -0 sha256sum > "$RUNNER_TEMP/io-stall-counter-build/source-after.sha256"
          cmp "$RUNNER_TEMP/io-stall-counter-build/source-before.sha256" "$RUNNER_TEMP/io-stall-counter-build/source-after.sha256"
      - name: Exercise write outcomes and recovery across an actual filesystem stall
        run: |
          python3 scripts/check-io-stall --disposable-linux-vm \
            --counter-binary "$RUNNER_TEMP/io-stall-counter-target/checkout/debug/rafter-counter" \
            --artifacts "$RUNNER_TEMP/io-stall-counter-evidence"
      - name: Exercise process loss while the filesystem is stalled
        run: |
          python3 scripts/check-io-stall --disposable-linux-vm --crash-while-stalled \
            --counter-binary "$RUNNER_TEMP/io-stall-counter-target/checkout/debug/rafter-counter" \
            --artifacts "$RUNNER_TEMP/io-stall-crash-evidence"
      - name: Require healthy-majority progress while only the leader filesystem is stalled
        run: |
          python3 scripts/check-io-stall --disposable-linux-vm --leader-only \
            --counter-binary "$RUNNER_TEMP/io-stall-counter-target/checkout/debug/rafter-counter" \
            --artifacts "$RUNNER_TEMP/io-stall-majority-evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: io-stall-counter-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/io-stall-counter-build
            ${{ runner.temp }}/io-stall-counter-soak
            ${{ runner.temp }}/io-stall-counter-evidence
            ${{ runner.temp }}/io-stall-crash-evidence
            ${{ runner.temp }}/io-stall-majority-evidence
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
