# Benchmark evidence lane. PRs get a cheap smoke check that validates the
# harness. Main, scheduled, and manually dispatched runs produce median-of-N
# artifacts suitable for review, including deterministic shape-counter
# consistency checks. Branch protection should not require absolute throughput
# from this workflow.
#
# Benchmark evidence is pinned to the compiler recorded by the checked-in
# benchmark artifacts. This is separate from the workspace rust-version, which
# is the crate compatibility floor.

name: Benchmarks

on:
  pull_request:
    paths:
      - ".github/workflows/benchmarks.yml"
      - "bench-compare/**"
      - "scripts/bench-compare.sh"
      - "scripts/model-check-profile-compare"
      - "scripts/model-check-profile-pair"
      - "scripts/model_check_contract_migration.py"
      - "scripts/model_check_profile_parser.py"
      - "scripts/model_check_profile_report.py"
      - "scripts/tests/test_model_check_profile_report.py"
      - "verification/model-check-contract-migrations.json"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
  push:
    branches: [main]
    paths:
      - ".github/workflows/benchmarks.yml"
      - "bench-compare/**"
      - "scripts/bench-compare.sh"
      - "scripts/model-check-profile-compare"
      - "scripts/model-check-profile-pair"
      - "scripts/model_check_contract_migration.py"
      - "scripts/model_check_profile_parser.py"
      - "scripts/model_check_profile_report.py"
      - "scripts/tests/test_model_check_profile_report.py"
      - "verification/model-check-contract-migrations.json"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
  schedule:
    - cron: "0 11 * * 1" # 11:00 UTC Monday
  workflow_dispatch:
    inputs:
      runs:
        description: "Isolated runs per benchmark binary for evidence jobs"
        required: true
        default: "5"
      model_check_base_ref:
        description: "Explicit baseline ref for model-check overhead evidence"
        required: true
        default: "HEAD^"

concurrency:
  group: benchmarks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

defaults:
  run:
    shell: bash

jobs:
  smoke:
    name: benchmark-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Rafter-only smoke benchmark
        run: |
          mkdir -p target/bench-compare
          BENCH_COMPARE_RUNS=1 \
            BENCH_COMPARE_MODE=rafter-only \
            OUT=target/bench-compare/rafter-only-smoke.json \
            scripts/bench-compare.sh
      - name: Model-check evidence parser contract
        run: |
          test -x scripts/model-check-profile-compare
          test -x scripts/model-check-profile-pair
          bash -n scripts/model-check-profile-compare
          bash -n scripts/model-check-profile-pair
          python3 -m py_compile \
            scripts/model_check_contract_migration.py \
            scripts/model_check_profile_parser.py \
            scripts/model_check_profile_report.py
          python3 -m unittest scripts/tests/test_model_check_profile_report.py
      - name: Summarize smoke result
        if: always()
        run: |
          if [[ -f target/bench-compare/rafter-only-smoke.json ]]; then
            {
              echo "### Rafter-only smoke benchmark"
              echo
              echo '```text'
              jq -r '
                .results[]
                | .library as $library
                | .workloads[]
                | [$library, .name, (.proposals_per_s|tostring)]
                | @tsv
              ' target/bench-compare/rafter-only-smoke.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload smoke artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-compare-smoke
          path: target/bench-compare/rafter-only-smoke.json
          if-no-files-found: ignore

  evidence:
    name: benchmark-evidence
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      BENCH_RUNS: ${{ github.event_name == 'workflow_dispatch' && inputs.runs || '5' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.1
      - name: Install protoc for full comparison
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Rafter-only benchmark evidence
        run: |
          mkdir -p target/bench-compare
          BENCH_COMPARE_RUNS="$BENCH_RUNS" \
            BENCH_COMPARE_MODE=rafter-only \
            OUT=target/bench-compare/rafter-only.json \
            scripts/bench-compare.sh
      - name: Full comparison benchmark evidence
        run: |
          BENCH_COMPARE_RUNS="$BENCH_RUNS" \
            OUT=target/bench-compare/latest.json \
            scripts/bench-compare.sh
      - name: Summarize benchmark evidence
        if: always()
        run: |
          summarize() {
            local title="$1"
            local file="$2"
            if [[ ! -f "$file" ]]; then
              return
            fi
            echo "### $title"
            echo
            echo '```text'
            jq -r '
              .results[]
              | .library as $library
              | .workloads[]
              | [
                  $library,
                  .name,
                  ("median=" + (.proposals_per_s|tostring)),
                  ("min=" + (.run_summary.proposals_per_s.min|tostring)),
                  ("max=" + (.run_summary.proposals_per_s.max|tostring))
                ]
              | @tsv
            ' "$file"
            echo '```'
            echo
          }
          {
            summarize "Rafter-only median benchmark evidence" target/bench-compare/rafter-only.json
            summarize "Full comparison median benchmark evidence" target/bench-compare/latest.json
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload benchmark evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-compare-evidence
          path: |
            target/bench-compare/rafter-only.json
            target/bench-compare/latest.json
          if-no-files-found: ignore

  model-check-evidence:
    name: model-check-overhead-evidence
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Select baseline
        id: baseline
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_BASE: ${{ inputs.model_check_base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT_NAME" in
            push)
              base="$PUSH_BEFORE"
              if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
                base="HEAD^"
              fi
              ;;
            workflow_dispatch) base="$MANUAL_BASE" ;;
            schedule) base="HEAD^" ;;
            *) echo "unsupported benchmark event: $EVENT_NAME" >&2; exit 2 ;;
          esac
          git rev-parse "$base^{commit}"
          echo "ref=$base" >> "$GITHUB_OUTPUT"
      - name: Repeated model-check overhead comparison
        env:
          MODEL_CHECK_BASE_REF: ${{ steps.baseline.outputs.ref }}
          MODEL_CHECK_PROFILES: fast
          MODEL_CHECK_RUNS: "6"
          MODEL_CHECK_MAX_MEDIAN_WALL_RATIO: "2.25"
          MODEL_CHECK_MAX_MEDIAN_RSS_RATIO: "1.75"
          MODEL_CHECK_CONTRACT_MIGRATIONS: verification/model-check-contract-migrations.json
          OUT_DIR: target/model-check-profile
        run: scripts/model-check-profile-compare
      - name: Summarize model-check overhead
        if: always()
        run: |
          if [[ -f target/model-check-profile/compare.md ]]; then
            cat target/model-check-profile/compare.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Model-check overhead report construction failed; inspect the uploaded raw evidence and SHA256SUMS." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload model-check overhead evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-check-overhead-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: target/model-check-profile/
          if-no-files-found: error
          retention-days: 30
