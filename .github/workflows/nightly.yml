# Nightly lane: curated deep/soak regressions, source-derived nightly
# invariant evidence, the burn-in script, long fuzz runs, and the
# nightly-scale ignored test.
#
# Profiles come from `rafter-model-check-fast --list-profiles`:
#   fast (per-commit) | raft-deep, raft-soak (local-minutes) |
#   raft-nightly (scheduled) | raft-weekly (weekly-scheduled)
# The fast profile is covered per-PR in ci.yml. `raft-deep` and `raft-soak`
# are fixed-seed curated regression legs even when scheduled here. The
# invariant simulator producer derives replayable scheduled seeds from the
# checked-out commit.
# The weekly-scheduled Rust profile runs in weekly.yml.
#
# Toolchain pinned to the workspace rust-version in Cargo.toml (1.88); keep
# the dtolnay/rust-toolchain refs in sync when bumping it.

name: Nightly

on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC daily
  workflow_dispatch:

# One nightly at a time; a manual dispatch queues behind a running one
# instead of cancelling multi-hour work.
concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

defaults:
  run:
    # bash -eo pipefail, so `cmd | tee log` still fails the step when cmd fails.
    shell: bash

jobs:
  model-check:
    name: model-check (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        profile: [raft-deep, raft-soak]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: model check (${{ matrix.profile }})
        run: |
          cargo run --release --locked -p rafter-sim --bin rafter-model-check-fast -- \
            --profile ${{ matrix.profile }} 2>&1 | tee "model-check-${{ matrix.profile }}.log"
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-check-${{ matrix.profile }}-log
          path: model-check-${{ matrix.profile }}.log
          if-no-files-found: error
          retention-days: 30

  invariants-tests:
    name: invariants-tests-nightly
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Produce source-bound nightly test evidence
        run: cargo run --locked -p rafter-invariants -- run --profile nightly --layer tests
      - name: Upload nightly test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invariants-nightly-evidence-tests-${{ github.run_id }}-${{ github.run_attempt }}
          overwrite: true
          path: |
            artifacts/invariants/nightly-tests.json
            artifacts/invariants/nightly-tests/
          if-no-files-found: error
          retention-days: 30
      - name: Upload nightly test process diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invariants-nightly-tests-process-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/rafter-invariants/telemetry/
            crates/rafter-invariants/target/rafter-invariants/telemetry/
          if-no-files-found: ignore
          retention-days: 30

  invariants-simulator:
    name: invariants-simulator-nightly
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Produce source-bound nightly simulator evidence
        run: cargo run --locked -p rafter-invariants -- run --profile nightly --layer simulator
      - name: Upload nightly simulator evidence and replay logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invariants-nightly-evidence-simulator-${{ github.run_id }}-${{ github.run_attempt }}
          overwrite: true
          path: |
            artifacts/invariants/nightly-simulator.json
            artifacts/invariants/nightly-simulator/
          if-no-files-found: error
          retention-days: 30
      - name: Upload nightly simulator process diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invariants-nightly-simulator-process-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/rafter-invariants/telemetry/
            crates/rafter-invariants/target/rafter-invariants/telemetry/
          if-no-files-found: ignore
          retention-days: 30

  invariants-tla:
    name: invariants-tla-nightly
    # The source-bound nightly graph is larger than the PR graph; use the same
    # checkpoint-capable runner class as weekly while keeping the step capped.
    runs-on: [self-hosted, linux, X64]
    timeout-minutes: 400
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # scripts/tla-model-check downloads tla2tools.jar pinned by
      # the immutable asset ID and SHA-256 before every run, so a cache hit is
      # an optimization, never a trust decision.
      - name: Cache tla2tools.jar
        uses: actions/cache@v4
        with:
          path: tools/cache
          key: tla2tools-${{ hashFiles('tools/tla/VERSION', 'tools/tla/ASSET_ID', 'tools/tla/SHA256SUMS') }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Restore exact-compatible nightly TLC checkpoint
        id: checkpoint-restore
        uses: actions/cache/restore@v4
        with:
          path: target/rafter-invariants/tla-checkpoint/nightly
          key: tla-nightly-checkpoint-v1-${{ hashFiles('verification/raft-invariant-profiles.json', 'specs/tla/raft/Raft.tla', 'specs/tla/raft/RaftNightly.cfg', 'specs/tla/raft/RaftMembershipTraceSample.tla', 'specs/tla/raft/RaftMembershipTraceSample.cfg', 'specs/tla/raft/RafterInvariantDetectorNegative.tla', 'specs/tla/raft/RafterInvariantDetectorNegative.cfg', 'scripts/tla-model-check', 'tools/tla/ASSET_ID', 'tools/tla/SHA256SUMS', 'Cargo.toml', 'Cargo.lock', 'crates/rafter-invariants/Cargo.toml', 'crates/rafter-invariants/src/**/*.rs') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            tla-nightly-checkpoint-v1-${{ hashFiles('verification/raft-invariant-profiles.json', 'specs/tla/raft/Raft.tla', 'specs/tla/raft/RaftNightly.cfg', 'specs/tla/raft/RaftMembershipTraceSample.tla', 'specs/tla/raft/RaftMembershipTraceSample.cfg', 'specs/tla/raft/RafterInvariantDetectorNegative.tla', 'specs/tla/raft/RafterInvariantDetectorNegative.cfg', 'scripts/tla-model-check', 'tools/tla/ASSET_ID', 'tools/tla/SHA256SUMS', 'Cargo.toml', 'Cargo.lock', 'crates/rafter-invariants/Cargo.toml', 'crates/rafter-invariants/src/**/*.rs') }}-
      - name: Produce source-bound nightly TLA+ evidence
        timeout-minutes: 360
        run: cargo run --locked -p rafter-invariants -- run --profile nightly --layer tla
      - name: Save exact-compatible nightly TLC checkpoint
        if: ${{ always() && hashFiles('target/rafter-invariants/tla-checkpoint/nightly/CACHE_VALID') != '' }}
        uses: actions/cache/save@v4
        with:
          path: target/rafter-invariants/tla-checkpoint/nightly
          key: tla-nightly-checkpoint-v1-${{ hashFiles('verification/raft-invariant-profiles.json', 'specs/tla/raft/Raft.tla', 'specs/tla/raft/RaftNightly.cfg', 'specs/tla/raft/RaftMembershipTraceSample.tla', 'specs/tla/raft/RaftMembershipTraceSample.cfg', 'specs/tla/raft/RafterInvariantDetectorNegative.tla', 'specs/tla/raft/RafterInvariantDetectorNegative.cfg', 'scripts/tla-model-check', 'tools/tla/ASSET_ID', 'tools/tla/SHA256SUMS', 'Cargo.toml', 'Cargo.lock', 'crates/rafter-invariants/Cargo.toml', 'crates/rafter-invariants/src/**/*.rs') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload nightly TLA+ evidence and counterexamples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invariants-nightly-evidence-tla-${{ github.run_id }}-${{ github.run_attempt }}
          overwrite: true
          path: |
            artifacts/invariants/nightly-tla.json
            artifacts/invariants/nightly-tla/
          if-no-files-found: error
          retention-days: 30
      - name: Upload nightly TLA+ process diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invariants-nightly-tla-process-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/rafter-invariants/telemetry/
            crates/rafter-invariants/target/rafter-invariants/telemetry/
          if-no-files-found: ignore
          retention-days: 30

  burn-in:
    name: burn-in
    runs-on: ubuntu-latest
    # The nightly burn-in mode runs the raft-nightly model-check profile in a
    # release build plus the rafter-storage test suite. GitHub-hosted jobs
    # hard-cap at 360 minutes.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Raft burn-in (nightly mode)
        run: scripts/raft-burn-in nightly --run-id "gha-${{ github.run_id }}"
      # The script writes per-step logs, summary.tsv, and run.json under
      # target/raft-burn-in/<run-id>/.
      - name: Upload burn-in logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: burn-in-logs
          path: target/raft-burn-in/
          if-no-files-found: error
          retention-days: 30

  invariants-maelstrom:
    name: invariants-maelstrom-nightly
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Maelstrom analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends graphviz gnuplot-nox
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install Maelstrom
        run: |
          version=v0.2.4
          archive=/tmp/maelstrom.tar.bz2
          expected=301ec71d6b12af0d765edb413f5cf5aa1046b5609bd4e31376a0b549548e5799
          curl -fsSL -o "$archive" \
            "https://github.com/jepsen-io/maelstrom/releases/download/${version}/maelstrom.tar.bz2"
          actual="$(sha256sum "$archive" | awk '{ print $1 }')"
          if [[ "$actual" != "$expected" ]]; then
            echo "maelstrom sha256 mismatch: expected $expected got $actual" >&2
            exit 1
          fi
          tar -xjf "$archive" -C /tmp
          echo "/tmp/maelstrom" >> "$GITHUB_PATH"
      - name: Produce all six nightly Maelstrom evidence scenarios
        run: cargo run --locked -p rafter-invariants -- run --profile nightly --layer maelstrom
      - name: Independently verify nightly Maelstrom evidence
        run: >-
          cargo run --locked -p rafter-invariants -- verify-layer
          --profile nightly --layer maelstrom
          --result artifacts/invariants/nightly-maelstrom.json
      - name: Upload source-bound Maelstrom receipts and replay artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invariants-nightly-evidence-maelstrom-${{ github.run_id }}-${{ github.run_attempt }}
          overwrite: true
          path: |
            artifacts/invariants/nightly-maelstrom.json
            artifacts/invariants/nightly-maelstrom/
          if-no-files-found: error
          retention-days: 30
      - name: Upload nightly Maelstrom process diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invariants-nightly-maelstrom-process-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/rafter-invariants/telemetry/
            crates/rafter-invariants/target/rafter-invariants/telemetry/
          if-no-files-found: ignore
          retention-days: 30

  invariants-nightly:
    name: invariants-nightly
    needs:
      - invariants-tests
      - invariants-simulator
      - invariants-tla
      - invariants-maelstrom
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      INVARIANT_EVIDENCE_DIR: rafter-invariants-nightly-evidence-${{ github.run_id }}-${{ github.run_attempt }}
      INVARIANT_REPORT_DIR: rafter-invariants-nightly-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Download available nightly test evidence
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: invariants-nightly-evidence-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ env.INVARIANT_EVIDENCE_DIR }}/tests
      - name: Download available nightly simulator evidence
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: invariants-nightly-evidence-simulator-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ env.INVARIANT_EVIDENCE_DIR }}/simulator
      - name: Download available nightly TLA+ evidence
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: invariants-nightly-evidence-tla-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ env.INVARIANT_EVIDENCE_DIR }}/tla
      - name: Download available nightly Maelstrom evidence
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: invariants-nightly-evidence-maelstrom-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ env.INVARIANT_EVIDENCE_DIR }}/maelstrom
      - name: Stage current-run nightly evidence artifacts
        if: always()
        run: |
          transport_root="$RUNNER_TEMP/$INVARIANT_EVIDENCE_DIR"
          evidence_root="artifacts/invariants"
          mkdir -p "$evidence_root"
          for layer in tests simulator tla maelstrom; do
            source="$transport_root/$layer/nightly-$layer"
            destination="$evidence_root/nightly-$layer"
            test -s "$source.json"
            test -d "$source"
            if [[ -e "$destination" || -e "$destination.json" ]]; then
              echo "refusing stale or colliding nightly evidence target: $destination" >&2
              exit 1
            fi
          done
          for layer in tests simulator tla maelstrom; do
            cp -R "$transport_root/$layer/nightly-$layer" "$evidence_root/nightly-$layer"
          done
      - name: Build source-bound Maelstrom verification binaries
        timeout-minutes: 2
        run: cargo build --locked -p rafter-maelstrom --bins
      - name: Aggregate exactly 44 nightly invariant verdicts
        if: always()
        id: aggregate
        timeout-minutes: 8
        run: |
          report_dir="$RUNNER_TEMP/$INVARIANT_REPORT_DIR"
          mkdir -p "$report_dir"
          set +e
          cargo run --locked -p rafter-invariants -- check --profile nightly --source-ref "$GITHUB_SHA" \
            --result "$RUNNER_TEMP/$INVARIANT_EVIDENCE_DIR/tests/nightly-tests.json" \
            --result "$RUNNER_TEMP/$INVARIANT_EVIDENCE_DIR/simulator/nightly-simulator.json" \
            --result "$RUNNER_TEMP/$INVARIANT_EVIDENCE_DIR/tla/nightly-tla.json" \
            --result "$RUNNER_TEMP/$INVARIANT_EVIDENCE_DIR/maelstrom/nightly-maelstrom.json" \
            --output-dir "$report_dir"
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Validate current-run nightly reports
        if: always()
        id: report
        timeout-minutes: 1
        run: |
          report_dir="$RUNNER_TEMP/$INVARIANT_REPORT_DIR"
          complete=true
          for extension in json xml md; do
            if [[ ! -s "$report_dir/nightly.$extension" ]]; then
              complete=false
            fi
          done
          if [[ "$complete" = "true" ]] && ! jq -e \
            '.profile == "nightly" and .summary.total == 44 and (.invariants | length) == 44' \
            "$report_dir/nightly.json" >/dev/null; then
            complete=false
          fi
          if [[ "$complete" = "true" ]]; then
            expected_ids="$report_dir/expected.ids"
            json_ids="$report_dir/json.ids"
            markdown_ids="$report_dir/markdown.ids"
            junit_ids="$report_dir/junit.ids"
            jq -r ".[\"\$defs\"].invariant.properties.invariant_id.enum[]" \
              verification/invariant-verdict-schema.json | LC_ALL=C sort > "$expected_ids"
            jq -r '.invariants[].invariant_id' "$report_dir/nightly.json" | \
              LC_ALL=C sort > "$json_ids"
            # Dollar signs below are regex anchors.
            # shellcheck disable=SC2016
            sed -nE 's/^\| `([^`]+)` \| (GREEN|RED) \|.*$/\1/p' \
              "$report_dir/nightly.md" | LC_ALL=C sort > "$markdown_ids"
            # Dollar signs below are regex anchors.
            # shellcheck disable=SC2016
            sed -nE 's/^[[:space:]]*<testcase classname="rafter\.invariants" name="([^"]+)">$/\1/p' \
              "$report_dir/nightly.xml" | LC_ALL=C sort > "$junit_ids"
            if [[ "$(wc -l < "$expected_ids")" -ne 44 || \
                  "$(LC_ALL=C uniq "$expected_ids" | wc -l)" -ne 44 ]] || \
               ! cmp -s "$expected_ids" "$json_ids" || \
               ! cmp -s "$expected_ids" "$markdown_ids" || \
               ! cmp -s "$expected_ids" "$junit_ids"; then
              complete=false
            fi
          fi
          echo "complete=$complete" >> "$GITHUB_OUTPUT"
      - name: Render the 44-row nightly report
        if: always()
        timeout-minutes: 1
        env:
          REPORT_READY: ${{ steps.report.outputs.complete }}
        run: |
          if [[ "$REPORT_READY" = "true" ]]; then
            cat "$RUNNER_TEMP/$INVARIANT_REPORT_DIR/nightly.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Raft invariant gate" >> "$GITHUB_STEP_SUMMARY"
            echo "No complete current-run 44-row nightly report was produced; the aggregate is red." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload available nightly aggregate reports
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: invariants-nightly-report-${{ github.run_id }}-${{ github.run_attempt }}
          overwrite: true
          path: |
            ${{ runner.temp }}/${{ env.INVARIANT_REPORT_DIR }}/nightly.json
            ${{ runner.temp }}/${{ env.INVARIANT_REPORT_DIR }}/nightly.xml
            ${{ runner.temp }}/${{ env.INVARIANT_REPORT_DIR }}/nightly.md
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload available nightly aggregate evidence
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: invariants-nightly-aggregate-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          overwrite: true
          path: ${{ runner.temp }}/${{ env.INVARIANT_EVIDENCE_DIR }}/
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload nightly aggregate process diagnostics
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: invariants-nightly-aggregate-process-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/rafter-invariants/telemetry/
            crates/rafter-invariants/target/rafter-invariants/telemetry/
          if-no-files-found: ignore
          retention-days: 30
      - name: Require 44 of 44 nightly invariants green
        if: always()
        timeout-minutes: 1
        env:
          AGGREGATE_STATUS: ${{ steps.aggregate.outputs.status }}
          REPORT_READY: ${{ steps.report.outputs.complete }}
          TESTS_RESULT: ${{ needs.invariants-tests.result }}
          SIMULATOR_RESULT: ${{ needs.invariants-simulator.result }}
          TLA_RESULT: ${{ needs.invariants-tla.result }}
          MAELSTROM_RESULT: ${{ needs.invariants-maelstrom.result }}
        run: |
          test "$TESTS_RESULT" = "success"
          test "$SIMULATOR_RESULT" = "success"
          test "$TLA_RESULT" = "success"
          test "$MAELSTROM_RESULT" = "success"
          test "$AGGREGATE_STATUS" = "0"
          test "$REPORT_READY" = "true"
          jq -e '.summary.total == 44 and .summary.green == 44 and .summary.red == 0 and (.invariants | length) == 44' \
            "$RUNNER_TEMP/$INVARIANT_REPORT_DIR/nightly.json" >/dev/null

  fuzz-long:
    name: fuzz-long (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 90 # 30 min of fuzzing + toolchain, cargo-fuzz install, and sanitizer build
    strategy:
      fail-fast: false
      matrix:
        target:
          - codec_decode
          - storage_snapshot_decode
          - node_message_sequences
          - cluster_schedules
    steps:
      - uses: actions/checkout@v4
      # Keep this directory guard so the workflow remains usable on older
      # release branches that predate the fuzz workspace.
      - name: Check for fuzz targets
        id: fuzz-dir
        run: |
          if [ -d fuzz ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "fuzz/ not present on this ref; skipping long fuzz"
          fi
      - uses: dtolnay/rust-toolchain@nightly
        if: steps.fuzz-dir.outputs.exists == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.fuzz-dir.outputs.exists == 'true'
        with:
          cache-on-failure: true
      - name: Install cargo-fuzz
        if: steps.fuzz-dir.outputs.exists == 'true'
        run: command -v cargo-fuzz >/dev/null || cargo install cargo-fuzz --locked
      - name: Fuzz ${{ matrix.target }} for 30 minutes
        if: steps.fuzz-dir.outputs.exists == 'true'
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=1800
      - name: Upload crash artifacts
        if: failure() && steps.fuzz-dir.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-long-${{ matrix.target }}-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore

  multi-gigabyte-test:
    name: multi-gigabyte-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Ignored nightly-scale test
        # Runs exactly node::tests::snapshot::streaming::
        # multi_gigabyte_snapshot_transfer_stays_bounded, which is
        # #[ignore]d as nightly-scale (streams a 4.5 GiB synthetic payload;
        # ~3 s in release locally).
        run: |
          scripts/cargo-test-exact 1 multi_gigabyte -p rafter --release -- --ignored 2>&1 | tee multi-gigabyte.log
      - name: Upload log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: multi-gigabyte-test-log
          path: multi-gigabyte.log
          if-no-files-found: ignore
