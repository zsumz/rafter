# Per-PR lane: fmt, clippy -D warnings, rustdoc, workspace tests, the
# reference-consumer acceptance lanes, deterministic invariant evidence
# aggregation, and fuzz smoke.
#
# "A PR cannot merge red" is enforced by branch protection, which lives in
# repository settings, not in this file. Branch protection on `main` must
# list these required status checks:
#
#   lint, test, reference-source, reference-package, reference-package-msrv,
#   fuzz-smoke, invariants-pr
#
# `reference-process` is deliberately absent from that list: it only runs on
# pushes to main, so it never reports on a pull request and a required check
# that never reports blocks every merge. docs/reference-consumers.md assigns
# durable process tests to the main/nightly lane, and nightly.yml runs the
# other half.
#
# The Rust toolchain is pinned to the workspace rust-version in Cargo.toml
# (currently 1.88). Keep .github/actions/setup-rust/action.yml's default in
# sync with Cargo.toml when bumping rust-version.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs of the same PR; never cancel runs on main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

defaults:
  run:
    # bash -eo pipefail, so piped commands cannot hide failures.
    shell: bash

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          cache-on-failure: true
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        # Workspace lints set clippy::{all,pedantic} = warn; -D warnings
        # escalates them (and rustc warnings) to errors.
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: rustdoc
        # The ten crates in RELEASE.md's publish list reach docs.rs, and until
        # this step nothing built their documentation at all. The script
        # explains why the published set is documented by name instead of
        # relying on --workspace, which unifies rafter's internal-test-hooks
        # feature in from rafter-sim and so documents a shape that never ships.
        run: scripts/rustdoc-check
      - name: work-completion proof references
        run: scripts/work-completion-check
      - name: out-of-workspace manifests
        # `cargo fmt --all` and `cargo clippy --workspace` above stop at the
        # workspace members. fuzz/ and bench-compare/ keep their own manifests
        # outside the workspace, so they need their own invocations. Two gaps
        # remain and are recorded in RELEASE.md rather than implied away:
        # bench-compare is not format-checked here, and its third-party
        # comparison binaries stay behind their default features because they
        # need protoc, which only benchmarks.yml installs.
        run: |
          cargo fmt --manifest-path fuzz/Cargo.toml --all -- --check
          cargo clippy --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path bench-compare/Cargo.toml --locked \
            --no-default-features --all-targets -- -D warnings
      - name: transport receive-memory allocation gate
        run: |
          cargo run --manifest-path bench-compare/Cargo.toml --locked \
            --no-default-features --bin check-transport-receive-memory
      - name: reviewed action pins resolve upstream
        # `cargo test --workspace` already asserts that these workflows use
        # exactly the specifications in verification/github-actions.lock, and
        # that each is a full 40-hex commit. That is a text comparison: it
        # cannot tell a real revision from one that was never pushed or has
        # since been removed. This resolves every locked specification against
        # the GitHub API, which is the half the comparison cannot do.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/verify-action-pins

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          cache-on-failure: true
      - name: Prefetch locked registry for offline source identity
        run: cargo fetch --locked
      - name: dependency boundary tests
        run: scripts/cargo-test-exact 6 dependency_boundary --workspace
      - name: source boundary tests
        run: scripts/cargo-test-exact 2 source_boundary -p rafter
      - name: file-size guard
        run: scripts/cargo-test-exact 1 file_size_guard -p rafter -- --nocapture
      - name: test-location guard
        run: scripts/cargo-test-exact 3 - -p rafter --test test_location_guard -- --nocapture
      - name: public API/docs guard
        run: scripts/cargo-test-exact 8 - -p rafter --test public_api_docs_guard -- --nocapture
      - name: invariant docs guard
        run: python3 scripts/render-raft-invariants-doc --check
      - name: workspace tests
        run: scripts/ci-run-diagnosed workspace-tests target/rafter-invariants/ci-diagnostics/workspace-tests.log cargo test --workspace
      - name: insecure TCP transport loopback tests
        # Two #[ignore]d tests in a publishable crate that no lane ran. They
        # are ignored because they bind loopback, which every runner here has.
        run: scripts/cargo-test-exact 2 - -p rafter-transport-tcp-insecure --lib -- --ignored
      - name: replicated KV process lifecycle
        run: scripts/cargo-test-exact 1 - -p rafter-runtime --test replicated_kv_example -- --ignored --exact replicated_kv_process_per_node_tcp_survives_kill_restart --nocapture
      - name: Upload test process diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-process-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/rafter-invariants/telemetry/
            target/rafter-invariants/ci-diagnostics/
            crates/rafter-invariants/target/rafter-invariants/telemetry/
          if-no-files-found: ignore
          retention-days: 30

  invariants-tests:
    name: invariants-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/configure-invariant-cargo
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          cache-on-failure: true
          cache-targets: false
          cache-bin: false
      - name: Prefetch locked registry for offline source identity
        run: cargo fetch --locked
      - name: Produce test evidence
        env:
          CI_DIAGNOSTIC_RECEIPT: artifacts/invariants/pr-tests.json
        run: scripts/ci-run-diagnosed tests-producer target/rafter-invariants/ci-diagnostics/tests-producer.log cargo run --locked -p rafter-invariants -- run --profile pr --layer tests
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: invariants-pr-evidence-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/invariants/pr-tests.json
            artifacts/invariants/pr-tests/
          if-no-files-found: error
          retention-days: 30
      - name: Upload test evidence process diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: invariants-tests-process-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/rafter-invariants/telemetry/
            target/rafter-invariants/ci-diagnostics/
            crates/rafter-invariants/target/rafter-invariants/telemetry/
          if-no-files-found: ignore
          retention-days: 30

  invariants-launcher-macos:
    name: invariants-launcher-macos
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/configure-invariant-cargo
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          cache-on-failure: true
          cache-targets: false
          cache-bin: false
      - name: Prefetch locked registry for offline source identity
        run: cargo fetch --locked
      - name: Validate managed process launcher on macOS
        id: launcher-validation
        env:
          CARGO_TERM_COLOR: never
        run: |
          set -o pipefail
          mkdir -p target/rafter-invariants/ci-diagnostics
          {
            scripts/cargo-test-exact 58 execution::process:: --locked -p rafter-invariants -- --test-threads=1
            scripts/cargo-test-exact 18 producer::process::tests --locked -p rafter-invariants -- --test-threads=1
            scripts/cargo-test-exact 4 producer::test_exec::detector_proof::tests --locked -p rafter-invariants -- --test-threads=1
            scripts/cargo-test-exact 1 producer::test_exec::process_tests --locked -p rafter-invariants -- --test-threads=1
            scripts/cargo-test-exact 11 detector_proof::tests --locked -p rafter-invariants -- --test-threads=1
            scripts/cargo-test-exact 45 verification::detector::source::tests --locked -p rafter-invariants -- --test-threads=1
            scripts/cargo-test-exact 23 verification::detector::source::adversarial_tests --locked -p rafter-invariants -- --test-threads=1
            scripts/cargo-test-exact 16 artifact_verify::simulator::event_semantics_tests --locked -p rafter-invariants -- --test-threads=1
            scripts/cargo-test-exact 8 artifact_verify::test_logs::tests --locked -p rafter-invariants -- --test-threads=1
            scripts/cargo-test-exact 4 provenance::image::tests --locked -p rafter-invariants -- --test-threads=1
            scripts/cargo-test-exact 1 - --locked -p rafter-invariants --test producer_reexec -- --test-threads=1
          } 2>&1 | tee target/rafter-invariants/ci-diagnostics/macos-launcher.log
      - name: Annotate macOS launcher failure
        if: failure() && steps.launcher-validation.outcome == 'failure'
        shell: bash
        run: |
          log=target/rafter-invariants/ci-diagnostics/macos-launcher.log
          summary=target/rafter-invariants/ci-diagnostics/macos-launcher-summary.log
          awk '
            /^error(\[[^]]+\])?:/ { context = 8; print; next }
            context > 0 { print; context -= 1; next }
            /panicked at|^failures:|FAILED$|^test result:|^error: test failed/ { print }
          ' "$log" > "$summary"
          diagnostic="$(tail -c 3500 "$summary" | tr '\n' ' ')"
          diagnostic="${diagnostic//'%'/'%25'}"
          echo "::error title=macOS launcher failure summary::$diagnostic"
          diagnostic="$(tail -c 3500 "$log" | tr '\n' ' ')"
          diagnostic="${diagnostic//'%'/'%25'}"
          echo "::error title=macOS launcher terminal output::$diagnostic"
      - name: Upload macOS launcher diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: invariants-launcher-macos-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/rafter-invariants/telemetry/
            target/rafter-invariants/ci-diagnostics/
            crates/rafter-invariants/target/rafter-invariants/telemetry/
          if-no-files-found: ignore
          retention-days: 30

  invariants-simulator:
    name: invariants-simulator
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/configure-invariant-cargo
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          cache-on-failure: true
          cache-targets: false
          cache-bin: false
      - name: Prefetch locked registry for offline source identity
        run: cargo fetch --locked
      - name: Validate artifact verifier compatibility inventory
        run: 'scripts/ci-run-diagnosed simulator-verifier target/rafter-invariants/ci-diagnostics/simulator-verifier.log scripts/cargo-test-exact 61 artifact_verify:: --inventory verification/artifact-verifier-test-inventory.txt --locked -p rafter-invariants --lib -- --test-threads=1'
      - name: Produce simulator evidence
        env:
          CI_DIAGNOSTIC_RECEIPT: artifacts/invariants/pr-simulator.json
        run: scripts/ci-run-diagnosed simulator-producer target/rafter-invariants/ci-diagnostics/simulator-producer.log cargo run --locked -p rafter-invariants -- run --profile pr --layer simulator
      - name: Upload simulator evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: invariants-pr-evidence-simulator-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/invariants/pr-simulator.json
            artifacts/invariants/pr-simulator/
            artifacts/invariants/pr-simulator-detectors-tests/
          if-no-files-found: error
          retention-days: 30
      - name: Upload simulator evidence process diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: invariants-simulator-process-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/rafter-invariants/telemetry/
            target/rafter-invariants/ci-diagnostics/
            crates/rafter-invariants/target/rafter-invariants/telemetry/
          if-no-files-found: ignore
          retention-days: 30

  invariants-tla:
    name: invariants-tla
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/configure-invariant-cargo
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-invariant-verifier
      # scripts/tla-model-check downloads tla2tools.jar pinned by
      # the immutable asset ID and SHA-256 before every run, so a cache hit is
      # an optimization, never a trust decision.
      - name: Cache tla2tools.jar
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: tools/cache
          key: tla2tools-${{ hashFiles('tools/tla/VERSION', 'tools/tla/ASSET_ID', 'tools/tla/SHA256SUMS') }}
      # These tests invoke java directly, so a cold cache must be populated
      # explicitly rather than relying on the long TLA producer job.
      - name: Fetch and verify pinned tla2tools.jar
        run: scripts/tla-model-check --fetch-tool
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          cache-on-failure: true
          cache-targets: false
          cache-bin: false
      - name: Prefetch locked registry for offline source identity
        run: cargo fetch --locked
      - name: Check TLA host capacity
        shell: bash
        run: |
          available_kib="$(df -Pk . | awk 'NR == 2 { print $4 }')"
          required_kib="$((8 * 1024 * 1024))"
          if (( available_kib < required_kib )); then
            echo "TLA PR evidence requires at least 8 GiB free; found ${available_kib} KiB" >&2
            exit 1
          fi
          memory_kib="$(awk '/^MemTotal:/ { print $2 }' /proc/meminfo)"
          required_memory_kib="$((12 * 1024 * 1024))"
          if (( memory_kib < required_memory_kib )); then
            echo "TLA PR evidence requires at least 12 GiB memory; found ${memory_kib} KiB" >&2
            exit 1
          fi
      - name: Produce TLA+ evidence
        timeout-minutes: 350
        env:
          CI_DIAGNOSTIC_RECEIPT: artifacts/invariants/pr-tla.json
        run: scripts/ci-run-diagnosed tla-producer target/rafter-invariants/ci-diagnostics/tla-producer.log cargo run --locked -p rafter-invariants -- run --profile pr --layer tla
      - name: Upload TLA+ evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: invariants-pr-evidence-tla-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/invariants/pr-tla.json
            artifacts/invariants/pr-tla/
          if-no-files-found: error
          retention-days: 30
      - name: Upload TLA+ evidence process diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: invariants-tla-process-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/rafter-invariants/telemetry/
            target/rafter-invariants/ci-diagnostics/
            crates/rafter-invariants/target/rafter-invariants/telemetry/
          if-no-files-found: ignore
          retention-days: 30

  invariants-tla-validation:
    name: invariants-tla-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/configure-invariant-cargo
      - uses: ./.github/actions/setup-rust
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "21.0.11+10.0.LTS"
          architecture: x64
          check-latest: false
      - name: Cache tla2tools.jar
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: tools/cache
          key: tla2tools-${{ hashFiles('tools/tla/VERSION', 'tools/tla/ASSET_ID', 'tools/tla/SHA256SUMS') }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          cache-on-failure: true
          cache-targets: false
          cache-bin: false
      - name: Prefetch locked registry for offline source identity
        run: cargo fetch --locked
      - name: Validate TLA+ mutation sensitivity and serialized evidence
        timeout-minutes: 20
        run: |
          scripts/cargo-test-exact 34 producer::tla_exec::mutation_tests --locked -p rafter-invariants --lib -- --ignored --test-threads=1
          scripts/cargo-test-exact 4 artifact_verify_tla::full_bundle_tests::serialized_tests --locked -p rafter-invariants --lib -- --ignored --test-threads=1
      - name: Upload TLA+ validation process diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tla-validation-process-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/rafter-invariants/telemetry/
            crates/rafter-invariants/target/rafter-invariants/telemetry/
          if-no-files-found: ignore
          retention-days: 30

  invariants-maelstrom:
    name: invariants-maelstrom
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/configure-invariant-cargo
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-invariant-verifier
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          cache-on-failure: true
          cache-targets: false
          cache-bin: false
      - name: Prefetch locked registry for offline source identity
        run: cargo fetch --locked
      - name: Validate scheduled Maelstrom evidence contract
        run: scripts/cargo-test-exact 61 maelstrom --inventory verification/maelstrom-test-inventory.txt --locked -p rafter-invariants
      - name: Validate Maelstrom runner scripts
        run: |
          for script in \
            scripts/maelstrom-lin-kv \
            scripts/maelstrom-lin-kv-common \
            scripts/maelstrom-lin-kv-membership-change \
            scripts/maelstrom-lin-kv-repeated-restart \
            scripts/maelstrom-lin-kv-leader-restart \
            scripts/maelstrom-lin-kv-app-persist-crash \
            scripts/maelstrom-lin-kv-forced-snapshot \
            scripts/maelstrom-lin-kv-lease-isolation
          do
            bash -n "$script"
          done
      - name: Upload Maelstrom validation process diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: maelstrom-validation-process-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/rafter-invariants/telemetry/
            crates/rafter-invariants/target/rafter-invariants/telemetry/
          if-no-files-found: ignore
          retention-days: 30

  invariants-pr:
    name: invariants-pr
    needs:
      - invariants-tests
      - invariants-launcher-macos
      - invariants-simulator
      - invariants-tla
      - invariants-tla-validation
      - invariants-maelstrom
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      INVARIANT_EVIDENCE_DIR: rafter-invariants-pr-evidence-${{ github.run_id }}-${{ github.run_attempt }}
      INVARIANT_REPORT_DIR: rafter-invariants-pr-${{ github.run_id }}-${{ github.run_attempt }}
      INVARIANT_VERIFIER_DIR: target/rafter-invariants/verifier-evidence/pr-${{ github.run_id }}-${{ github.run_attempt }}
      RAFTER_INVARIANT_VERIFIER_EVIDENCE_DIR: target/rafter-invariants/verifier-evidence/pr-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        timeout-minutes: 3
        with:
          persist-credentials: false
      - uses: ./.github/actions/configure-invariant-cargo
        timeout-minutes: 1
      - uses: ./.github/actions/setup-rust
        timeout-minutes: 8
      - uses: ./.github/actions/setup-invariant-verifier
        timeout-minutes: 8
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        timeout-minutes: 8
        with:
          cache-on-failure: true
          cache-targets: false
          cache-bin: false
      - name: Download available test evidence
        timeout-minutes: 2
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: invariants-pr-evidence-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ env.INVARIANT_EVIDENCE_DIR }}/tests
      - name: Download available simulator evidence
        timeout-minutes: 2
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: invariants-pr-evidence-simulator-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ env.INVARIANT_EVIDENCE_DIR }}/simulator
      - name: Download available TLA+ evidence
        timeout-minutes: 2
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: invariants-pr-evidence-tla-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ env.INVARIANT_EVIDENCE_DIR }}/tla
      - name: Stage current-run PR evidence artifacts
        timeout-minutes: 2
        if: always()
        run: |
          transport_root="$RUNNER_TEMP/$INVARIANT_EVIDENCE_DIR"
          evidence_root="artifacts/invariants"
          mkdir -p "$evidence_root"
          for layer in tests simulator tla; do
            source="$transport_root/$layer/pr-$layer"
            destination="$evidence_root/pr-$layer"
            test -s "$source.json"
            test -d "$source"
            if [[ -e "$destination" || -e "$destination.json" ]]; then
              echo "refusing stale or colliding PR evidence target: $destination" >&2
              exit 1
            fi
          done
          simulator_detector_source="$transport_root/simulator/pr-simulator-detectors-tests"
          simulator_detector_destination="$evidence_root/pr-simulator-detectors-tests"
          test -d "$simulator_detector_source"
          if [[ -e "$simulator_detector_destination" ]]; then
            echo "refusing stale or colliding PR evidence target: $simulator_detector_destination" >&2
            exit 1
          fi
          for layer in tests simulator tla; do
            source="$transport_root/$layer/pr-$layer"
            destination="$evidence_root/pr-$layer"
            cp "$source.json" "$destination.json"
            cp -R "$source" "$destination"
          done
          cp -R "$simulator_detector_source" "$simulator_detector_destination"
      - name: Prime authenticated Cargo archive cache
        if: always()
        timeout-minutes: 3
        run: cargo fetch --locked
      - name: Aggregate exactly 44 invariant verdicts
        if: always()
        id: aggregate
        timeout-minutes: 35
        run: |
          report_dir="$RUNNER_TEMP/$INVARIANT_REPORT_DIR"
          evidence_root="$GITHUB_WORKSPACE/artifacts/invariants"
          mkdir -p "$report_dir"
          set +e
          cargo run --offline --locked -p rafter-invariants -- check --profile pr --source-ref "$GITHUB_SHA" \
            --result "$evidence_root/pr-tests.json" \
            --result "$evidence_root/pr-simulator.json" \
            --result "$evidence_root/pr-tla.json" \
            --output-dir "$report_dir"
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          manifest_count="$(find "$INVARIANT_VERIFIER_DIR" -mindepth 2 -maxdepth 2 \
            -type f -name 'verifier-artifact-manifest-*' 2>/dev/null | wc -l | tr -d ' ')"
          if [[ "$manifest_count" = "1" ]]; then
            manifest_path="$(find "$INVARIANT_VERIFIER_DIR" -mindepth 2 -maxdepth 2 \
              -type f -name 'verifier-artifact-manifest-*')"
            echo "verifier_manifest=$manifest_path" >> "$GITHUB_OUTPUT"
            echo "verifier_manifest_sha256=$(sha256sum "$manifest_path" | awk '{ print $1 }')" \
              >> "$GITHUB_OUTPUT"
          fi
      - name: Validate current-run aggregate reports
        if: always()
        id: report
        timeout-minutes: 2
        run: |
          report_dir="$RUNNER_TEMP/$INVARIANT_REPORT_DIR"
          if cargo run --offline --locked -p rafter-invariants -- verify-report-set \
            --profile pr --report-dir "$report_dir"; then
            complete=true
          else
            complete=false
          fi
          echo "complete=$complete" >> "$GITHUB_OUTPUT"
      - name: Render invariant table in the job summary
        if: always()
        timeout-minutes: 1
        env:
          REPORT_READY: ${{ steps.report.outputs.complete }}
        run: |
          if [[ "$REPORT_READY" = "true" ]]; then
            cat "$RUNNER_TEMP/$INVARIANT_REPORT_DIR/pr.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Raft invariant gate" >> "$GITHUB_STEP_SUMMARY"
            echo "No complete current-run 44-row report was produced; the aggregate is red." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload available aggregate reports
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: invariants-pr-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/${{ env.INVARIANT_REPORT_DIR }}/pr.json
            ${{ runner.temp }}/${{ env.INVARIANT_REPORT_DIR }}/pr.xml
            ${{ runner.temp }}/${{ env.INVARIANT_REPORT_DIR }}/pr.md
          if-no-files-found: error
          retention-days: 30
      - name: Upload available aggregate evidence
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: invariants-pr-aggregate-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ env.INVARIANT_EVIDENCE_DIR }}/
          if-no-files-found: ignore
          retention-days: 30
      - name: Seal aggregate verifier evidence
        if: always()
        id: verifier_archive
        timeout-minutes: 5
        env:
          EXPECTED_MANIFEST: ${{ steps.aggregate.outputs.verifier_manifest }}
          EXPECTED_MANIFEST_SHA256: ${{ steps.aggregate.outputs.verifier_manifest_sha256 }}
        run: |
          test -n "$EXPECTED_MANIFEST"
          test -n "$EXPECTED_MANIFEST_SHA256"
          run_root="$(dirname "$EXPECTED_MANIFEST")"
          archive="$RUNNER_TEMP/invariants-pr-aggregate-verifier-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar"
          output="$(cargo run --offline --locked -p rafter-invariants -- seal-verifier-artifacts \
            --profile pr \
            --root "$run_root" \
            --manifest "$EXPECTED_MANIFEST" \
            --manifest-sha256 "$EXPECTED_MANIFEST_SHA256" \
            --archive "$archive")"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "$output" >> "$GITHUB_OUTPUT"
      - name: Upload aggregate verifier evidence
        if: always()
        id: upload_verifier_archive
        timeout-minutes: 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: invariants-pr-aggregate-verifier-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.verifier_archive.outputs.archive }}
          if-no-files-found: error
          retention-days: 30
      - name: Download aggregate verifier evidence for readback
        if: always() && steps.upload_verifier_archive.outcome == 'success'
        id: download_verifier_archive
        timeout-minutes: 2
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: invariants-pr-aggregate-verifier-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/invariants-pr-aggregate-verifier-download-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify downloaded aggregate verifier evidence
        if: always() && steps.download_verifier_archive.outcome == 'success'
        id: verify_verifier_archive
        timeout-minutes: 5
        env:
          ARCHIVE_SOURCE: ${{ steps.verifier_archive.outputs.archive }}
          ARCHIVE_SHA256: ${{ steps.verifier_archive.outputs.archive_sha256 }}
          MANIFEST_SHA256: ${{ steps.aggregate.outputs.verifier_manifest_sha256 }}
          DOWNLOAD_DIR: ${{ runner.temp }}/invariants-pr-aggregate-verifier-download-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          archive="$DOWNLOAD_DIR/$(basename "$ARCHIVE_SOURCE")"
          cargo run --offline --locked -p rafter-invariants -- verify-verifier-archive \
            --profile pr \
            --archive "$archive" \
            --archive-sha256 "$ARCHIVE_SHA256" \
            --manifest-sha256 "$MANIFEST_SHA256"
      - name: Upload aggregate process diagnostics
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: invariants-pr-aggregate-process-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/rafter-invariants/telemetry/
            crates/rafter-invariants/target/rafter-invariants/telemetry/
          if-no-files-found: ignore
          retention-days: 30
      - name: Require 44 of 44 green
        if: always()
        timeout-minutes: 1
        env:
          AGGREGATE_STATUS: ${{ steps.aggregate.outputs.status }}
          REPORT_READY: ${{ steps.report.outputs.complete }}
          VERIFIER_SEAL_RESULT: ${{ steps.verifier_archive.outcome }}
          VERIFIER_UPLOAD_RESULT: ${{ steps.upload_verifier_archive.outcome }}
          VERIFIER_READBACK_RESULT: ${{ steps.verify_verifier_archive.outcome }}
          TESTS_RESULT: ${{ needs.invariants-tests.result }}
          LAUNCHER_MACOS_RESULT: ${{ needs.invariants-launcher-macos.result }}
          SIMULATOR_RESULT: ${{ needs.invariants-simulator.result }}
          TLA_RESULT: ${{ needs.invariants-tla.result }}
          TLA_VALIDATION_RESULT: ${{ needs.invariants-tla-validation.result }}
          MAELSTROM_RESULT: ${{ needs.invariants-maelstrom.result }}
        run: |
          test "$TESTS_RESULT" = "success"
          test "$LAUNCHER_MACOS_RESULT" = "success"
          test "$SIMULATOR_RESULT" = "success"
          test "$TLA_RESULT" = "success"
          test "$TLA_VALIDATION_RESULT" = "success"
          test "$MAELSTROM_RESULT" = "success"
          test "$AGGREGATE_STATUS" = "0"
          test "$REPORT_READY" = "true"
          test "$VERIFIER_SEAL_RESULT" = "success"
          test "$VERIFIER_UPLOAD_RESULT" = "success"
          test "$VERIFIER_READBACK_RESULT" = "success"
          jq -e '.summary.total == 44 and .summary.green == 44 and .summary.red == 0 and (.invariants | length) == 44' \
            "$RUNNER_TEMP/$INVARIANT_REPORT_DIR/pr.json" >/dev/null

  fuzz-smoke:
    name: fuzz-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # Keep this directory guard so the workflow remains usable on older
      # release branches that predate the fuzz workspace.
      - name: Check for fuzz targets
        id: fuzz-dir
        run: |
          if [ -d fuzz ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "fuzz/ not present on this ref; skipping fuzz smoke"
          fi
      - uses: ./.github/actions/setup-rust
        if: steps.fuzz-dir.outputs.exists == 'true'
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        if: steps.fuzz-dir.outputs.exists == 'true'
        with:
          cache-on-failure: true
      - name: Install cargo-fuzz
        if: steps.fuzz-dir.outputs.exists == 'true'
        run: command -v cargo-fuzz >/dev/null || cargo install cargo-fuzz --locked
      - name: Fuzz smoke (10k runs or 60 s per target)
        if: steps.fuzz-dir.outputs.exists == 'true'
        run: |
          for target in codec_decode storage_snapshot_decode node_message_sequences cluster_schedules; do
            cargo +nightly fuzz run "$target" -- -runs=10000 -max_total_time=60
          done
      - name: Upload crash artifacts
        if: failure() && steps.fuzz-dir.outputs.exists == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fuzz-smoke-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore

  # The reference-consumer acceptance lanes. docs/reference-consumers.md gives
  # the every-PR tier "package build, pure implementation and reference-model
  # tests, codec vectors, short deterministic simulations, and small history
  # checks"; those are the deterministic suites reference-source-check runs and
  # the package build reference-package-check performs. Root Cargo.toml
  # excludes reference/, so no cargo invocation in the lint or test jobs above
  # reaches these consumers: without these two jobs nothing compiles them.
  reference-source:
    name: reference-source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          cache-on-failure: true
      - name: Reference consumers in fast source mode
        # The file-size gate, then format, clippy -D warnings, the
        # deterministic suites, and rustdoc, all against the checkout through
        # the patched publishable set. The gate runs first because it needs no
        # build; it is where this workspace gets the readability limits the
        # root workspace's file_size_guard cannot reach across the exclusion.
        run: scripts/reference-source-check

      - name: Durable process suite membership
        # The suite itself runs on the main/nightly tier, but its *selection*
        # is checked here, on every pull request. Splitting the gate this way
        # is the whole point: the failure mode is a test being added to or
        # removed from an `#[ignore]`d selection, and that is visible in the
        # listing. Leaving the check on the push tier meant the pull request
        # that changed the membership could never see it -- the count went
        # stale for exactly that reason, and the lane was red at HEAD.
        # The step is close to free: the job above already compiled
        # tests/process_cluster.rs, so this is a cached `--list`.
        run: scripts/reference-process-check --list-only

  reference-package:
    name: reference-package
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # Deliberately not the workspace 1.88 pin. This lane validates packaging
      # mechanics as well as the exact unpacked archive graph. The adjacent
      # reference-package-msrv job proves those archives on 1.88. 1.96.1 is
      # the packaging toolchain benchmarks.yml already pins.
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          cache-on-failure: true
      - name: Exact-package boundary adversarial checks
        run: scripts/tests/reference_package_boundary_test.sh
      - name: Reference consumers against exact package archives
        # This is also the only lane that builds `rafter` in its published
        # shape. Every cargo invocation over the root workspace resolves
        # rafter-sim, which depends on rafter with `internal-test-hooks`, and
        # resolver 2 unifies that feature into rafter for the whole invocation.
        # Phase 6 rejects the hook in the consumer graph, so the archives are
        # exercised with it off.
        env:
          # Phase 6 proves that no consumer dependency resolves back inside the
          # checkout, so the workdir must live outside it. runner.temp is a
          # sibling of the workspace, never a child.
          TMPDIR: ${{ runner.temp }}
        run: scripts/reference-package-check

  reference-package-msrv:
    name: reference-package-msrv
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # Archive creation uses the current packaging Cargo. The runner then
      # switches the copied, archive-patched workspace to the declared MSRV.
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: 1.88
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          cache-on-failure: true
      - name: Exact package set in the Rust 1.88 published shape
        env:
          TMPDIR: ${{ runner.temp }}
          RUSTUP_TOOLCHAIN: 1.96.1
        run: |
          mkdir -p artifacts
          scripts/reference-package-process-check --msrv-only \
            --artifacts artifacts/reference-package-msrv \
            2>&1 | tee artifacts/reference-package-msrv.log
      - name: Upload exact-package MSRV evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reference-package-msrv-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/reference-package-msrv/
            artifacts/reference-package-msrv.log
          if-no-files-found: error

  reference-package-process:
    name: reference-package-process
    # The reviewed inventory is checked on every PR. Full process execution
    # against exact archives runs after merge, alongside source process mode.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          cache-on-failure: true
      - name: Reviewed process suites against exact package archives
        env:
          TMPDIR: ${{ runner.temp }}
          RUSTUP_TOOLCHAIN: 1.96.1
        run: |
          mkdir -p artifacts
          scripts/reference-package-process-check --process-only \
            --artifacts artifacts/reference-package-process \
            2>&1 | tee artifacts/reference-package-process.log
      - name: Upload exact-package process evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reference-package-process-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/reference-package-process/
            artifacts/reference-package-process.log
          if-no-files-found: error

  reference-process:
    name: reference-process
    # docs/reference-consumers.md puts durable process *execution* on the
    # main/nightly tier rather than on every PR. This is the "main" half,
    # reached through this workflow's push trigger; nightly.yml carries the
    # other. A pull request skips this job, which is why it must not be a
    # required status check.
    #
    # Only execution is deferred. The selection check that guards this suite
    # runs on every pull request, in the reference-source job above. That split
    # is deliberate: a gate whose failures are invisible on the pull request
    # that causes them reports too late to be a gate, and this one proved it --
    # the reviewed count was left at seven when an eighth test landed, and the
    # lane sat red on main because no pull request could ever reach it.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          cache-on-failure: true
      - name: Ledger durable process suite
        # The suite is #[ignore]d, so `--ignored` on its own would report
        # success over zero tests the moment those attributes changed. The
        # reviewed inventory in verification/ pins which tests run, not just
        # how many: a right count over a different set is rejected.
        run: |
          mkdir -p artifacts/reference-counter
          scripts/reference-process-check 2>&1 | tee artifacts/reference-counter/process-suite.log
      - name: Upload durable reference process diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reference-process-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/reference-counter/process-suite.log
          if-no-files-found: error

  counter-reference-fast:
    name: counter-reference-fast
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          cache-on-failure: true
      - name: Counter reference fast profile
        run: scripts/counter-profile counter-fast
      - name: Upload counter fast evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: counter-reference-fast-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/reference-counter/counter-fast/
          if-no-files-found: error
