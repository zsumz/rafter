# Per-PR lane: fmt, clippy -D warnings, workspace tests, deterministic
# invariant evidence aggregation, and fuzz smoke.
#
# "A PR cannot merge red" is enforced by branch protection, which lives in
# repository settings, not in this file. Branch protection on `main` must
# list these required status checks:
#
#   lint, test, fuzz-smoke, invariants-pr
#
# The Rust toolchain is pinned to the workspace rust-version in Cargo.toml
# (currently 1.88). Keep the dtolnay/rust-toolchain@<version> refs below in
# sync with Cargo.toml when bumping rust-version.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs of the same PR; never cancel runs on main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

defaults:
  run:
    # bash -eo pipefail, so piped commands cannot hide failures.
    shell: bash

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        # Workspace lints set clippy::{all,pedantic} = warn; -D warnings
        # escalates them (and rustc warnings) to errors.
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: dependency boundary tests
        run: cargo test --workspace dependency_boundary
      - name: source boundary tests
        run: cargo test -p rafter source_boundary
      - name: file-size guard
        run: cargo test -p rafter file_size_guard -- --nocapture
      - name: test-location guard
        run: cargo test -p rafter --test test_location_guard -- --nocapture
      - name: public API/docs guard
        run: cargo test -p rafter --test public_api_docs_guard -- --nocapture
      - name: invariant docs guard
        run: python3 scripts/render-raft-invariants-doc --check
      - name: workspace tests
        run: cargo test --workspace
      - name: replicated KV process lifecycle
        run: cargo test -p rafter-runtime --test replicated_kv_example -- --ignored --exact replicated_kv_process_per_node_tcp_survives_kill_restart --nocapture

  invariants-tests:
    name: invariants-tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Produce test evidence
        run: cargo run --locked -p rafter-invariants -- run --profile pr --layer tests
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invariants-pr-evidence-tests-${{ github.run_id }}-${{ github.run_attempt }}
          overwrite: true
          path: |
            artifacts/invariants/
            target/rafter-invariants/telemetry/
          if-no-files-found: error
          retention-days: 30

  invariants-launcher-macos:
    name: invariants-launcher-macos
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Validate managed process launcher on macOS
        run: |
          cargo test --locked -p rafter-invariants producer::process::tests -- --test-threads=1
          cargo test --locked -p rafter-invariants producer::test_exec::detector_proof::tests -- --test-threads=1
          cargo test --locked -p rafter-invariants producer::test_exec::process_tests -- --test-threads=1
          cargo test --locked -p rafter-invariants detector_proof::tests -- --test-threads=1
          cargo test --locked -p rafter-invariants artifact_verify::detector_source::tests -- --test-threads=1
          cargo test --locked -p rafter-invariants artifact_verify::detector_source::adversarial_tests -- --test-threads=1
          cargo test --locked -p rafter-invariants artifact_verify::simulator::event_semantics_tests -- --test-threads=1
          cargo test --locked -p rafter-invariants artifact_verify::test_logs::detector_witness_tests -- --test-threads=1
          cargo test --locked -p rafter-invariants producer_image::tests -- --test-threads=1
          cargo test --locked -p rafter-invariants --test producer_reexec -- --test-threads=1
      - name: Upload macOS launcher diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invariants-launcher-macos-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/rafter-invariants/telemetry/
            crates/rafter-invariants/target/rafter-invariants/telemetry/
          if-no-files-found: ignore
          retention-days: 30

  invariants-simulator:
    name: invariants-simulator
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Produce simulator evidence
        run: cargo run --locked -p rafter-invariants -- run --profile pr --layer simulator
      - name: Upload simulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invariants-pr-evidence-simulator-${{ github.run_id }}-${{ github.run_attempt }}
          overwrite: true
          path: |
            artifacts/invariants/
            target/rafter-invariants/telemetry/
          if-no-files-found: error
          retention-days: 30

  invariants-tla:
    name: invariants-tla
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # scripts/tla-model-check downloads tla2tools.jar pinned by
      # the immutable asset ID and SHA-256 before every run, so a cache hit is
      # an optimization, never a trust decision.
      - name: Cache tla2tools.jar
        uses: actions/cache@v4
        with:
          path: tools/cache
          key: tla2tools-${{ hashFiles('tools/tla/VERSION', 'tools/tla/ASSET_ID', 'tools/tla/SHA256SUMS') }}
      # These tests invoke java directly, so a cold cache must be populated
      # explicitly rather than relying on the long TLA producer job.
      - name: Fetch and verify pinned tla2tools.jar
        run: scripts/tla-model-check --fetch-tool
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Check TLA host capacity
        shell: bash
        run: |
          available_kib="$(df -Pk . | awk 'NR == 2 { print $4 }')"
          required_kib="$((8 * 1024 * 1024))"
          if (( available_kib < required_kib )); then
            echo "TLA PR evidence requires at least 8 GiB free; found ${available_kib} KiB" >&2
            exit 1
          fi
          memory_kib="$(awk '/^MemTotal:/ { print $2 }' /proc/meminfo)"
          required_memory_kib="$((12 * 1024 * 1024))"
          if (( memory_kib < required_memory_kib )); then
            echo "TLA PR evidence requires at least 12 GiB memory; found ${memory_kib} KiB" >&2
            exit 1
          fi
      - name: Produce TLA+ evidence
        timeout-minutes: 350
        run: cargo run --locked -p rafter-invariants -- run --profile pr --layer tla
      - name: Upload TLA+ evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invariants-pr-evidence-tla-${{ github.run_id }}-${{ github.run_attempt }}
          overwrite: true
          path: |
            artifacts/invariants/
            target/rafter-invariants/telemetry/
          if-no-files-found: error
          retention-days: 30

  invariants-tla-validation:
    name: invariants-tla-validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache tla2tools.jar
        uses: actions/cache@v4
        with:
          path: tools/cache
          key: tla2tools-${{ hashFiles('tools/tla/VERSION', 'tools/tla/ASSET_ID', 'tools/tla/SHA256SUMS') }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Validate TLA+ mutation sensitivity and serialized evidence
        timeout-minutes: 20
        run: cargo test --locked -p rafter-invariants --lib -- --ignored --test-threads=1

  invariants-maelstrom:
    name: invariants-maelstrom
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Prefetch locked registry for offline source identity
        run: cargo fetch --locked
      - name: Validate scheduled Maelstrom evidence contract
        run: cargo test --locked -p rafter-invariants maelstrom
      - name: Validate Maelstrom runner scripts
        run: |
          for script in \
            scripts/maelstrom-lin-kv \
            scripts/maelstrom-lin-kv-common \
            scripts/maelstrom-lin-kv-membership-change \
            scripts/maelstrom-lin-kv-repeated-restart \
            scripts/maelstrom-lin-kv-leader-restart \
            scripts/maelstrom-lin-kv-app-persist-crash \
            scripts/maelstrom-lin-kv-forced-snapshot \
            scripts/maelstrom-lin-kv-lease-isolation
          do
            bash -n "$script"
          done

  invariants-pr:
    name: invariants-pr
    needs:
      - invariants-tests
      - invariants-launcher-macos
      - invariants-simulator
      - invariants-tla
      - invariants-tla-validation
      - invariants-maelstrom
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      INVARIANT_REPORT_DIR: rafter-invariants-pr-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Download available evidence
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: invariants-pr-evidence-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: .
          merge-multiple: true
      - name: Aggregate exactly 44 invariant verdicts
        if: always()
        id: aggregate
        timeout-minutes: 8
        run: |
          report_dir="$RUNNER_TEMP/$INVARIANT_REPORT_DIR"
          mkdir -p "$report_dir"
          set +e
          cargo run --locked -p rafter-invariants -- check --profile pr --source-ref "$GITHUB_SHA" \
            --output-dir "$report_dir"
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Validate current-run aggregate reports
        if: always()
        id: report
        timeout-minutes: 1
        run: |
          report_dir="$RUNNER_TEMP/$INVARIANT_REPORT_DIR"
          complete=true
          for extension in json xml md; do
            if [[ ! -s "$report_dir/pr.$extension" ]]; then
              complete=false
            fi
          done
          if [[ "$complete" = "true" ]] && ! jq -e \
            '.profile == "pr" and .summary.total == 44 and (.invariants | length) == 44' \
            "$report_dir/pr.json" >/dev/null; then
            complete=false
          fi
          if [[ "$complete" = "true" ]]; then
            expected_ids="$report_dir/expected.ids"
            json_ids="$report_dir/json.ids"
            markdown_ids="$report_dir/markdown.ids"
            junit_ids="$report_dir/junit.ids"
            jq -r ".[\"\$defs\"].invariant.properties.invariant_id.enum[]" \
              verification/invariant-verdict-schema.json | LC_ALL=C sort > "$expected_ids"
            jq -r '.invariants[].invariant_id' "$report_dir/pr.json" | \
              LC_ALL=C sort > "$json_ids"
            # Dollar signs below are regex anchors.
            # shellcheck disable=SC2016
            sed -nE 's/^\| `([^`]+)` \| (GREEN|RED) \|.*$/\1/p' \
              "$report_dir/pr.md" | LC_ALL=C sort > "$markdown_ids"
            # Dollar signs below are regex anchors.
            # shellcheck disable=SC2016
            sed -nE 's/^[[:space:]]*<testcase classname="rafter\.invariants" name="([^"]+)">$/\1/p' \
              "$report_dir/pr.xml" | LC_ALL=C sort > "$junit_ids"
            if [[ "$(wc -l < "$expected_ids")" -ne 44 || \
                  "$(LC_ALL=C uniq "$expected_ids" | wc -l)" -ne 44 ]] || \
               ! cmp -s "$expected_ids" "$json_ids" || \
               ! cmp -s "$expected_ids" "$markdown_ids" || \
               ! cmp -s "$expected_ids" "$junit_ids"; then
              complete=false
            fi
          fi
          echo "complete=$complete" >> "$GITHUB_OUTPUT"
      - name: Render invariant table in the job summary
        if: always()
        timeout-minutes: 1
        env:
          REPORT_READY: ${{ steps.report.outputs.complete }}
        run: |
          if [[ "$REPORT_READY" = "true" ]]; then
            cat "$RUNNER_TEMP/$INVARIANT_REPORT_DIR/pr.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Raft invariant gate" >> "$GITHUB_STEP_SUMMARY"
            echo "No complete current-run 44-row report was produced; the aggregate is red." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload available aggregate reports and evidence
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: invariants-pr-report-${{ github.run_id }}-${{ github.run_attempt }}
          overwrite: true
          path: |
            ${{ runner.temp }}/${{ env.INVARIANT_REPORT_DIR }}/pr.json
            ${{ runner.temp }}/${{ env.INVARIANT_REPORT_DIR }}/pr.xml
            ${{ runner.temp }}/${{ env.INVARIANT_REPORT_DIR }}/pr.md
            artifacts/invariants/
            target/rafter-invariants/telemetry/
          if-no-files-found: ignore
          retention-days: 30
      - name: Require 44 of 44 green
        if: always()
        timeout-minutes: 1
        env:
          AGGREGATE_STATUS: ${{ steps.aggregate.outputs.status }}
          REPORT_READY: ${{ steps.report.outputs.complete }}
          TESTS_RESULT: ${{ needs.invariants-tests.result }}
          LAUNCHER_MACOS_RESULT: ${{ needs.invariants-launcher-macos.result }}
          SIMULATOR_RESULT: ${{ needs.invariants-simulator.result }}
          TLA_RESULT: ${{ needs.invariants-tla.result }}
          TLA_VALIDATION_RESULT: ${{ needs.invariants-tla-validation.result }}
          MAELSTROM_RESULT: ${{ needs.invariants-maelstrom.result }}
        run: |
          test "$TESTS_RESULT" = "success"
          test "$LAUNCHER_MACOS_RESULT" = "success"
          test "$SIMULATOR_RESULT" = "success"
          test "$TLA_RESULT" = "success"
          test "$TLA_VALIDATION_RESULT" = "success"
          test "$MAELSTROM_RESULT" = "success"
          test "$AGGREGATE_STATUS" = "0"
          test "$REPORT_READY" = "true"
          jq -e '.summary.total == 44 and .summary.green == 44 and .summary.red == 0 and (.invariants | length) == 44' \
            "$RUNNER_TEMP/$INVARIANT_REPORT_DIR/pr.json" >/dev/null

  fuzz-smoke:
    name: fuzz-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # Keep this directory guard so the workflow remains usable on older
      # release branches that predate the fuzz workspace.
      - name: Check for fuzz targets
        id: fuzz-dir
        run: |
          if [ -d fuzz ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "fuzz/ not present on this ref; skipping fuzz smoke"
          fi
      - uses: dtolnay/rust-toolchain@nightly
        if: steps.fuzz-dir.outputs.exists == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.fuzz-dir.outputs.exists == 'true'
        with:
          cache-on-failure: true
      - name: Install cargo-fuzz
        if: steps.fuzz-dir.outputs.exists == 'true'
        run: command -v cargo-fuzz >/dev/null || cargo install cargo-fuzz --locked
      - name: Fuzz smoke (10k runs or 60 s per target)
        if: steps.fuzz-dir.outputs.exists == 'true'
        run: |
          for target in codec_decode storage_snapshot_decode node_message_sequences cluster_schedules; do
            cargo +nightly fuzz run "$target" -- -runs=10000 -max_total_time=60
          done
      - name: Upload crash artifacts
        if: failure() && steps.fuzz-dir.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-smoke-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
