name: Set up the reviewed Rust toolchain
description: Install one explicitly requested Rust toolchain through immutable action code.

inputs:
  toolchain:
    description: Rustup toolchain name.
    required: false
    default: "1.88"
  components:
    description: Comma-separated rustup components.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master, reviewed 2026-07-20
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}
    # rustup's directory toolchain file takes precedence over a global default.
    # Explicitly select the job's requested toolchain so packaging, fuzzing,
    # and developer-tool jobs can override the checkout's Rust 1.88 pin.
    - name: Select the requested toolchain for subsequent steps
      shell: bash
      env:
        RAFTER_RUST_TOOLCHAIN: ${{ inputs.toolchain }}
      run: printf 'RUSTUP_TOOLCHAIN=%s\n' "$RAFTER_RUST_TOOLCHAIN" >> "$GITHUB_ENV"
