[package]
name = "bench-compare"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone package: deliberately NOT a member of the frozen root workspace.
# The empty [workspace] table stops cargo from attaching this package to the
# parent workspace, so the root Cargo.toml/Cargo.lock stay untouched.
[workspace]

[dependencies]
rafter = { path = "../crates/rafter" }
rafter-runtime = { path = "../crates/rafter-runtime" }
rafter-storage = { path = "../crates/rafter-storage" }

# tikv/raft-rs. prost-codec instead of the default protobuf-codec: the
# protobuf codec's build script rejects modern protoc (>= 21.x) and its
# bundled fallback has no macOS/aarch64 binary, while prost-build 0.11
# invokes the system protoc without a version ceiling and builds cleanly.
raft = { version = "=0.7.0", default-features = false, features = [
    "prost-codec",
] }
slog = "2.7"

# storage-v2 unseals RaftLogStorage/RaftStateMachine so the in-memory
# stores can be implemented directly (the v2 storage API).
openraft = { version = "=0.9.24", default-features = false, features = [
    "storage-v2",
] }
tokio = { version = "1", default-features = false, features = [
    "rt",
    "macros",
    "sync",
    "time",
] }

[profile.release]
debug = false
