# Rafter's local qualification graph, run by zcheck (https://github.com/zsumz/zcheck).
#
# `zcheck` answers "is this checkout good?" with the same gates CI requires on
# every pull request: the lint surface, the architecture contract, and the
# workspace test suite. Deeper evidence lanes (invariants, model checking, the
# reference consumers) are separate tasks under `zcheck run full` because they
# are slow and, for the invariant evidence, Linux-authoritative — scheduled CI
# remains the authority for those, per docs/work-completion.md.
#
# Both supported hosts lint the complete workspace. The invariant executor's
# descriptor-bound replay still admits execution only on Linux; macOS lint and
# launcher tests do not qualify the Linux-authoritative evidence lanes.

schema = 1
default = "check"

[execution]
jobs = 4
default_timeout = "30m"
repository_state = "preserve"

# --- lint surface (mirrors the CI lint job) --------------------------------

[tasks.format]
description = "Validate workspace Rust formatting."
run = ["cargo", "fmt", "--all", "--", "--check"]
tools = ["cargo"]
resources = ["cargo-target"]

[tasks.format-fuzz]
description = "Validate fuzz-workspace formatting; fuzz/ keeps its own manifest outside the workspace."
run = ["cargo", "fmt", "--manifest-path", "fuzz/Cargo.toml", "--all", "--", "--check"]
tools = ["cargo"]
resources = ["fuzz-target"]

[tasks.clippy]
description = "Run workspace Clippy with warnings denied on Linux."
platforms = ["linux"]
run = ["cargo", "clippy", "--workspace", "--all-targets", "--", "-D", "warnings"]
tools = ["cargo"]
resources = ["cargo-target"]

[tasks.clippy-macos]
description = "Run workspace Clippy with warnings denied on macOS."
platforms = ["macos"]
run = ["cargo", "clippy", "--locked", "--workspace", "--all-targets", "--", "-D", "warnings"]
tools = ["cargo"]
resources = ["cargo-target"]

[tasks.clippy-durable]
description = "Lint the opt-in durable client owner and its tests."
run = ["cargo", "clippy", "--locked", "-p", "rafter-service", "--features", "durable", "--all-targets", "--", "-D", "warnings"]
tools = ["cargo"]
resources = ["cargo-target"]

[tasks.clippy-fuzz]
description = "Run fuzz-workspace Clippy with warnings denied."
run = ["cargo", "clippy", "--manifest-path", "fuzz/Cargo.toml", "--all-targets", "--", "-D", "warnings"]
tools = ["cargo"]
resources = ["fuzz-target"]

[tasks.clippy-bench]
description = "Run bench-compare Clippy without default features; the third-party comparison binaries need protoc."
run = ["cargo", "clippy", "--manifest-path", "bench-compare/Cargo.toml", "--locked", "--no-default-features", "--all-targets", "--", "-D", "warnings"]
tools = ["cargo"]
resources = ["bench-target"]

[tasks.transport-memory]
description = "Run the transport receive-memory allocation gate."
run = ["cargo", "run", "--manifest-path", "bench-compare/Cargo.toml", "--locked", "--no-default-features", "--bin", "check-transport-receive-memory"]
tools = ["cargo"]
resources = ["bench-target"]

[tasks.rustdoc]
description = "Build the publishable crates under -D warnings -D missing-docs, then the workspace under -D warnings."
run = ["scripts/rustdoc-check"]
tools = ["cargo"]
resources = ["cargo-target"]
inputs = ["RELEASE.md"]

[tasks.work-completion]
description = "Verify the stable proof references in the work-completion manifest."
run = ["scripts/work-completion-check"]
tools = ["awk"]
inputs = [
  "docs/work-completion.md",
  ".github/workflows/ci.yml",
  ".github/workflows/nightly.yml",
  ".github/workflows/weekly.yml",
]

[tasks.tla-telemetry]
description = "Run the TLA+ continuation sampler's adversarial checks against stubbed tools."
run = ["scripts/tests/tla_continuation_telemetry_test.sh"]
tools = ["awk", "perl"]

[tasks.policy-tools]
description = "Exercise fail-closed macro reconciliation and complete-profile budget/tool checks."
run = ["python3", "scripts/tests/review_policy_test.py"]
tools = ["python3"]

[tasks.runtime-setup-tests]
description = "Exercise bounded runtime retrieval, cached installation, and fail-closed setup."
run = ["python3", "-m", "unittest", "scripts/tests/test_invariant_runtime_setup.py"]
tools = ["python3"]

[tasks.counter-guide-tests]
description = "Refuse stale/mixed counter dependency graphs and leaked smoke-test children. Requires Python 3.11+."
run = ["python3", "-m", "unittest", "scripts/tests/test_counter_guide.py"]
tools = ["python3"]

[tasks.counter-guide]
description = "Build the extracted counter guide against this checkout and exercise real TLS processes. Requires Python 3.11+."
needs = ["counter-guide-tests"]
run = ["python3", "scripts/check-counter-guide", "--mode", "checkout"]
tools = ["python3", "cargo", "openssl"]
resources = ["counter-guide-target"]

[tasks.counter-guide-pinned]
description = "Qualify the copied standalone counter using only its exact Git revision and canonical lock. Requires Python 3.11+."
needs = ["counter-guide-tests"]
run = ["python3", "scripts/check-counter-guide", "--mode", "pinned"]
tools = ["python3", "cargo", "openssl"]
resources = ["counter-guide-target"]

[tasks.counter-pressure]
description = "Qualify bounded client admission and shutdown during blocked application publication. Requires Python 3.11+ and POSIX FIFOs."
needs = ["counter-guide-tests"]
run = ["python3", "scripts/check-counter-guide", "--mode", "checkout", "--pressure"]
tools = ["python3", "cargo", "openssl"]
resources = ["counter-guide-target"]

[tasks.lint]
description = "Validate formatting, lints, documentation, and proof references."
needs = [
  "format",
  "format-fuzz",
  "clippy",
  "clippy-macos",
  "clippy-durable",
  "clippy-fuzz",
  "clippy-bench",
  "transport-memory",
  "rustdoc",
  "work-completion",
  "tla-telemetry",
  "durable-bench-tests",
  "policy-tools",
  "runtime-setup-tests",
  "counter-guide",
  "counter-guide-pinned",
  "counter-pressure",
]

[tasks.durable-bench-tests]
description = "Verify durable benchmark configuration and evidence validation."
needs = ["durable-bench-config"]
run = ["python3", "-m", "unittest", "scripts/tests/test_bench_durable.py", "scripts/tests/test_hard_state_syscalls.py"]
tools = ["python3"]

[tasks.durable-bench-config]
description = "Test the standalone durable benchmark's bounded workload configuration."
run = ["cargo", "test", "--manifest-path", "bench-compare/Cargo.toml", "--locked", "--no-default-features", "--bin", "bench-rafter-durable"]
tools = ["cargo"]
resources = ["bench-target"]

# --- architecture ----------------------------------------------------------

[tasks.fetch]
description = "Fetch locked dependency archives so offline macro export analysis works on a fresh checkout."
run = ["cargo", "fetch", "--locked"]
tools = ["cargo"]

[tasks.zrail]
needs = ["fetch"]
description = "Check the declarative architecture contract against the locked repository state."
run = ["zrail", "check"]
tools = ["zrail"]
inputs = ["zrail.toml", "zrail-baseline.toml", "zrail.lock"]

[tasks.architecture]
description = "Validate the reviewed architecture without executing repository code."
needs = ["zrail"]

# --- tests -----------------------------------------------------------------

[tasks.test]
description = "Run the complete workspace test suite; the reference consumers keep their own workspace and lanes."
run = ["cargo", "test", "--workspace"]
timeout = "45m"
tools = ["cargo"]
resources = ["cargo-target"]

[tasks.durable-client]
description = "Exercise managed writes, reads, maintenance, and lifecycle fences through the opt-in durable owner."
run = ["scripts/cargo-test-exact", "397", "-", "--locked", "-p", "rafter-service", "--features", "durable"]
tools = ["cargo"]
resources = ["cargo-target"]

[tasks.check]
description = "Qualify the checkout with the pull-request-tier local gates."
needs = ["lint", "architecture", "test", "durable-client"]

[tasks.current-stable-identity]
description = "Record the resolved compiler for the separately installed stable toolchain."
run = ["rustc", "+stable", "--version", "--verbose"]
tools = ["rustc"]

[tasks.dependency-audit-tests]
description = "Reject incomplete public dependency graphs and narrowed advisory reports. Requires Python 3.11+."
run = ["python3", "-m", "unittest", "scripts/tests/test_published_dependency_audit.py"]
tools = ["python3"]

[tasks.dependency-audit]
description = "Audit all public features and separately the complete workspace lock against fresh RustSec data. Requires cargo-audit 0.22.2, Python 3.11+, and network access."
needs = ["dependency-audit-tests"]
run = ["python3", "scripts/audit-published-dependencies", "--include-workspace"]
tools = ["cargo", "cargo-audit", "python3"]
resources = ["advisory-db"]

[tasks.current-stable-workspace]
description = "Build every workspace target with current stable Rust and the locked dependencies."
needs = ["current-stable-identity"]
run = ["cargo", "+stable", "build", "--locked", "--workspace", "--all-targets"]
tools = ["cargo"]
resources = ["cargo-target"]

[tasks.current-stable-durable]
description = "Build the opt-in durable service and its targets with current stable Rust."
needs = ["current-stable-identity"]
run = ["cargo", "+stable", "build", "--locked", "-p", "rafter-service", "--features", "durable", "--all-targets"]
tools = ["cargo"]
resources = ["cargo-target"]

[tasks.current-stable]
description = "Check forward compiler compatibility without changing the pinned MSRV."
needs = ["current-stable-workspace", "current-stable-durable"]

# --- deeper evidence lanes (not in the default graph) ----------------------

[tasks.invariants-pr-preflight]
description = "Check the complete PR budget, Java 21, and pinned TLC before running evidence layers."
platforms = ["linux"]
run = ["scripts/invariants-pr-preflight"]
timeout = "1m"
tools = ["python3", "java"]

[tasks.invariants-pr]
description = "Run the deterministic 44-invariant PR aggregate; Linux descriptor-bound launch, fail-closed elsewhere."
platforms = ["linux"]
run = ["cargo", "run", "--locked", "-p", "rafter-invariants", "--", "run-all", "--profile", "pr"]
timeout = "8h"
tools = ["cargo", "java", "python3"]
needs = ["invariants-pr-preflight"]
resources = ["cargo-target"]
inputs = [
  "verification/raft-invariants.yaml",
  "verification/raft-invariant-profiles.json",
]

[tasks.model-check]
description = "Run the fast bounded model-check profile."
run = ["cargo", "run", "--release", "-p", "rafter-sim", "--bin", "rafter-model-check-fast"]
timeout = "45m"
tools = ["cargo"]
resources = ["cargo-target"]

[tasks.reference-source]
description = "Run the checkout-patched reference-consumer acceptance systems."
run = ["scripts/reference-source-check"]
timeout = "60m"
tools = ["cargo"]
resources = ["reference-target"]

[tasks.reference-package]
description = "Run exact-package consumers, storage/wire compatibility, and mixed-version TLS rolling upgrades."
needs = ["archive-compatibility-runner-tests"]
run = ["scripts/reference-package-check"]
timeout = "60m"
tools = ["cargo", "tar", "python3", "rustup"]
resources = ["reference-target"]

[tasks.archive-compatibility-runner-tests]
description = "Verify archive compatibility and retained public dependency boundaries."
run = ["python3", "-m", "unittest", "scripts/tests/test_archive_compatibility.py", "scripts/tests/test_archive_dependencies.py"]
tools = ["python3"]

[tasks.full]
description = "Qualify the checkout and every locally runnable deeper evidence lane."
needs = ["check", "current-stable", "dependency-audit", "invariants-pr", "model-check", "reference-source", "reference-package"]

# Performance evidence stays opt-in, separate from concurrent correctness work.
[tasks.build-durable-bench]
description = "Build the sustained durable benchmark with locked standalone dependencies."
run = ["cargo", "build", "--manifest-path", "bench-compare/Cargo.toml", "--release", "--locked", "--no-default-features", "--bin", "bench-rafter-durable"]
tools = ["cargo"]
resources = ["bench-target"]

[tasks.bench-durable]
description = "Record repeated fixed durable workloads with process CPU and batch latency."
needs = ["build-durable-bench"]
run = ["scripts/bench-durable"]
tools = ["python3"]
resources = ["benchmark-host"]
timeout = "60m"
