# <<< generated: observed spellings

[source.rust.hygiene]
# Production reach only; sibling tests and #[cfg(test)] modules are exempt.
# `expect` with a message is the house style for impossible states, so it is
# deliberately absent from deny_methods; `panic!`/`unreachable!` likewise
# remain reviewed per use rather than denied.
unsafe = "deny"
lint_suppressions = "reasoned"
deny_methods = ["unwrap"]
deny_macros = ["todo", "unimplemented", "dbg"]

# File-size budgets transcribe file_size_guard.rs: 300-line implementation
# target with a 1,000-line hard stop, facade target 100, scenario-suite target
# 400, harness target 600. The hard values are class backstops; the per-file
# teeth are the shrink-only ratchets in zrail-baseline.toml, which pin every
# over-target file at its adoption size.
#
# The facade backstop is 225 rather than 1,000. It was raised to the shared
# 1,000 at adoption only because a class hard stop then applied to ratcheted
# files too; the rc series exempts them, so every facade still over 100 lines
# is held by its own ratchet and the class limit can return to the reviewed
# number. A new facade may be born up to 225 lines; past that it is a module.

[source.rust.size.facade]
target = 100
hard = 225

[source.rust.size.implementation]
target = 300
hard = 1000

[source.rust.size.test]
target = 400
hard = 1500

[source.rust.size.auxiliary]
target = 600
hard = 1500

# ---------------------------------------------------------------------------
# Effects. Layers marked no-ambient-services may not reach the network, an
# async runtime, a database, a container runtime, or ambient entropy from any
# file, tests included. Filesystem, process, clock, and thread effects are not
# denied there because guard tests legitimately spawn cargo and git.
#
# sealed-production adds the stricter rule for the layers whose shipped code
# reaches nothing at all. Six carry it: checksum, kernel, runtime-boundary,
# wire, application, and embedding — the sans-IO half of the stack plus the two
# embeddings, whose async surface is the caller's runtime rather than one they
# bind. Seven refuse, each for a reason that is the layer's job: durability
# writes (filesystem, process), runtime persists and ticks (filesystem,
# wall-clock, environment, process), transport-dev and transport open sockets
# (network, thread, and for TLS filesystem and wall-clock too), test-toolkit
# spawns and reads the environment (process, environment), verification runs
# the simulator and the Maelstrom harness (wall-clock, environment, process,
# filesystem, thread), and evidence-tooling is the pipeline that launches
# verifiers (all six, 727 occurrences). Those are architecture, not debt, and
# the scopes below already hold the strictest of them to named symbol denies.
# ---------------------------------------------------------------------------

[profiles.no-ambient-services]
[profiles.no-ambient-services.effects]
deny = [
  "network",
  "async-runtime",
  "database",
  "container-runtime",
  "randomness",
]

# The stricter rule, and the reason it can exist: production reachability
# excludes integration tests, benchmarks, examples, and anything beneath
# #[cfg(test)], so a layer can be held to total purity in the code that ships
# while its own suites still spawn cargo, touch the clock, and write scratch
# directories. no-ambient-services stays attached beside this one because it
# governs those suites too.
[profiles.sealed-production]
reachability = "production"
[profiles.sealed-production.effects]
deny = [
  "filesystem",
  "network",
  "process",
  "thread",
  "wall-clock",
  "environment",
  "async-runtime",
  "database",
  "container-runtime",
  "randomness",
]

# ---------------------------------------------------------------------------
# Layers. Arrows follow the README's model: a sans-IO kernel, a
# persist-before-output runtime boundary, durable storage, an embedded
# application layer, service/multiraft embeddings, and transports at the edge.
# Layer edges cover every Cargo edge kind, so dev-only test-toolkit and
# harness edges appear here too; the dependency_boundary guard keeps the
# normal/dev distinction exact.
# ---------------------------------------------------------------------------

[[layer]]
name = "checksum"
packages = ["rafter-crc32"]
may_depend_on = []
profiles = ["no-ambient-services", "sealed-production"]
reason = "A dependency-free CRC32C primitive shared by storage and wire formats."

[layer.dependencies]
external = "none"

[[layer]]
name = "kernel"
packages = ["rafter"]
may_depend_on = ["test-toolkit"]
profiles = ["no-ambient-services", "sealed-production"]
reason = "The deterministic sans-IO protocol kernel; its only workspace edge is the dev-only invariant-test toolkit."

[layer.dependencies]
external = "locked"

[[layer]]
name = "runtime-boundary"
packages = ["rafter-runtime-api"]
may_depend_on = ["kernel"]
profiles = ["no-ambient-services", "sealed-production"]
reason = "The persist-before-output contract between the kernel and any runtime."

[layer.dependencies]
external = "none"

[[layer]]
name = "durability"
packages = ["rafter-storage"]
may_depend_on = ["kernel", "checksum", "test-toolkit"]
profiles = ["no-ambient-services"]
reason = "Hard-state, log, and snapshot stores beneath the runtime."

[layer.dependencies]
external = "locked"

[[layer]]
name = "wire"
packages = ["rafter-codec"]
may_depend_on = ["kernel", "checksum"]
profiles = ["no-ambient-services", "sealed-production"]
reason = "The versioned peer-message wire format, independent of storage formats."

[layer.dependencies]
external = "locked"

[[layer]]
name = "runtime"
packages = ["rafter-runtime"]
may_depend_on = [
  "kernel",
  "runtime-boundary",
  "durability",
  "test-toolkit",
  "transport-dev",
]
reason = "The durable persist-before-output node; its examples exercise the dev transport, so that edge is dev-only."

[layer.dependencies]
external = "locked"

[[layer]]
name = "application"
packages = ["rafter-app"]
may_depend_on = [
  "kernel",
  "runtime-boundary",
  "runtime",
  "durability",
  "test-toolkit",
]
profiles = ["no-ambient-services", "sealed-production"]
reason = "The embedded replicated state machine; runtime and durability edges are dev-only acceptance harnesses."

[layer.dependencies]
external = "none"

[[layer]]
name = "embedding"
packages = ["rafter-service", "rafter-multiraft"]
may_depend_on = [
  "kernel",
  "application",
  "runtime-boundary",
  "runtime",
  "durability",
]
profiles = ["no-ambient-services", "sealed-production"]
reason = "Async service handles and the many-group host; runtime and durability edges are dev-only acceptance harnesses."

[layer.dependencies]
external = "none"

[[layer]]
name = "transport-dev"
packages = ["rafter-transport-tcp-insecure"]
may_depend_on = ["kernel", "wire"]
reason = "The deliberately insecure TCP transport for examples, tests, and local clusters."

[layer.dependencies]
external = "none"

[[layer]]
name = "transport"
packages = ["rafter-transport-tls"]
may_depend_on = [
  "kernel",
  "wire",
  "checksum",
  "embedding",
  "application",
  "runtime",
  "durability",
]
reason = "The authenticated production transport; application, runtime, and durability edges are dev-only composition fixtures."

[layer.dependencies]
external = "locked"

[[layer]]
name = "test-toolkit"
packages = ["rafter-invariant-test", "rafter-invariant-test-macros"]
may_depend_on = []
reason = "The detector/oracle toolkit and its proc macros, shared by every crate's invariant tests; its lifecycle suites exercise Unix sockets, so it carries no purity profile."

[layer.dependencies]
external = "locked"

[[layer]]
name = "verification"
packages = ["rafter-sim", "rafter-maelstrom"]
may_depend_on = ["kernel", "wire", "runtime", "durability", "test-toolkit"]
profiles = ["no-ambient-services"]
reason = "Deterministic simulation, model checking, and the Maelstrom process harness."

[layer.dependencies]
external = "locked"

[[layer]]
name = "evidence-tooling"
packages = ["rafter-invariants"]
may_depend_on = ["kernel", "verification"]
reason = "The invariant evidence pipeline; it spawns bounded verifier processes and reaches Unix sockets, so it carries no purity profile."

[layer.dependencies]
external = "locked"

# ---------------------------------------------------------------------------
# Format isolation. Disk formats and wire formats evolve independently; these
# denies keep either from quietly borrowing the other, in any dependency kind.
# ---------------------------------------------------------------------------

[[dependency]]
name = "storage-owns-disk-formats"
from = "rafter-storage"
deny = ["rafter-codec"]
reason = "Durable formats must not couple to the peer wire format."

[[dependency]]
name = "codec-owns-wire-formats"
from = "rafter-codec"
deny = ["rafter-storage"]
reason = "The peer wire format must not couple to durable storage formats."

[[dependency]]
name = "runtime-boundary-stays-minimal"
from = "rafter-runtime-api"
deny = ["rafter-storage", "rafter-codec", "tokio"]
reason = "The runtime contract stays a kernel-only boundary with no storage, wire, or async-runtime reach."

# ---------------------------------------------------------------------------
# Source scopes transcribe source_boundary.rs, tightened to everything the
# code already avoids. They cover sibling tests inside src too: the kernel's
# own tests stay deterministic.
# ---------------------------------------------------------------------------

[[scope]]
name = "kernel-sans-io"
include = ["crates/rafter/src/**"]
reason = "The protocol kernel is sans-IO and deterministic: no filesystem, network, process, thread, clock, environment, or async runtime."

[scope.symbols]
deny = [
  "std::fs",
  "std::net",
  "std::io",
  "std::process",
  "std::thread",
  "std::time",
  "std::env",
  "tokio",
  "async_trait",
]

[[scope]]
name = "runtime-boundary-sans-io"
include = ["crates/rafter-runtime-api/src/**"]
reason = "The runtime contract defines persistence obligations without performing IO or binding an async runtime."

[scope.symbols]
deny = [
  "std::fs",
  "std::net",
  "std::io",
  "std::process",
  "std::thread",
  "std::time",
  "std::env",
  "tokio",
  "async_trait",
]

[[scope]]
name = "application-io-free"
include = ["crates/rafter-app/src/**"]
reason = "The embedded state-machine layer stays deterministic; durability and IO belong to the runtime beneath it."

[scope.symbols]
deny = [
  "std::fs",
  "std::net",
  "std::io",
  "std::process",
  "std::thread",
  "std::time",
  "std::env",
  "tokio",
]

[[scope]]
name = "multiraft-io-free"
include = ["crates/rafter-multiraft/src/**"]
reason = "The many-group host schedules deterministically; sockets, clocks, and disks stay with its embedder."

[scope.symbols]
deny = [
  "std::fs",
  "std::net",
  "std::io",
  "std::process",
  "std::thread",
  "std::time",
  "std::env",
  "tokio",
]

# ---------------------------------------------------------------------------
# Owners.
# ---------------------------------------------------------------------------

# A directory owner has no production/test split to narrow — a fixture tree is
# owned wherever it is reached — so this one stays "all". The capability owner
# below is the opposite case: it is narrowed to production reach, which is what
# shrank its allow list from 29 files to the six that actually launch.
[[owner]]
name = "adversarial-fixtures"
kind = "directory"
match = "**/fixtures"
reachability = "all"
allow = [
  "crates/rafter-transport-tls/tests/fixtures",
  "crates/rafter-sim/src/tests/dynamic_membership/fixtures",
  "crates/rafter-invariants/src/evidence/fixtures",
  "crates/rafter-invariants/src/verdict/fixtures",
  "crates/rafter-invariants/src/verdict/report/fixtures",
  "crates/rafter-invariants/src/verification/simulator/schedule/tests/fixtures",
]
reason = "Deliberately broken or data-only fixture trees have named, reviewed owners."

[[owner]]
name = "process-launch-capability"
kind = "capability"
within = ["crates/rafter-invariants/src/**"]
match = "std::process::Command"
reachability = "production"
allow = [
  "crates/rafter-invariants/src/execution/process/anchor.rs",
  "crates/rafter-invariants/src/execution/process/internal_command.rs",
  "crates/rafter-invariants/src/execution/process/launch.rs",
  "crates/rafter-invariants/src/execution/process/spawn.rs",
  "crates/rafter-invariants/src/provenance/image.rs",
  "crates/rafter-invariants/src/provenance/source/tracked.rs",
]
reason = "Production verifier subprocesses launch only through the bounded descriptor-anchored execution path and its two reviewed provenance probes; the twenty-three test-only reachers this list used to name are covered by the profile rails, not by capability ownership."

# ---------------------------------------------------------------------------
# Qualification gates and the architecture invariants they enforce. The
# machine-readable completion manifest in docs/work-completion.md remains the
# authority for the full evidence pipeline; these entries bind the
# architecture-guard subset to its tests and hosted gate.
# ---------------------------------------------------------------------------

[[gate]]
name = "rustdoc"
kind = "local"
path = "scripts/rustdoc-check"
reason = "Builds the publishable crates under -D warnings -D missing-docs; the local half of the public-surface guarantee."

[[gate]]
name = "ci"
kind = "ci"
path = ".github/workflows/ci.yml"
inputs = [
  ".github/actions/setup-rust/action.yml",
  ".github/actions/configure-invariant-cargo/action.yml",
  ".github/actions/setup-invariant-verifier/action.yml",
]
requires = ["rustdoc"]
reason = "Pull-request qualification: lint, workspace tests, reference consumers, and the deterministic invariant aggregate."

[[invariant]]
id = "RAFTER-KERNEL-01"
title = "The protocol kernel stays sans-IO with an empty dependency section"
status = "enforced"
document = "README.md#boundaries"
evidence = [
  "rust-test:crates/rafter/tests/dependency_boundary.rs::rafter_core_dependency_boundary_has_no_higher_layer_dependencies",
  "rust-test:crates/rafter/tests/source_boundary.rs::source_boundary_guard_enforces_lower_layer_source_rules",
  "gate:ci",
]

[[invariant]]
id = "RAFTER-GRAPH-01"
title = "Every workspace dependency edge is declared and reasoned"
status = "enforced"
document = "README.md#crates"
evidence = [
  "rust-test:crates/rafter/tests/dependency_boundary.rs::workspace_dependency_boundary_matches_declared_crate_graph",
  "gate:ci",
]

[[invariant]]
id = "RAFTER-READ-01"
title = "Reviewed modules open with architectural contracts"
status = "enforced"
document = "docs/work-completion.md#public-surface-and-architecture-completion"
evidence = [
  "rust-test:crates/rafter/tests/readability_architecture_guard.rs::production_modules_begin_with_an_architectural_contract",
  "rust-test:crates/rafter/tests/readability_architecture_guard.rs::test_modules_begin_with_a_scenario_contract",
  "gate:ci",
]

[[invariant]]
id = "RAFTER-READ-02"
title = "File sizes ratchet downward under reviewed limits"
status = "enforced"
document = "docs/work-completion.md#public-surface-and-architecture-completion"
evidence = [
  "rust-test:crates/rafter/tests/file_size_guard.rs::file_size_guard_enforces_module_size_limits",
  "gate:ci",
]

[[invariant]]
id = "RAFTER-READ-03"
title = "Inline test modules stay small or move to sibling files"
status = "enforced"
document = "docs/work-completion.md#public-surface-and-architecture-completion"
evidence = [
  "rust-test:crates/rafter/tests/test_location_guard.rs::test_location_guard_limits_large_inline_test_modules",
  "gate:ci",
]

[[invariant]]
id = "RAFTER-DOC-01"
title = "Published crates document their entire public surface"
status = "enforced"
document = "docs/work-completion.md#public-surface-and-architecture-completion"
evidence = [
  "rust-test:crates/rafter/tests/public_api_docs_guard.rs::public_api_docs_guard_detects_missing_docs_and_enum_policy",
  "gate:rustdoc",
  "gate:ci",
]
