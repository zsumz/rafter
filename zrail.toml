# Rafter's executable architecture, checked by zrail (https://github.com/zsumz/zrail).
#
# This contract transcribes conventions the repository already enforces through
# hand-rolled guard tests — crates/rafter/tests/{dependency_boundary,
# source_boundary, readability_architecture_guard, file_size_guard,
# test_location_guard}.rs — into declarative, lock-bound policy. The guards
# remain in force; zrail adds exact dependency identity, shrink-only ratchets,
# and semantic diffs of architecture changes. Two switches are still looser
# than the ambition — macros and facades — and at each one the reason and the
# path back are written at the decision rather than left to a reader to infer.
#
# Everyday commands:
#   zrail check                     # read-only architecture check
#   zrail diff --base HEAD          # classify uncommitted architecture changes
#   zrail update                    # refresh zrail.lock after reviewed changes
#
# The adoption debt ledger (per-file shrink-only ratchets) lives in
# zrail-baseline.toml so this file stays the readable architecture document.
#
# Runs on zrail 0.0.3-rc.5 (contract schema 2, lock semantics epoch 4).
# rc.5 resolved the ordinary-path binding gaps that pinned earlier upgrades,
# migrates locks directly from every prior epoch, and preserves authored
# comments through `migrate-config` and `fmt`.

schema = 2
adapters = ["rust"]
imports = ["zrail-baseline.toml"]

[repository]
roots = ["crates"]
exclude = [
  # trybuild UI cases: compile-fail/pass sources built by the trybuild harness
  # at test runtime, never by a Cargo target of this workspace.
  "crates/rafter-invariant-test/tests/ui/**",
  # Nested build directory produced by exact-package evidence runs.
  "crates/rafter-invariants/target/**",
  # Independent Cargo workspaces beside the product workspace: the reference
  # consumers, the fuzz harness, and the benchmark comparison harness. Each
  # keeps its own manifest graph and its own qualification lanes.
  "reference/**",
  "fuzz/**",
  "bench-compare/**",
]
workspace_members = "exact"
nested_git = "deny"
submodules = "deny"
symlinks = "inside"

# ---------------------------------------------------------------------------
# Dependency identity. The workspace DAG itself is layered below; the guard
# test workspace_dependency_boundary_matches_declared_crate_graph additionally
# pins exact per-crate edges with per-edge reasons, including the normal/dev
# distinction that layer edges deliberately do not model.
# ---------------------------------------------------------------------------

[dependencies]
mode = "locked"
unassigned_packages = "deny"
cycles = "deny"

[[dependencies.crate_root]]
package = "serde"
root = "serde"
reason = "The published serde library exposes the serde crate root."
[dependencies.crate_root.source]
kind = "registry"
requirement = "1"

[[dependencies.crate_root]]
package = "serde_json"
root = "serde_json"
reason = "The published serde_json library exposes the serde_json crate root."
[dependencies.crate_root.source]
kind = "registry"
requirement = "1"

[[dependencies.crate_root]]
package = "clap"
root = "clap"
reason = "The published clap library exposes the clap crate root."
[dependencies.crate_root.source]
kind = "registry"
requirement = "4"

[[dependencies.crate_root]]
package = "proptest"
root = "proptest"
reason = "The published proptest library exposes the proptest crate root."
[dependencies.crate_root.source]
kind = "registry"
requirement = "1"

[[dependencies.crate_root]]
package = "criterion"
root = "criterion"
reason = "The published criterion library exposes the criterion crate root."
[dependencies.crate_root.source]
kind = "registry"
requirement = "0.5"

[[dependencies.crate_root]]
package = "syn"
root = "syn"
reason = "The published syn library exposes the syn crate root."
[dependencies.crate_root.source]
kind = "registry"
requirement = "2"

[[dependencies.crate_root]]
package = "quote"
root = "quote"
reason = "The published quote library exposes the quote crate root."
[dependencies.crate_root.source]
kind = "registry"
requirement = "1"

# ---------------------------------------------------------------------------
# Source policy.
#
# module_docs is "required": the module-contract convention that
# readability_architecture_guard enforces for rafter, rafter-codec, and
# rafter-storage now holds everywhere. The only six files without a leading
# `//!` are the `include!`-mounted fragments, which cannot carry one — an inner
# attribute after the splice point is E0753 — so they are ratcheted in the
# ledger rather than exempted here.
#
# entrypoints is "declarative": every binary hands off to its library, with the
# one reviewed exception reclassified below.
#
# facades stays "allow". The extraction campaign took the ledger far enough
# that this is now a short, nameable list rather than a class of debt: 20 files
# hold 68 items behind a facade path. Nine are implementations wearing a
# mod.rs — rafter-invariants producer (263 lines), maelstrom lease (167) and
# receipt (110), verification/artifact/test_runner, the detector_test proc-macro
# body, rafter-transport-tls directory and session/file, and rafter node
# bootstrap/validate and replication/snapshot/receive. Ten are facades that
# declare their module's own central type or constants inline — `Node`,
# `Message`, `NodeConfig` and its defaults, `Cluster`, the driver type aliases,
# the ALPN constant — which is a house pattern, not debt, and would need a
# policy that distinguishes a declaration from an implementation. One,
# rafter-invariant-test-macros/src/lib.rs, is a proc-macro crate root, where
# Rust requires the entry function to live. The flip waits on the first group
# moving and a reviewed answer for the second.
# ---------------------------------------------------------------------------

[source.rust]
module_docs = "required"
facades = "allow"
entrypoints = "declarative"
tests = "sibling"

# crates/rafter-maelstrom/src/main.rs is not a thin entrypoint that hands off
# to a library: it is the Maelstrom harness itself, 291 lines of node state,
# request routing, and reply obligations that exist only for that binary.
[[source.rust.file_roles]]
path = "crates/rafter-maelstrom/src/main.rs"
role = "implementation"
reason = "The Maelstrom harness is the binary; its node state and reply routing have no library to move behind."

[source.rust.macros]
# "allow", found rather than chosen — for the second time, and for a new
# reason. The 0.0.1 adoption authored a complete deny-unreviewed allowlist and
# could not bind it: that engine resolved a macro name conservatively wherever
# a glob import was in scope, and the sibling tests here open with
# `use super::*` by convention. rc.5 fixed exactly that. The same allowlist,
# restored and extended to 68 reviewed expansions, binds 21,248 of the 21,328
# invocations the engine observes. The 80 it cannot bind are not review debt,
# and no spelling of an allowance reaches them:
#
#   * 71 std invocations in rafter-invariants modules mounted under
#     `#[cfg(unix)]` or `#[cfg(all(test, unix))]`. rc.5 reduces `cfg(feature)`
#     exactly but leaves other target predicates conservative, so a macro
#     origin inside one of those domains stays unresolved. An exact allowance
#     cannot bind an unresolved origin, and a conservative one may not borrow
#     the compiler authority the candidate still carries.
#   * 8 `json!` invocations in the two `include!`-mounted maelstrom fragments,
#     where the splice leaves no origin to bind and serde_json's dependency
#     authority is likewise unborrowable.
#   * 1 `write!` in rafter-service/src/error.rs, whose module declares a child
#     `mod write`. Rust keeps macros and modules in separate namespaces; one
#     occurrence namespace does not, so the origin collides and goes
#     unresolved.
#
# Deny-unreviewed also promotes those unresolved origins into 30 findings on
# ordinary path bindings, 29 of them cascading from a single line —
# `#[cfg(test)] use std::hash::Hash;` in rafter-sim/src/lib.rs, which shadows
# the `Hash` derive in the test compilation domain and leaves every use of
# `Cluster` unresolved across that crate. Neither rule is baselineable, and
# `zrail baseline` refuses to run at all while the analysis is incomplete, so
# this switch gates the module-docs ratchets below as well.
#
# The path back is source, not policy: qualify the three shadowing imports and
# narrow the cfg(unix) mounts, then restore the reviewed allowlist, which is
# recorded with the tightening report that flipped everything else in this
# file.
mode = "allow"

# Item-position expansions still need per-file graph exemptions regardless of
# macro mode; scripts/zrail-reconcile regenerates the block between the
# markers from `zrail check --format json`.
