# ---------------------------------------------------------------------------
# Source policy.
#
# module_docs stays "allow" until the module-contract convention that
# readability_architecture_guard enforces for rafter, rafter-codec, and
# rafter-storage has been extended to the remaining crates (378 files lack a
# leading //! contract today); the flip to "required" is that campaign's
# completion gate. facades and entrypoints stay "allow" because 20 crate roots
# and mod.rs files still hold implementation items (rafter-runtime/src/lib.rs
# alone is ~1,000 lines); the guard test architectural_facades_remain_declarative
# already holds the 127 reviewed facades declarative, and the flip to
# "declarative" is the extraction campaign's completion gate.
# ---------------------------------------------------------------------------

[source.rust]
module_docs = "allow"
facades = "allow"
entrypoints = "allow"
tests = "sibling"

[source.rust.macros]
# "allow", found rather than chosen: this adoption authored a complete
# deny-unreviewed allowlist (58 reviewed expansions; see this branch's history),
# and zrail 0.0.1 could not bind it. The engine resolves macro names
# conservatively wherever a glob import is in scope, and conservative
# observations carry an unresolved origin that no allowance is permitted to
# match, so every `use super::*` test module makes its macros unreviewable by
# policy. Sibling-test files here open with `use super::*` by convention,
# which put ~3,700 reviewed invocations beyond reach. Flip to
# "deny-unreviewed" and restore the allowlist once zrail can bind
# glob-imported names.
mode = "allow"

# Item-position expansions still need per-file graph exemptions regardless of
# macro mode; scripts/zrail-reconcile regenerates the block between the
# markers from `zrail check --format json`.
