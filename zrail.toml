# Rafter's executable architecture, checked by zrail (https://github.com/zsumz/zrail).
#
# This contract transcribes conventions the repository already enforces through
# hand-rolled guard tests — crates/rafter/tests/{dependency_boundary,
# source_boundary, readability_architecture_guard, file_size_guard,
# test_location_guard}.rs — into declarative, lock-bound policy. The guards
# remain in force; zrail adds exact dependency identity, shrink-only ratchets,
# and semantic diffs of architecture changes. Every switch now sits at its
# target posture; where one was ever held looser, the history of the hold and
# what released it are written at the decision rather than left to a reader
# to infer.
#
# Everyday commands:
#   zrail check                     # read-only architecture check
#   zrail diff --base HEAD          # classify uncommitted architecture changes
#   zrail update                    # refresh zrail.lock after reviewed changes
#
# The adoption debt ledger (per-file shrink-only ratchets) lives in
# zrail-baseline.toml so this file stays the readable architecture document.
#
# Runs on zrail 0.0.3-rc.7 (contract schema 2, lock semantics epoch 6).
# rc.7 resolves macro authority by logical namespace: an export set is proven
# through glob re-export chains instead of over-approximated, an include!
# splice borrows its mounting parent's dependency scope, macros and modules
# stop sharing one namespace, and a reviewed allowance may grant conservative
# name-only binding where an origin is genuinely unresolvable. Together those
# closed the macro switch below — the last preset this contract was waiting
# on. Every rail is now at its target posture.

schema = 2
adapters = ["rust"]
imports = ["zrail-baseline.toml"]

[repository]
roots = ["crates"]
exclude = [
  # trybuild UI cases: compile-fail/pass sources built by the trybuild harness
  # at test runtime, never by a Cargo target of this workspace.
  "crates/rafter-invariant-test/tests/ui/**",
  # Nested build directory produced by exact-package evidence runs.
  "crates/rafter-invariants/target/**",
  # Independent Cargo workspaces beside the product workspace: the reference
  # consumers, the fuzz harness, and the benchmark comparison harness. Each
  # keeps its own manifest graph and its own qualification lanes.
  "reference/**",
  "fuzz/**",
  "bench-compare/**",
]
workspace_members = "exact"
nested_git = "deny"
submodules = "deny"
symlinks = "inside"

# ---------------------------------------------------------------------------
# Dependency identity. The workspace DAG itself is layered below; the guard
# test workspace_dependency_boundary_matches_declared_crate_graph additionally
# pins exact per-crate edges with per-edge reasons, including the normal/dev
# distinction that layer edges deliberately do not model.
# ---------------------------------------------------------------------------

[dependencies]
mode = "locked"
unassigned_packages = "deny"
cycles = "deny"

[[dependencies.crate_root]]
package = "serde"
root = "serde"
reason = "The published serde library exposes the serde crate root."
[dependencies.crate_root.source]
kind = "registry"
requirement = "1"

[[dependencies.crate_root]]
package = "serde_json"
root = "serde_json"
reason = "The published serde_json library exposes the serde_json crate root."
[dependencies.crate_root.source]
kind = "registry"
requirement = "1"

[[dependencies.crate_root]]
package = "clap"
root = "clap"
reason = "The published clap library exposes the clap crate root."
[dependencies.crate_root.source]
kind = "registry"
requirement = "4"

[[dependencies.crate_root]]
package = "proptest"
root = "proptest"
reason = "The published proptest library exposes the proptest crate root."
[dependencies.crate_root.source]
kind = "registry"
requirement = "1"

[[dependencies.crate_root]]
package = "criterion"
root = "criterion"
reason = "The published criterion library exposes the criterion crate root."
[dependencies.crate_root.source]
kind = "registry"
requirement = "0.5"

[[dependencies.crate_root]]
package = "syn"
root = "syn"
reason = "The published syn library exposes the syn crate root."
[dependencies.crate_root.source]
kind = "registry"
requirement = "2"

[[dependencies.crate_root]]
package = "quote"
root = "quote"
reason = "The published quote library exposes the quote crate root."
[dependencies.crate_root.source]
kind = "registry"
requirement = "1"

# ---------------------------------------------------------------------------
# Source policy.
#
# module_docs is "required": the module-contract convention that
# readability_architecture_guard enforces for rafter, rafter-codec, and
# rafter-storage now holds everywhere. The only six files without a leading
# `//!` are the `include!`-mounted fragments, which cannot carry one — an inner
# attribute after the splice point is E0753 — so they are ratcheted in the
# ledger rather than exempted here.
#
# entrypoints is "declarative": every binary hands off to its library, with the
# two reviewed exceptions reclassified below. rc.6 reads an entrypoint as
# declarative only when its body is empty or a single expression handoff — no
# branches, no macros, no blocks — which is what reclassified the second one.
#
# facades is "declarative", flipped under rc.6. The list this switch waited on
# was 20 files holding 68 items behind a facade path, in two halves that only
# looked like one class of debt. Ten were facades declaring their own module's
# central type or constants inline — `Node`, `Message`, `NodeConfig` and its
# defaults, `Cluster`, the driver type aliases, the ALPN constant. That was a
# house pattern, not debt, and it needed a policy that could tell a declaration
# from an implementation; rc.6's relaxed conventions are that policy, and all
# ten now pass untouched.
#
# The other half did not change and was not expected to: nine parent modules
# holding behavior their own child modules call. Each is reclassified as an
# implementation below with the reason it belongs at that path, because in
# every case the items are private to the subtree and moving them one level
# down would have to widen their visibility to do it. A tenth reclassification,
# rafter-invariant-test-macros/src/lib.rs, is a one-line move candidate rather
# than a durable implementation, and is marked as such at the entry.
# ---------------------------------------------------------------------------

[source.rust]
module_docs = "required"
facades = "declarative"
entrypoints = "declarative"
tests = "sibling"

# crates/rafter-maelstrom/src/main.rs is not a thin entrypoint that hands off
# to a library: it is the Maelstrom harness itself, 291 lines of node state,
# request routing, and reply obligations that exist only for that binary.
[[source.rust.file_roles]]
path = "crates/rafter-maelstrom/src/main.rs"
role = "implementation"
reason = "The Maelstrom harness is the binary; its node state and reply routing have no library to move behind."

# rc.6 reads a declarative entrypoint as an empty body or a single expression
# handoff — no branches, no macros, no blocks. crates/rafter-invariants/src/main.rs
# hands off to `cli::run` but then maps its Result onto the process exit code,
# which is a `match` with an arm that writes to stderr and returns exit code 2.
[[source.rust.file_roles]]
path = "crates/rafter-invariants/src/main.rs"
role = "implementation"
reason = "The binary owns the process exit contract: mapping the CLI result onto success, failure, and the reserved code-2 error channel is behavior with no library caller to move behind."

# The nine implementations wearing a mod.rs. rc.6's relaxed declarative
# conventions absorbed the ten central-type facades — a module may now declare
# its own type, its defaults, its aliases, and its constants inline — which was
# the half of this list that was never debt. What remains is the other half,
# unchanged by the release: parent modules that hold behavior their own child
# modules call. Each is reclassified here with the reason the implementation
# belongs at that path rather than one level down, because in every case the
# items are private to the subtree and moving them would have to widen their
# visibility to do it.

[[source.rust.file_roles]]
path = "crates/rafter-invariants/src/producer/mod.rs"
role = "implementation"
reason = "The producer driver is the module: layer execution, bundle staging, and the StagedBundle Drop guard that deletes a partial bundle are one lifetime. Splitting the guard from the publish path it protects would let a half-written bundle outlive its owner."

[[source.rust.file_roles]]
path = "crates/rafter-invariants/src/verification/maelstrom/lease/mod.rs"
role = "implementation"
reason = "Lease scanning is a three-stage pipeline — scan_node_logs, bind_history, finalize_scan — folding into one accumulator, with two private helpers that only that accumulator uses. The stages have no meaning apart from each other."

[[source.rust.file_roles]]
path = "crates/rafter-invariants/src/verification/maelstrom/receipt/mod.rs"
role = "implementation"
reason = "Receipt validation is one entry function and the toolchain rule it delegates to. Both read the same receipt shape and validate_toolchain has no caller other than validate."

[[source.rust.file_roles]]
path = "crates/rafter-invariants/src/verification/artifact/test_runner/mod.rs"
role = "implementation"
reason = "The module exists to install exactly one verifier. The zero-sized ExactTestVerifier, its DetectorLogVerifier implementation, and the static instance callers receive are a single registration; separating them would have to make the type public."

[[source.rust.file_roles]]
path = "crates/rafter-invariant-test-macros/src/detector_test/mod.rs"
role = "implementation"
reason = "Parsing, validating, and expanding the attribute is the module's whole purpose, and each private validator is called only by the expansion step declared directly above it."

[[source.rust.file_roles]]
path = "crates/rafter-transport-tls/src/directory/mod.rs"
role = "implementation"
reason = "InstalledPeerPolicy and TlsPeerDirectory are declared here, and these are their own inherent and Clone implementations. The child modules hold the directory's error and lease vocabulary, not its behavior."

[[source.rust.file_roles]]
path = "crates/rafter-transport-tls/src/session/file/mod.rs"
role = "implementation"
reason = "from_parts is the store's single private constructor, called twice from the open child module. It stays at the parent so no child has to learn the field layout, and so the Mutex-wrapped Inner it seals stays private to the subtree."

[[source.rust.file_roles]]
path = "crates/rafter/src/node/bootstrap/validate/mod.rs"
role = "implementation"
reason = "The author rule is deliberately sited in the one place that sees only a durable image, beside the BootstrapState validation that applies it. The log child module holds the per-entry checks these call."

[[source.rust.file_roles]]
path = "crates/rafter/src/node/replication/snapshot/receive/mod.rs"
role = "implementation"
reason = "Three private Node helpers shared by the chunk, disposition, and whole child modules. They are the follower-side snapshot authority those siblings agree on; moving them into any one of the three would invert the dependency."

# Not an implementation by intent — a one-line move candidate. rc.6 reads a
# procedural-macro entrypoint as declarative only when its body is a single
# expression handoff, and this one binds a local first:
#
#     let arguments = arguments.into();
#     detector_test::expand(&arguments, item.into()).into()
#
# Inlining that conversion into the call makes the file declarative and this
# override stale. It is recorded as an override rather than a source edit
# because the flip was scoped to policy.
[[source.rust.file_roles]]
path = "crates/rafter-invariant-test-macros/src/lib.rs"
role = "implementation"
reason = "The proc-macro entry converts its own argument stream before handing off, so the crate root holds one statement of behavior."

[source.rust.macros]
# "deny-unreviewed", landed on the fourth attempt. Every macro expansion in
# the repository now binds a reviewed allowance below or is denied. The three
# holds that survived rc.6 — 39 invocations no allowance spelling could reach
# — each closed as an engine change in rc.7, not as a source edit here:
#
#   * 30 -> 0. The std invocations reaching the crate through the
#     `pub(super) use crate::*` chains in crates/rafter/src/node/tests no
#     longer carry a phantom `repository:rafter` candidate. rc.7 proves the
#     export set of a glob chain, and package rafter defines no macros, so
#     the compiler candidate stands alone and binds.
#   * 8+1 -> 0 by grant. The `serde_json::json` in the `include!`-mounted
#     maelstrom fragments (and one fixture site beside them) still resolve to
#     an unresolved origin — a splice has no import graph of its own — but an
#     allowance may now carry `resolution = "conservative"` and grant a
#     reviewed name-only binding for exactly that boundary. The entry below
#     does, and says why.
#   * 1 -> 0. The `write!` beside `mod write` in rafter-service/src/error.rs:
#     macros and modules now live in separate namespaces, as in Rust itself,
#     so the collision is gone and the std allowance binds.
#
# The alternative was three source edits (privatize the node/tests globs,
# de-`include!` the fragments, rename the write module); none was needed, and
# the sources keep their natural shape.
#
# The allowlist that follows is the reviewed expansion surface: 61 entries,
# authored at 0.0.1, re-proven at each engine generation since, and
# reconciled to rc.7 by the engine's own findings — seven prelude-compromise
# entries retired as unreachable once `proptest::prelude` resolved, and the
# stale opaque-input claims went with them. Each entry names the narrowest
# provenance class its occurrences actually resolve to; the engine enforces
# that match per occurrence, so a loosened entry fails the gate rather than
# widening silently. Twenty-three entries additionally attest
# `field_mutation = "none"` — reviewed: their expansions write, mutably
# borrow, and mutate no governed field — which is what lets the field
# ownership rail at the bottom of this contract see through them.
mode = "deny-unreviewed"

# Compiler-builtin derives. The compiler expands these itself and zrail reads
# the generated implementations directly, so they carry no provenance claim.

