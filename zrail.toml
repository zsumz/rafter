# Repository-owned expansions, in two groups with two different provenance
# proofs. The seven cross-crate toolkit exports — the six `oracle_*` rules and
# the `detector_test` attribute — are consumed from crates other than the one
# that defines them, so no `definition` path can name their origin; they bind
# through rc.6's repository source authority, which resolves the providing
# package, hashes its owned input closure into the lock, and carries the
# `ambient_inputs = "none"` attestation reviewed below. The remaining six are
# local `macro_rules!` that collapse a repeated test or impl shape inside one
# module, and each is narrowed to the exact file that defines it.
#
# `ambient_inputs = "none"` is a review claim, not an engine proof. It holds
# here because the six `oracle_*` rules are `macro_rules!` — token-driven by
# construction — and because rafter-invariant-test-macros is a proc-macro crate
# with no build script and no `env!`, `option_env!`, `std::env`, `std::fs`,
# `include*!`, or process use anywhere in its sources; its whole dependency set
# is proc-macro2, quote, and syn. Output depends only on invocation tokens.

