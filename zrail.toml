# ---------------------------------------------------------------------------
# Owners.
# ---------------------------------------------------------------------------

# A directory owner has no production/test split to narrow — a fixture tree is
# owned wherever it is reached — so this one stays "all". The capability owner
# below is the opposite case: it is narrowed to production reach, which is what
# shrank its allow list from 29 files to the six that actually launch.
[[owner]]
name = "adversarial-fixtures"
kind = "directory"
match = "**/fixtures"
reachability = "all"
allow = [
  "crates/rafter-transport-tls/tests/fixtures",
  "crates/rafter-sim/src/tests/dynamic_membership/fixtures",
  "crates/rafter-invariants/src/evidence/fixtures",
  "crates/rafter-invariants/src/verdict/fixtures",
  "crates/rafter-invariants/src/verdict/report/fixtures",
  "crates/rafter-invariants/src/verification/simulator/schedule/tests/fixtures",
]
reason = "Deliberately broken or data-only fixture trees have named, reviewed owners."

[[owner]]
name = "process-launch-capability"
kind = "capability"
within = ["crates/rafter-invariants/src/**"]
match = "std::process::Command"
reachability = "production"
allow = [
  "crates/rafter-invariants/src/execution/process/anchor.rs",
  "crates/rafter-invariants/src/execution/process/internal_command.rs",
  "crates/rafter-invariants/src/execution/process/launch.rs",
  "crates/rafter-invariants/src/execution/process/spawn.rs",
  "crates/rafter-invariants/src/provenance/image.rs",
  "crates/rafter-invariants/src/provenance/source/tracked.rs",
]
reason = "Production verifier subprocesses launch only through the bounded descriptor-anchored execution path and its two reviewed provenance probes; the twenty-three test-only reachers this list used to name are covered by the profile rails, not by capability ownership."


# The field-mutation ownership rail, raised once deny-unreviewed landed: with
# every macro expansion reviewed, twenty-three of the allowances above carry
# `field_mutation = "none"` — the narrow attestation that their expansions
# write, mutably borrow, and mutate no governed field — and that claim is what
# turns ~25,000 opaque-expansion candidates into the real mutation surface.
# Every owner here is production-scoped, like the capability owner above:
# tests construct scenarios by writing node state directly, and that freedom
# is deliberate.
#
# Eight owners hold. Three more were drafted, verified against the engine, and
# are parked below the eight until three specific engine gaps close:
#
#   * node-commit-index-authority and node-applied-index-authority each meet
#     one write through a local binding of the owned type
#     (construction.rs `volatile.commit_index = parts.commit_index`, and
#     `node.volatile.applied_index = floor`), which the engine cannot resolve
#     to one exact field identity — OWN-006 inside the owner's own allowed
#     file, failing closed on writes the rule intends to permit.
#   * node-configuration-index-authority (field-mutation on
#     DerivedState::configuration) fires OWN-003 on dispatch.rs's match arm
#     destructuring `Input::DangerousRawConfigurationProposal::configuration`
#     — a by-value read of a same-named field on an unrelated type.
#
# One rule is wider than its first draft, on reviewed evidence rather than
# ambition: leader-state writes flagged nine interior-bookkeeping sites
# (`self.leader.ticks += 1` and kin), and the engine does not yet distinguish
# assignment through a projection of a field from replacement of the field
# itself, so the owner covers the whole leadership-module surface and says so.

[[owner]]
name = "node-term-authority"
kind = "field-write"
reachability = "production"
within = ["crates/rafter/src/**"]
match = "crate::node::state::core::PersistentState::current_term"
allow = ["crates/rafter/src/node/election.rs", "crates/rafter/src/node/lifecycle.rs"]
reason = "The current term advances only where an election or a lifecycle transition decides it."

[[owner]]
name = "node-vote-authority"
kind = "field-write"
reachability = "production"
within = ["crates/rafter/src/**"]
match = "crate::node::state::core::PersistentState::voted_for"
allow = ["crates/rafter/src/node/election.rs", "crates/rafter/src/node/lifecycle.rs"]
reason = "A vote is recorded only where an election or a lifecycle transition decides it."

[[owner]]
name = "node-role-authority"
kind = "field-write"
reachability = "production"
within = ["crates/rafter/src/**"]
match = "crate::node::state::core::VolatileState::role"
allow = ["crates/rafter/src/node/election.rs", "crates/rafter/src/node/lifecycle.rs"]
reason = "Role changes only through an election outcome or a lifecycle transition."

[[owner]]
name = "node-leader-state-authority"
kind = "field-write"
reachability = "production"
within = ["crates/rafter/src/**"]
match = "crate::node::Node::leader"
allow = [
  "crates/rafter/src/node/lifecycle.rs",
  "crates/rafter/src/node/election.rs",
  "crates/rafter/src/node/transfer.rs",
  "crates/rafter/src/node/replication/send.rs",
  "crates/rafter/src/node/replication/authority.rs",
]
reason = "Leader state lives in the leadership modules: replaced wholesale at lifecycle transitions, and its interior bookkeeping (tick counters, pending transfer, deposition waiver, lease) advances only in election, transfer, and replication send/authority."

[[owner]]
name = "node-derived-state-authority"
kind = "field-write"
reachability = "production"
within = ["crates/rafter/src/**"]
match = "crate::node::Node::derived"
allow = ["crates/rafter/src/node/log.rs"]
reason = "Derived state is rebuilt only where the log that derives it changes."

[[owner]]
name = "node-election-progress-authority"
kind = "field-mutation"
reachability = "production"
within = ["crates/rafter/src/**"]
match = "crate::node::Node::election"
mutating_methods = ["advance_timeout", "begin_election", "begin_pre_vote", "record_pre_vote", "record_vote"]
allow = ["crates/rafter/src/node/election.rs"]
reason = "Election progress advances only in the election module."

[[owner]]
name = "node-election-lifecycle-authority"
kind = "field-mutation"
reachability = "production"
within = ["crates/rafter/src/**"]
match = "crate::node::Node::election"
mutating_methods = ["enter_leadership", "reset_for_follower"]
allow = ["crates/rafter/src/node/lifecycle.rs"]
reason = "Entering leadership and falling back to follower are lifecycle transitions."

[[owner]]
name = "node-election-timeout-authority"
kind = "field-mutation"
reachability = "production"
within = ["crates/rafter/src/**"]
match = "crate::node::Node::election"
mutating_methods = ["reset_timeout"]
allow = [
  "crates/rafter/src/node/election.rs",
  "crates/rafter/src/node/replication/receive.rs",
  "crates/rafter/src/node/replication/snapshot/receive/mod.rs",
]
reason = "The election timeout resets on an election step or on accepted leader traffic."


# ---------------------------------------------------------------------------
# Qualification gates and the architecture invariants they enforce. The
# machine-readable completion manifest in docs/work-completion.md remains the
# authority for the full evidence pipeline; these entries bind the
# architecture-guard subset to its tests and hosted gate.
# ---------------------------------------------------------------------------

[[gate]]
name = "rustdoc"
kind = "local"
path = "scripts/rustdoc-check"
reason = "Builds the publishable crates under -D warnings -D missing-docs; the local half of the public-surface guarantee."

[[gate]]
name = "ci"
kind = "ci"
path = ".github/workflows/ci.yml"
inputs = [
  ".github/actions/setup-rust/action.yml",
  ".github/actions/configure-invariant-cargo/action.yml",
  ".github/actions/setup-invariant-verifier/action.yml",
]
requires = ["rustdoc"]
reason = "Pull-request qualification: lint, workspace tests, reference consumers, and the deterministic invariant aggregate."

[[invariant]]
id = "RAFTER-KERNEL-01"
title = "The protocol kernel stays sans-IO with an empty dependency section"
status = "enforced"
document = "README.md#boundaries"
evidence = [
  "rust-test:crates/rafter/tests/dependency_boundary.rs::rafter_core_dependency_boundary_has_no_higher_layer_dependencies",
  "rust-test:crates/rafter/tests/source_boundary.rs::source_boundary_guard_enforces_lower_layer_source_rules",
  "gate:ci",
]

[[invariant]]
id = "RAFTER-GRAPH-01"
title = "Every workspace dependency edge is declared and reasoned"
status = "enforced"
document = "README.md#crates"
evidence = [
  "rust-test:crates/rafter/tests/dependency_boundary.rs::workspace_dependency_boundary_matches_declared_crate_graph",
  "gate:ci",
]

[[invariant]]
id = "RAFTER-READ-01"
title = "Reviewed modules open with architectural contracts"
status = "enforced"
document = "docs/work-completion.md#public-surface-and-architecture-completion"
evidence = [
  "rust-test:crates/rafter/tests/readability_architecture_guard.rs::production_modules_begin_with_an_architectural_contract",
  "rust-test:crates/rafter/tests/readability_architecture_guard.rs::test_modules_begin_with_a_scenario_contract",
  "gate:ci",
]

[[invariant]]
id = "RAFTER-READ-02"
title = "File sizes ratchet downward under reviewed limits"
status = "enforced"
document = "docs/work-completion.md#public-surface-and-architecture-completion"
evidence = [
  "rust-test:crates/rafter/tests/file_size_guard.rs::file_size_guard_enforces_module_size_limits",
  "gate:ci",
]

[[invariant]]
id = "RAFTER-READ-03"
title = "Inline test modules stay small or move to sibling files"
status = "enforced"
document = "docs/work-completion.md#public-surface-and-architecture-completion"
evidence = [
  "rust-test:crates/rafter/tests/test_location_guard.rs::test_location_guard_limits_large_inline_test_modules",
  "gate:ci",
]

[[invariant]]
id = "RAFTER-DOC-01"
title = "Published crates document their entire public surface"
status = "enforced"
document = "docs/work-completion.md#public-surface-and-architecture-completion"
evidence = [
  "rust-test:crates/rafter/tests/public_api_docs_guard.rs::public_api_docs_guard_detects_missing_docs_and_enum_policy",
  "gate:rustdoc",
  "gate:ci",
]
